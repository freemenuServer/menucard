<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Signature 3D Menu</title>
<meta name="description" content="Signature 3D restaurant menu with 360° viewing and AR room placement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
:root{
  --gold:#e8b34b;--gold2:#f6d27c;--ink:#101214;--muted:#6b7078;--line:#e9eaed;
  --soft:#f7f7f5;--green:#159447;--red:#d72f35;--white:#fff;--dark:#111417;
  --shadow:0 10px 30px rgba(16,18,20,.08);--radius:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#eef0f2;color:var(--ink);font-family:"DM Sans",sans-serif}
button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
img{display:block;width:100%;object-fit:cover}
.app{max-width:1180px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 60px rgba(0,0,0,.08)}
.hero{position:relative;min-height:270px;color:#fff;overflow:hidden;background:#16181a}
.hero-bg{position:absolute;inset:0;background-position:center;background-size:cover;filter:brightness(.58)}
.hero-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,8,.94),rgba(5,7,8,.66) 48%,rgba(5,7,8,.22))}
.hero-inner{position:relative;z-index:1;padding:28px 40px 34px;min-height:270px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand-row{display:flex;align-items:center;gap:18px}
.logo{width:82px;height:82px;border-radius:50%;border:2px solid var(--gold2);background:rgba(0,0,0,.35);display:grid;place-items:center;overflow:hidden;flex:0 0 auto}
.logo img{height:100%;object-fit:cover}
.logo-fallback{font-size:35px;color:var(--gold2)}
.brand h1{font-family:"Playfair Display",serif;font-size:48px;line-height:1.02;margin:0;letter-spacing:-1px}
.tagline{margin-top:8px;color:#f0f0f0;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:16px;font-size:14px;color:#eee}
.meta span{display:inline-flex;align-items:center;gap:7px}
.hero-actions{display:flex;gap:10px;align-items:center}
.circle-btn{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:#fff;color:#151515;display:grid;place-items:center;font-size:20px}
.circle-btn.wa{background:#1fc65a;color:#fff;border-color:#1fc65a}
.hero-script{font-family:"Playfair Display",serif;font-style:italic;font-size:28px;color:var(--gold2);text-align:right;line-height:1.1}

.plan-strip{background:#101417;color:#fff;padding:11px 24px;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;font-size:12px;font-weight:700}
.plan-strip span{display:inline-flex;align-items:center;gap:7px}
.plan-strip b{color:var(--gold2)}

.content{padding:0 34px 110px}
.categories{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);display:flex;gap:10px;overflow:auto;padding:14px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat{border:0;background:#f0f1f3;border-radius:999px;padding:11px 18px;white-space:nowrap;font-weight:700;color:#30343a}
.cat.active{background:linear-gradient(135deg,var(--gold),#f3c966);color:#171717}
.search-wrap{margin:18px 0;position:relative}
.search-wrap input{width:100%;border:1px solid var(--line);background:#fafafa;border-radius:14px;padding:14px 16px 14px 44px;outline:none}
.search-wrap:before{content:"⌕";position:absolute;left:15px;top:7px;font-size:25px;color:#70757d}

.ar-hero{margin-top:8px;border-radius:20px;overflow:hidden;min-height:175px;color:#fff;position:relative;background:#111}
.ar-hero-bg{position:absolute;inset:0;background:center/cover no-repeat;filter:brightness(.52)}
.ar-hero-content{position:relative;padding:30px 34px;min-height:175px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.ar-hero h2{margin:0;font-size:30px;line-height:1.05}
.ar-hero h2 span{color:var(--gold2)}
.ar-hero p{margin:10px 0 0;font-size:15px;color:#f1f1f1}
.ar-hero-phone{width:235px;align-self:stretch;display:flex;align-items:center;justify-content:center}
.ar-hero-phone model-viewer{width:100%;height:175px;background:transparent;--poster-color:transparent}
.ar-hero-copy{max-width:640px}

.section{margin-top:28px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}
.section-head h2{font-family:"Playfair Display",serif;font-size:31px;margin:0}
.section-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.count-badge{padding:7px 11px;border-radius:999px;background:#fff5dc;color:#805800;font-size:12px;font-weight:800;white-space:nowrap}

.ar-grid{display:grid;grid-template-columns:1fr;gap:14px}
.ar-card{border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow);display:grid;grid-template-columns:42% 1fr;overflow:hidden;min-height:255px}
.ar-visual{position:relative;background:radial-gradient(circle at 50% 42%,#30343a,#0d0f11 70%);min-height:255px}
.ar-visual model-viewer{width:100%;height:100%;min-height:255px;background:transparent;--poster-color:transparent}
.ar-photo{width:100%;height:100%;min-height:255px;object-fit:cover}
.model-note{position:absolute;left:12px;bottom:12px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.68);color:#fff;font-size:11px;font-weight:700;z-index:2}
.badge-3d{position:absolute;left:12px;top:12px;background:#fff;color:#0d4b8c;border-radius:999px;padding:7px 10px;font-weight:900;font-size:12px;z-index:2}
.rotate-badge{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.7);color:#fff;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:700;z-index:2}
.ar-info{padding:24px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.dish-title-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dish-title{font-family:"Playfair Display",serif;font-size:27px;font-weight:700}
.crown{color:#e7a516;font-size:25px}
.signature-pill{background:linear-gradient(135deg,#f2c15b,#e6a938);color:#171717;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:900}
.type-pill{display:inline-flex;align-items:center;gap:7px;margin-top:10px;width:max-content;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
.type-pill.veg{background:#eaf8ef;color:#12853d}.type-pill.nonveg{background:#fff0f0;color:#c4252c}.type-pill.egg{background:#fff7df;color:#9a7100}
.desc{font-size:15px;line-height:1.55;color:#5e646d;margin:10px 0 12px;max-width:650px}
.price{font-size:27px;font-weight:900;margin-bottom:14px}
.ar-actions{display:flex;gap:10px;flex-wrap:wrap}
.ar-btn{border:0;border-radius:13px;padding:12px 18px;font-weight:900;background:linear-gradient(135deg,#e8b34b,#f3ce78);color:#171717}
.info-btn{border:1px solid var(--line);border-radius:13px;padding:11px 15px;background:#fff;font-weight:800}

.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.photo-card{border:1px solid var(--line);border-radius:17px;padding:9px;background:#fff;display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center}
.photo-card img{height:110px;border-radius:12px}
.photo-card.no-photo{grid-template-columns:1fr}
.photo-card.no-photo .photo-media{display:none}
.photo-media{position:relative}
.photo-info{min-width:0}
.photo-name{font-family:"Playfair Display",serif;font-size:19px;font-weight:700}
.photo-desc{font-size:13px;color:#69707a;line-height:1.45;margin:5px 0 8px}
.photo-price{font-size:20px;font-weight:900}

.empty{border:1px dashed #d8dbe0;border-radius:18px;padding:24px;text-align:center;color:#69707a;background:#fafafa}
.access{min-height:70vh;display:grid;place-items:center;padding:30px}
.access-box{max-width:540px;text-align:center;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:var(--shadow)}
.access-box h2{margin:0 0 8px}.access-box p{color:var(--muted);line-height:1.5}
.access-box button{border:0;background:#e8b34b;border-radius:12px;padding:12px 18px;font-weight:800}

.footer{margin-top:34px;background:#101417;color:#fff;padding:28px 24px;text-align:center}
.footer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.footer-item{font-size:13px;color:#f3f3f3}.footer-item b{display:block;font-size:22px;color:var(--gold2);margin-bottom:6px}
.footer-note{margin-top:22px;font-family:"Playfair Display",serif;font-style:italic;color:#f2d27f;font-size:20px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#111;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:800px){
  .hero-inner{padding:24px 20px;align-items:flex-end}.brand h1{font-size:36px}.hero-script{display:none}.hero-actions{position:absolute;right:18px;top:18px}.hero-actions .circle-btn{width:42px;height:42px}
  .content{padding:0 16px 100px}.ar-hero-content{padding:24px 20px}.ar-hero-phone{display:none}.ar-hero h2{font-size:27px}
  .ar-card{grid-template-columns:1fr}.ar-visual{min-height:300px}.ar-visual model-viewer{min-height:300px}.ar-info{padding:20px}.photo-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  .hero{min-height:235px}.hero-inner{min-height:235px;padding:20px 15px}.logo{width:62px;height:62px}.brand h1{font-size:29px}.tagline{font-size:12px}.meta{font-size:11px;gap:7px 12px}.hero-actions{gap:6px}.circle-btn{width:38px!important;height:38px!important;font-size:16px}
  .plan-strip{gap:10px 15px;padding:10px 12px;font-size:10px}.content{padding:0 11px 90px}.categories{margin:0 -11px;padding:12px 11px}.cat{padding:9px 13px;font-size:12px}
  .ar-hero{border-radius:16px}.ar-hero h2{font-size:24px}.ar-hero p{font-size:13px}
  .section-head h2{font-size:26px}.section-head p{font-size:12px}.count-badge{font-size:10px}
  .ar-visual,.ar-visual model-viewer{min-height:245px}.dish-title{font-size:23px}.desc{font-size:13px}.price{font-size:24px}.ar-btn{width:100%}.info-btn{width:100%}
  .photo-card{grid-template-columns:100px 1fr;gap:10px}.photo-card img{height:88px}.photo-name{font-size:16px}.photo-desc{font-size:11px}.photo-price{font-size:18px}
  .footer-grid{grid-template-columns:1fr 1fr;gap:14px}.footer-note{font-size:17px}
}

/* Customer-facing menu: never show internal plan/pricing marketing strips. */
.plan-strip,.footer-grid,.footer-note{display:none!important}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="loading" class="access"><div class="access-box"><h2>Loading Signature 3D Menu…</h2><p>Please wait.</p></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://pfsrpowopbrevocwsuii.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

let restaurant=null;
let allItems=[];
let arItems=[];
let photoItems=[];
let selectedCategory="All Items";

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function slug(){
  return (new URLSearchParams(location.search).get("r")||"").trim().toLowerCase();
}
function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1800);
}
function isSignaturePlan(plan){
  if(!plan)return false;
  const key=`${plan.slug||""} ${plan.name||""}`.toLowerCase();
  return (
    key.includes("signature 3d") ||
    key.includes("signature-3d") ||
    key.includes("signature_3d") ||
    (key.includes("signature") && key.includes("3d"))
  );
}
function categoryKey(i){
  return String(i.category||i.category_name||"Other").trim()||"Other";
}
function itemImage(i){
  return String(i.image_url||i.photo_url||i.image||i.photo||"").trim();
}
function itemModel(i){
  return String(i.ar_model_url||i.model_3d_url||i.glb_url||i.model_url||"").trim();
}
function itemUsdz(i){
  return String(i.ar_usdz_url||i.usdz_url||i.ios_model_url||"").trim();
}
function isAR(i){
  return Boolean(
    itemModel(i) &&
    i.ar_enabled !== false &&
    i.signature_3d !== false &&
    (i.is_ar !== false)
  );
}
function itemType(i){
  const t=String(i.item_type||i.type||"").toLowerCase();
  if(t==="veg")return ["veg","Veg"];
  if(t==="egg")return ["egg","Egg"];
  return ["nonveg","Non-Veg"];
}
function price(i){
  const p=i.price ?? i.price_full ?? i.price_half ?? i.price_quarter;
  return p==null||p===""?"":`₹${Number(p).toLocaleString("en-IN")}`;
}
function formatTime(v){
  if(!v)return "";
  const p=String(v).split(":");let h=Number(p[0]),m=Number(p[1]||0);
  const ap=h>=12?"PM":"AM";h=h%12||12;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")} ${ap}`;
}
function restaurantHero(){
  return String(restaurant?.banner_url||restaurant?.cover_url||restaurant?.banner||restaurant?.cover||"").trim();
}
function logoUrl(){
  return String(restaurant?.logo_url||restaurant?.logo||"").trim();
}

function renderShell(){
  const bg=restaurantHero();
  const logo=logoUrl();
  const name=esc(restaurant?.name||"Restaurant");
  const tagline=esc(restaurant?.tagline||restaurant?.description||"Authentic Flavors, Memorable Moments");
  const address=esc(restaurant?.address||restaurant?.location||restaurant?.city||"");
  const hours=(formatTime(restaurant?.opening_time)&&formatTime(restaurant?.closing_time))
    ? `${formatTime(restaurant.opening_time)} – ${formatTime(restaurant.closing_time)}` : "";
  const phone=String(restaurant?.phone||"").replace(/[^\d+]/g,"");
  const logoHtml=logo
    ? `<img src="${esc(logo)}" alt="${name} logo" onerror="this.parentElement.innerHTML='<div class=&quot;logo-fallback&quot;>♨</div>'">`
    : `<div class="logo-fallback">♨</div>`;

  $("app").innerHTML=`
    <header class="hero">
      <div class="hero-bg" style="${bg?`background-image:url('${esc(bg).replace(/'/g,"%27")}')`:''}"></div>
      <div class="hero-inner">
        <div>
          <div class="brand-row">
            <div class="logo">${logoHtml}</div>
            <div>
              <h1>${name}</h1>
              <div class="tagline">${tagline}</div>
            </div>
          </div>
          <div class="meta">
            ${restaurant?.is_open===false||restaurant?.status==="closed"?'<span>🔴 Closed</span>':'<span>🟢 Open Now</span>'}
            ${hours?`<span>◷ ${esc(hours)}</span>`:""}
            ${address?`<span>📍 ${address}</span>`:""}
          </div>
        </div>
        <div>
          <div class="hero-actions">
            ${phone?`<a class="circle-btn" href="tel:${phone}" aria-label="Call restaurant">☎</a>`:""}
            ${phone?`<a class="circle-btn wa" href="https://wa.me/${phone.replace(/^\\+/,"")}" target="_blank" rel="noopener" aria-label="WhatsApp">◉</a>`:""}
            <button class="circle-btn" onclick="shareMenu()" aria-label="Share">↗</button>
          </div>
          <div class="hero-script">Good Food<br><span>Good Mood</span></div>
        </div>
      </div>
    </header>

    <main class="content">
      <nav class="categories" id="categories"></nav>
      <div class="search-wrap"><input id="search" type="search" placeholder="Search for dishes..."></div>

      <section class="ar-hero">
        <div class="ar-hero-bg" style="${bg?`background-image:url('${esc(bg).replace(/'/g,"%27")}')`:''}"></div>
        <div class="ar-hero-content">
          <div class="ar-hero-copy">
            <h2>Experience Our<br><span>Signature Dishes in 3D AR</span></h2>
            <p>Scan, View, Rotate & Place in Your Space</p>
          </div>
          ${arItems[0]&&itemModel(arItems[0])?`<div class="ar-hero-phone"><model-viewer src="${esc(itemModel(arItems[0]))}" ${itemUsdz(arItems[0])?`ios-src="${esc(itemUsdz(arItems[0]))}"`:""} camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look" interaction-prompt="none" alt="${esc(arItems[0].name||"Signature dish")}"></model-viewer></div>`:""}
        </div>
      </section>

      <section class="section" id="signatureSection">
        <div class="section-head">
          <div><h2>★ Our Signature 3D Dishes</h2><p>Tap “View in AR” to see the dish in 3D and place it in your space.</p></div>
          <span class="count-badge">${arItems.length} Signature dishes</span>
        </div>
        <div class="ar-grid" id="arGrid"></div>
      </section>

      <section class="section" id="photoSection">
        <div class="section-head">
          <div><h2>More Delicious Choices</h2><p>Explore more dishes from our menu.</p></div>
        </div>
        <div class="photo-grid" id="photoGrid"></div>
      </section>
    </main>

  `;

  $("search").addEventListener("input",renderItems);
  renderCategories();
  renderItems();
}

function renderCategories(){
  const cats=["All Items",...new Set(allItems.map(categoryKey))];
  $("categories").innerHTML=cats.map(c=>`<button class="cat ${selectedCategory===c?"active":""}" onclick="selectCategory('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`).join("");
}
function selectCategory(c){selectedCategory=c;renderCategories();renderItems();$("signatureSection").scrollIntoView({behavior:"smooth",block:"start"});}
function filtered(){
  const q=$("search")?.value.trim().toLowerCase()||"";
  return allItems.filter(i=>{
    const c=categoryKey(i),hay=`${i.name||""} ${i.description||""} ${c}`.toLowerCase();
    return (selectedCategory==="All Items"||c===selectedCategory)&&(!q||hay.includes(q));
  });
}
function renderItems(){
  const items=filtered();
  const ar=items.filter(isAR).slice(0,5);
  const photos=items.filter(i=>!ar.includes(i));
  $("arGrid").innerHTML=ar.length?ar.map(renderAR).join(""):`<div class="empty">No 3D dishes are available in this category yet.</div>`;
  $("photoGrid").innerHTML=photos.length?photos.map(renderPhoto).join(""):`<div class="empty">No additional menu items found.</div>`;
  const count=$(".count-badge");
  if(count)count.textContent=`${ar.length} Signature dishes`;
}
function renderAR(i){
  const [type,label]=itemType(i),model=itemModel(i),usdz=itemUsdz(i),img=itemImage(i);
  const title=esc(i.name||"Signature Dish"),description=esc(i.description||"Signature dish");
  const p=price(i);
  return `<article class="ar-card">
    <div class="ar-visual">
      <span class="badge-3d">3D</span>
      <model-viewer src="${esc(model)}" ${usdz?`ios-src="${esc(usdz)}"`:""} ${img?`poster="${esc(img)}"`:""} camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look" interaction-prompt="auto" loading="lazy" alt="${title} 3D model"></model-viewer>
      <span class="model-note">Drag to rotate • Pinch to zoom</span>
      <span class="rotate-badge">360° Interactive</span>
    </div>
    <div class="ar-info">
      <div class="dish-title-line"><span class="dish-title">${title}</span><span class="crown">♛</span><span class="signature-pill">Signature 3D</span></div>
      <div class="desc">${description}</div>
      ${p?`<div class="price">${p}</div>`:""}
      <span class="type-pill ${type}">${type==="veg"?"🟢":type==="egg"?"🟡":"🔴"} ${label}</span>
      <div class="ar-actions">
        <button class="ar-btn" onclick="openAR(this)" data-model="${esc(model)}" data-usdz="${esc(usdz)}">⬡ View in AR</button>
        <button class="info-btn" onclick="this.closest('.ar-card').querySelector('model-viewer').focus()">↻ Rotate 360°</button>
      </div>
    </div>
  </article>`;
}
function renderPhoto(i){
  const [type,label]=itemType(i),img=itemImage(i),title=esc(i.name||"Menu Item"),description=esc(i.description||"");
  return `<article class="photo-card ${img?"":"no-photo"}">
    <div class="photo-media">${img?`<img src="${esc(img)}" alt="${title}" loading="lazy" onerror="this.closest('.photo-card').classList.add('no-photo');this.remove()">`:""}</div>
    <div class="photo-info">
      <div class="photo-name">${title}</div>
      ${description?`<div class="photo-desc">${description}</div>`:""}
      ${price(i)?`<div class="photo-price">${price(i)}</div>`:""}
      <span class="type-pill ${type}">${type==="veg"?"🟢":type==="egg"?"🟡":"🔴"} ${label}</span>
    </div>
  </article>`;
}
function openAR(btn){
  const model=btn.dataset.model||"",usdz=btn.dataset.usdz||"";
  const viewer=btn.closest(".ar-card")?.querySelector("model-viewer");
  if(viewer&&typeof viewer.activateAR==="function"){
    viewer.activateAR().catch(()=>toast("AR is not available on this device/browser."));
    return;
  }
  if(model)window.open(model,"_blank","noopener");
}
async function shareMenu(){
  const data={title:`${restaurant?.name||"Restaurant"} — Signature 3D Menu`,text:"Experience our Signature 3D dishes in AR.",url:location.href};
  if(navigator.share){try{await navigator.share(data);return}catch(e){}}
  try{await navigator.clipboard.writeText(location.href);toast("Menu link copied");}catch(e){toast("Copy this menu link from the browser.");}
}

async function load(){
  try{
    const s=slug();
    if(!s)throw new Error("Restaurant link is missing.");

    const {data:restaurants,error:restError}=await supabaseClient
      .from("restaurants").select("*").eq("slug",s).limit(1);
    if(restError)throw restError;
    if(!restaurants?.length)throw new Error("Restaurant not found.");

    restaurant=restaurants[0];

    if(!restaurant.plan_id){
      location.replace(`/menu.html?r=${encodeURIComponent(s)}`);
      return;
    }

    const {data:plan,error:planError}=await supabaseClient
      .from("plans").select("id,name,slug,is_active").eq("id",restaurant.plan_id).maybeSingle();
    if(planError)throw planError;

    if(!isSignaturePlan(plan)||plan?.is_active===false){
      location.replace(`/menu.html?r=${encodeURIComponent(s)}`);
      return;
    }

    const {data:items,error:itemError}=await supabaseClient
      .from("menu_items").select("*").eq("restaurant_id",restaurant.id);
    if(itemError)throw itemError;

    allItems=(items||[]).sort((a,b)=>Number(a.sort_order??a.position??999999)-Number(b.sort_order??b.position??999999));
    arItems=allItems.filter(isAR).slice(0,5);
    photoItems=allItems.filter(i=>!arItems.includes(i));
    renderShell();
  }catch(error){
    $("app").innerHTML=`<div class="access"><div class="access-box"><h2>Menu unavailable</h2><p>${esc(error?.message||"Unable to load this menu.")}</p><button onclick="location.href='/menu.html?r=${encodeURIComponent(slug())}'">Open Standard Menu</button></div></div>`;
  }
}
load();
</script>
</body>
