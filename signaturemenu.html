<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Cafe - Photo Menu</title>
  <meta name="description" content="Responsive public restaurant photo menu template" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --brand:#9f1620;
      --brand-dark:#7d0e16;
      --gold:#f1b640;
      --green:#10a957;
      --text:#141414;
      --muted:#6f7580;
      --line:#eceef2;
      --soft:#f7f8fa;
      --white:#fff;
      --shadow:0 12px 35px rgba(16,24,40,.08);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#f4f5f7;color:var(--text);font-family:"DM Sans",sans-serif}
    button,input{font:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}
    img{display:block;width:100%;object-fit:cover}

    .app{max-width:1180px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 50px rgba(0,0,0,.06)}

    .hero{position:relative;min-height:320px;color:#fff;overflow:hidden;background:
      linear-gradient(90deg,rgba(5,5,5,.92) 0%,rgba(5,5,5,.74) 42%,rgba(5,5,5,.18) 72%,rgba(5,5,5,.36) 100%),
      url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1800&q=88') center/cover no-repeat;}
    .hero-inner{padding:42px 44px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;min-height:320px}
    .brand-row{display:flex;align-items:center;gap:18px}
    .logo{width:78px;height:78px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:37px;background:rgba(159,22,32,.55);backdrop-filter:blur(5px)}
    .brand h1{font-family:"Playfair Display",serif;font-size:54px;line-height:1;margin:0;letter-spacing:-1px}.brand h1 span{color:var(--gold)}
    .tagline{margin-top:10px;letter-spacing:6px;font-size:12px;font-weight:700}
    .info{display:flex;flex-wrap:wrap;gap:18px 28px;margin-top:28px;font-size:14px;color:#f5f5f5}
    .info span{display:flex;align-items:center;gap:8px}
    .quote{margin-top:28px;font-family:"Playfair Display",serif;font-size:24px;font-style:italic;color:#ffd86c}
    .hero-right{display:flex;justify-content:flex-end;align-items:center}.hero-word{font-family:"Playfair Display",serif;font-size:33px;line-height:1.08;text-align:right}.hero-word span{color:var(--gold)}

    .content{border-radius:30px 30px 0 0;margin-top:-24px;position:relative;background:#fff;padding:22px 30px 120px}
    .toolbar{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:6px 0 16px}
    .cats{display:flex;gap:10px;overflow:auto;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
    .cat{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.04);font-weight:600}
    .cat.active{background:var(--brand);border-color:var(--brand);color:#fff}
    .search{position:relative}.search input{width:100%;padding:14px 16px 14px 44px;border:1px solid var(--line);border-radius:14px;background:#fafbfc;outline:none}.search input:focus{border-color:#d7a7aa;box-shadow:0 0 0 4px rgba(159,22,32,.08)}
    .search:before{content:'⌕';position:absolute;left:16px;top:8px;font-size:25px;color:#667085}

    .section{margin-top:28px}.section-head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:14px}.section h2{font-family:"Playfair Display",serif;font-size:34px;margin:0}.section-sub{color:var(--muted);font-size:14px}.see-all{font-weight:700;color:var(--brand);border:none;background:none}

    .popular-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .food-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.045);display:flex;flex-direction:column;min-width:0}
    .food-image{position:relative;height:175px;background:#eee}.food-image img{height:100%}.food-card.no-photo .food-image{display:none}.food-card.no-photo{display:block}.dish-row.no-photo{grid-template-columns:1fr}.dish-row.no-photo .dish-main{grid-column:1}.badge{position:absolute;left:10px;top:10px;padding:6px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:800}.badge.red{background:#e82d2d}.badge.gold{background:#ffca38;color:#3b2d00}.type-icon{position:absolute;right:10px;top:10px;width:25px;height:25px;border:2px solid currentColor;border-radius:3px;background:#fff;display:grid;place-items:center}.type-icon:after{content:'';width:10px;height:10px;border-radius:50%;background:currentColor}.veg{color:#10a957}.nonveg{color:#e22a2a}.egg{color:#f3b51b}
    .food-body{padding:13px;display:flex;flex-direction:column;gap:8px;flex:1}.food-title{font-family:"Playfair Display",serif;font-size:19px;font-weight:700}.food-desc{font-size:13px;line-height:1.45;color:#626a76;min-height:38px}.food-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.price{font-size:22px;font-weight:800;color:#9b141d}.add{border:none;border-radius:999px;background:linear-gradient(135deg,var(--brand),#b62431);color:#fff;padding:10px 17px;font-weight:800}

    .list-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.dish-row{border:1px solid var(--line);border-radius:16px;padding:9px;display:grid;grid-template-columns:118px 1fr auto;gap:14px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.035)}.dish-row img{height:105px;border-radius:11px}.dish-main{min-width:0}.dish-name-line{display:flex;align-items:center;gap:9px}.mini-type{width:22px;height:22px;border:2px solid currentColor;border-radius:3px;display:grid;place-items:center;flex:0 0 auto}.mini-type:after{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}.dish-title{font-family:"Playfair Display",serif;font-size:18px;font-weight:700}.dish-desc{font-size:13px;line-height:1.45;color:#667085;margin:6px 0 8px}.dish-price{font-size:20px;font-weight:800;color:#9b141d}.dish-row .add{align-self:end;margin-bottom:4px}

    .bottom-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(1180px,100%);z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 22px;display:grid;grid-template-columns:230px 1fr 270px;align-items:center;gap:14px;box-shadow:0 -10px 28px rgba(0,0,0,.06)}
    .whatsapp{border:none;border-radius:13px;color:#fff;font-weight:800;padding:15px 18px;background:#10ad55.nav-actions{display:flex;justify-content:center;gap:34px}.nav-action{border:none;background:none;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px;color:#313844}.nav-action b{font-size:18px}

    .model3d-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.model3d-modal.show{display:flex}.model3d-box{width:min(760px,100%);background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.3)}.model3d-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}.model3d-title{font-weight:800;font-size:17px}.model3d-close{border:0;background:#f1f2f4;border-radius:999px;width:34px;height:34px;font-size:20px}.model3d-stage{height:min(65vh,520px);background:linear-gradient(180deg,#f7f8fa,#eef0f3)}model-viewer{width:100%;height:100%;--poster-color:transparent}.ar3d-btn{border:0;border-radius:999px;background:linear-gradient(135deg,#641219,#a91d28);color:#fff;font-weight:800;padding:9px 13px;font-size:12px;white-space:nowrap}.model3d-help{padding:11px 16px;color:#667085;font-size:12px;text-align:center}.dish-actions{display:flex;align-items:center;gap:8px;margin-top:8px}.dish-actions .dish-price{margin:0}.food-actions{display:flex;align-items:center;gap:8px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:900px){
      .hero-inner{grid-template-columns:1fr;padding:32px 24px}.hero-right{display:none}.brand h1{font-size:45px}.content{padding:18px 18px 118px}.toolbar{grid-template-columns:1fr}.popular-grid{grid-template-columns:repeat(2,1fr)}.list-grid{grid-template-columns:1fr}.bottom-bar{grid-template-columns:1fr}.nav-actions{display:none}.whatsapp{display:block}.section h2{font-size:30px}
    }
    @media(max-width:560px){
      .hero{min-height:285px}.hero-inner{min-height:285px;padding:28px 18px}.logo{width:62px;height:62px;font-size:30px}.brand h1{font-size:36px}.tagline{letter-spacing:3px}.info{gap:9px 14px;font-size:12px}.quote{font-size:19px}.content{border-radius:22px 22px 0 0;margin-top:-18px;padding:14px 12px 110px}.popular-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.food-image{height:135px}.food-body{padding:10px}.food-title{font-size:16px}.food-desc{font-size:12px;min-height:auto}.food-bottom{align-items:flex-end}.price{font-size:18px}.add{padding:9px 12px;font-size:13px}.section h2{font-size:27px}.section-head{align-items:center}.section-sub{display:none}.dish-row{grid-template-columns:92px 1fr;gap:10px}.dish-row img{height:90px}.dish-title{font-size:16px}.dish-desc{font-size:12px;padding-right:6px}.bottom-bar{grid-template-columns:1fr 1fr;padding:10px}.whatsapp{padding:13px 12px;font-size:13px}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hero-inner">
      <div>
        <div class="brand-row">
          <div class="logo" id="restaurantLogo">♨</div>
          <div class="brand"><h1 id="restaurantName">Loading...</h1><div class="tagline" id="restaurantTagline">GOOD FOOD • GOOD MOOD</div></div>
        </div>
        <div class="info">
          <span id="restaurantAddress"></span><span id="restaurantHours"></span><a id="restaurantPhone" href="#" style="color:inherit;text-decoration:none"></a>
        </div>
        <div class="quote" id="restaurantQuote">Food Brings People Together</div>
      </div>
      <div class="hero-right"><div class="hero-word">Good<br><span>Food</span><br>Good<br><span>Mood</span></div></div>
    </div>
  </header>

  <main class="content">
    <div class="toolbar">
      <div class="cats" id="categoryTabs"></div>
      <div class="search"><input id="searchInput" placeholder="Search dishes..." /></div>
    </div>

    <section class="section" id="popularSection">
      <div class="section-head"><div><h2>Popular Dishes</h2><div class="section-sub">Our most loved items</div></div><button class="see-all">See All →</button></div>
      <div class="popular-grid" id="popularGrid"></div>
    </section>

    <div id="categorySections"></div>
  </main>
</div>

<div class="bottom-bar">
  <div class="nav-actions">
    <button class="nav-action" onclick="window.scrollTo({top:0,behavior:'smooth'})"><b>⌂</b><span>Home</span></button>
    <button class="nav-action" onclick="shareMenu()"><b>↗</b><span>Share Menu</span></button>
    <button class="nav-action" onclick="location.href='tel:+919876543210'"><b>☎</b><span>Call Us</span></button>
  </div>
  <button class="whatsapp" onclick="shareWhatsApp()">☘ Share on WhatsApp</button>
</div>
<div class="toast" id="toast"></div>
<div class="model3d-modal" id="model3dModal" onclick="if(event.target===this)close3D()">
  <div class="model3d-box">
    <div class="model3d-head"><div class="model3d-title" id="model3dTitle">3D Dish View</div><button class="model3d-close" onclick="close3D()">×</button></div>
    <div class="model3d-stage"><model-viewer id="dishModel" src="" camera-controls auto-rotate rotation-per-second="30deg" ar ar-modes="webxr scene-viewer quick-look" shadow-intensity="1.5" environment-image="neutral" alt="3D Dish Preview"><button slot="ar-button" class="ar3d-btn">📱 Place on Table (AR)</button></model-viewer></div>
    <div class="model3d-help">Drag to rotate • Pinch to zoom • On supported phones use <b>Place on Table (AR)</b></div>
  </div>
</div>

<script>
  // Growth / Photos template: photo_menu_v1
  const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let restaurant=null, menuData=[], categories=['All Items'], selectedCategory='All Items';
  const $=id=>document.getElementById(id);
  const esc=(v='')=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  const safeUrl=v=>{if(!v)return '';try{const u=new URL(v,location.origin);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch(_){return '';}};
  const money=v=>{const n=Number(v);return Number.isFinite(n)?'₹'+n.toLocaleString('en-IN'):'';};
  const typeValue=i=>{const t=String(i.item_type||i.type||'').toLowerCase();if(t==='egg')return 'egg';if(t==='nonveg'||i.is_veg===false)return 'nonveg';return 'veg';};
  const badgeValue=i=>i.is_bestseller===true||i.bestseller===true?'Bestseller':i.is_recommended===true||i.recommended===true?'Recommended':i.is_spicy===true||i.spicy===true?'Spicy':'';
  const imageValue=i=>safeUrl(i.image_url||i.photo_url||i.image||i.photo);
  const SIGNATURE_3D_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/signature-3d-model-upload`;
  function resolve3DUrl(raw){
    const direct=safeUrl(raw); if(!direct)return '';
    if(direct.startsWith(SIGNATURE_3D_FUNCTION_URL)) return direct;
    try{
      const u=new URL(direct);
      const path=u.pathname.replace(/^\/+/,"");
      if(path.startsWith('restaurants/') && path.includes('/signature-3d/') && /\.glb$/i.test(path)){
        return `${SIGNATURE_3D_FUNCTION_URL}?key=${encodeURIComponent(path)}`;
      }
    }catch(_){ }
    return direct;
  }
  const has3D=i=>i?.signature_3d===true || i?.ar_enabled===true || !!i?.ar_model_url || !!i?.model_3d_url || !!i?.glb_url;
  const model3DValue=i=>resolve3DUrl(i?.ar_model_url||i?.model_3d_url||i?.glb_url||i?.model_url);
  function open3D(item){
    const src=model3DValue(item); if(!src){toast('3D model is not available for this dish.');return;}
    $('model3dTitle').textContent=`${item?.name||'Dish'} • 3D View`;
    const viewer=$('dishModel'); viewer.src=src; viewer.alt=`${item?.name||'Dish'} 3D Preview`;
    $('model3dModal').classList.add('show'); document.body.style.overflow='hidden';
  }
  function close3D(){const v=$('dishModel');v.removeAttribute('src');$('model3dModal').classList.remove('show');document.body.style.overflow='';}

  const categoryKey=i=>String(i.category||'General').trim()||'General';
  function categoryOrder(){const names=[...new Set(menuData.map(categoryKey))],saved=Array.isArray(restaurant?.category_order)?restaurant.category_order.map(String):[],rank=new Map(saved.map((x,i)=>[x,i]));return names.sort((a,b)=>(rank.has(a)?rank.get(a):999999)-(rank.has(b)?rank.get(b):999999)||a.localeCompare(b));}
  function renderRestaurant(){
    const name=restaurant?.name||'Restaurant';document.title=`${name} • Menu`;$('restaurantName').textContent=name;
    const logo=safeUrl(restaurant?.logo_url);$('restaurantLogo').innerHTML=logo?`<img src="${esc(logo)}" alt="${esc(name)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" onerror="this.parentElement.textContent='♨'">`:'♨';
    $('restaurantTagline').textContent=restaurant?.tagline||restaurant?.subtitle_text||'GOOD FOOD • GOOD MOOD';
    $('restaurantAddress').textContent=restaurant?.address?`📍 ${restaurant.address}`:'';
    const fmt=v=>{if(!v)return '';const [hh,mm='0']=String(v).split(':'),n=Number(hh);if(!Number.isFinite(n))return '';return `${String(n%12||12).padStart(2,'0')}:${String(mm).padStart(2,'0')} ${n>=12?'PM':'AM'}`;};
    const op=fmt(restaurant?.opening_time),cl=fmt(restaurant?.closing_time);$('restaurantHours').textContent=op&&cl?`◷ ${op} - ${cl}`:'';
    const ph=String(restaurant?.phone||'').trim();if(ph){$('restaurantPhone').href=`tel:${ph.replace(/[^\d+]/g,'')}`;$('restaurantPhone').textContent=`☎ ${ph}`;}else{$('restaurantPhone').style.display='none';}
    $('restaurantQuote').textContent=restaurant?.slogan_1||restaurant?.welcome_text||'Food Brings People Together';
  }
  const typeIcon=(type,mini=false)=>`<span class="${mini?'mini-type':'type-icon'} ${type}"></span>`;
  const badgeHTML=b=>b?`<span class="badge ${b==='Bestseller'||b==='Recommended'?'red':'gold'}">${esc(b)}</span>`:'';
  
  function renderTabs(){$('categoryTabs').innerHTML=categories.map(c=>`<button class="cat ${selectedCategory===c?'active':''}" onclick="selectCategory('${c.replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('');}
  function filteredItems(){const q=$('searchInput').value.trim().toLowerCase();return menuData.filter(i=>{const c=categoryKey(i),h=`${i.name||''} ${i.description||''} ${c}`.toLowerCase();return (selectedCategory==='All Items'||c===selectedCategory)&&(!q||h.includes(q));});}
  function renderMenu(){
    renderTabs();const items=filteredItems(),popular=items.filter(i=>i.is_bestseller===true||i.bestseller===true||i.is_recommended===true||i.recommended===true).slice(0,4);$('popularSection').style.display=popular.length?'block':'none';
    $('popularGrid').innerHTML=popular.map(i=>{const img=imageValue(i);if(img)return `<article class="food-card"><div class="food-image"><img src="${esc(img)}" alt="${esc(i.name||'Food')}" onerror="this.closest('.food-card').classList.add('no-photo');this.parentElement.style.display='none'">${badgeHTML(badgeValue(i))}${typeIcon(typeValue(i))}</div><div class="food-body"><div class="food-title">${esc(i.name||'Unnamed item')}</div><div class="food-desc">${esc(i.description||'')}</div><div class="food-bottom"><span class="price">${money(i.price_full??i.price)}</span><div class="food-actions">${has3D(i)?`<button class="ar3d-btn" onclick="open3D(${JSON.stringify(i).replace(/"/g,"&quot;")})">3D View</button>`:""}</div></div></div></article>`;return `<article class="food-card no-photo"><div class="food-body"><div class="food-title">${typeIcon(typeValue(i),true)} ${esc(i.name||'Unnamed item')}</div><div class="food-desc">${esc(i.description||'')}</div><div class="food-bottom"><span class="price">${money(i.price_full??i.price)}</span><div class="food-actions">${has3D(i)?`<button class="ar3d-btn" onclick="open3D(${JSON.stringify(i).replace(/"/g,"&quot;")})">3D View</button>`:""}</div></div></div></article>`;}).join('');
    $('categorySections').innerHTML=categoryOrder().filter(c=>selectedCategory==='All Items'||c===selectedCategory).map(cat=>{const list=items.filter(i=>categoryKey(i)===cat);if(!list.length)return '';return `<section class="section"><div class="section-head"><div><h2>${esc(cat)}</h2><div class="section-sub">${cat==='Starters'?'Start your food journey with amazing flavors':'Delicious choices for every appetite'}</div></div><button class="see-all" onclick="selectCategory('${cat.replace(/'/g,"\\'")}')">See All →</button></div><div class="list-grid">${list.map(i=>{const img=imageValue(i);if(img)return `<article class="dish-row"><img src="${esc(img)}" alt="${esc(i.name||'Food')}" onerror="this.closest('.dish-row').classList.add('no-photo');this.remove()"><div class="dish-main"><div class="dish-name-line">${typeIcon(typeValue(i),true)}<div class="dish-title">${esc(i.name||'Unnamed item')}</div></div><div class="dish-desc">${esc(i.description||'')}</div><div class="dish-actions"><div class="dish-price">${money(i.price_full??i.price)}</div>${has3D(i)?`<button class="ar3d-btn" onclick="open3D(${JSON.stringify(i).replace(/"/g,"&quot;")})">3D View</button>`:""}</div></div></article>`;return `<article class="dish-row no-photo"><div class="dish-main"><div class="dish-name-line">${typeIcon(typeValue(i),true)}<div class="dish-title">${esc(i.name||'Unnamed item')}</div></div><div class="dish-desc">${esc(i.description||'')}</div><div class="dish-actions"><div class="dish-price">${money(i.price_full??i.price)}</div>${has3D(i)?`<button class="ar3d-btn" onclick="open3D(${JSON.stringify(i).replace(/"/g,"&quot;")})">3D View</button>`:""}</div></div></article>`;}).join('')}</div></section>`;}).join('');
    if(!items.length)$('categorySections').innerHTML='<div style="padding:30px;text-align:center;color:#667085">No menu items found.</div>';
  }
  function selectCategory(c){selectedCategory=c;renderMenu();if(c!=='All Items')$('categorySections').scrollIntoView({behavior:'smooth',block:'start'});}
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1800);}
  async function shareMenu(){if(navigator.share){try{await navigator.share({title:`${restaurant?.name||'Restaurant'} Menu`,text:'Check our menu',url:location.href});}catch(e){}}else{navigator.clipboard?.writeText(location.href);toast('Menu link copied');}}
  function shareWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(`${restaurant?.name||'Restaurant'} Menu: ${location.href}`),'_blank');}
  async function loadGrowthMenu(){
    try{
      const slug=(new URLSearchParams(location.search).get('r')||'').trim().toLowerCase();
      if(!slug){$('restaurantName').textContent='Restaurant Not Found';return;}
      const {data:rest,error:re}=await supabaseClient.from('restaurants').select('*').eq('slug',slug).limit(1).maybeSingle();if(re)throw re;if(!rest){$('restaurantName').textContent='Restaurant Not Found';return;}restaurant=rest;
      const {data:items,error:ie}=await supabaseClient.from('menu_items').select('*').eq('restaurant_id',rest.id);if(ie)throw ie;menuData=Array.isArray(items)?items:[];
      menuData.sort((a,b)=>Number(a.sort_order??a.position??999999)-Number(b.sort_order??b.position??999999)||String(a.name||'').localeCompare(String(b.name||'')));
      categories=['All Items',...categoryOrder()];renderRestaurant();renderMenu();
    }catch(e){console.error('Growth menu load error:',e);$('restaurantName').textContent='Menu Unavailable';$('categorySections').innerHTML='<div style="padding:30px;text-align:center;color:#667085">Unable to load this restaurant menu.</div>';}
  }
  $('searchInput').addEventListener('input',renderMenu);window.addEventListener('load',loadGrowthMenu);
</script>
</body>
</html>
