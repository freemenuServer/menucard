<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Dashboard — Digital Menu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root{
 --navy:#101827;--navy2:#172235;--primary:#b51d3b;--primary-dark:#89142b;
 --pink:#f52f72;--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#697386;
 --border:#e5e7eb;--green:#13a66b;--danger:#e5484d;--blue:#3283e8;
 --shadow:0 8px 25px rgba(15,23,42,.06);--radius:14px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.hidden{display:none!important}.muted{color:var(--muted)}
#loader{position:fixed;inset:0;background:#f6f7fb;display:grid;place-items:center;z-index:9999}
.loader-card{text-align:center}.spinner{width:42px;height:42px;border:4px solid #ddd;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}

/* Layout */
.app{min-height:100vh}.sidebar{position:fixed;left:0;top:0;bottom:0;width:238px;background:linear-gradient(180deg,#0d1624,#121b2b);color:#dce4f0;padding:22px 14px;z-index:100;overflow:auto}
.logoArea{text-align:center;padding:5px 8px 22px}.chefLogo{font-size:32px;color:#f5bf47}.sideBrand{font-family:"Cormorant Garamond",serif;font-size:25px;font-weight:700;color:#fff}.sideSub{font-size:10px;letter-spacing:1.5px;color:#aab5c7}
.navItem{display:flex;align-items:center;gap:13px;padding:12px 13px;margin:4px 0;border-radius:8px;font-size:13px;font-weight:600;color:#bdc8d9}
.navItem i{width:19px;text-align:center}.navItem:hover{background:#1c2a40;color:#fff}.navItem.active{background:linear-gradient(90deg,#8f1831,#b51d3b);color:#fff;box-shadow:0 6px 18px rgba(181,29,59,.2)}
.sidePromo{margin:24px 0 0;padding:20px 12px;border:1px solid rgba(255,255,255,.13);border-radius:10px;background:linear-gradient(145deg,#242039,#321f3a);text-align:center}
.sidePromo i{color:#ffd34f;font-size:24px}.sidePromo strong{display:block;margin:8px 0 5px}.sidePromo p{font-size:11px;color:#c7c9d5;line-height:1.5;margin:0 0 12px}
.btn-pink{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:#f32f72;color:#fff;border-radius:8px;padding:10px 12px;font-weight:800;font-size:12px;width:100%}
.content{margin-left:238px;min-height:100vh}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:80}
.restIdentity{display:flex;align-items:center;gap:12px}.restLogo{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid #ddd;background:#eee}.restTitle{font-size:17px;font-weight:800}.restAddress{font-size:11px;color:var(--muted);margin-top:2px}.topActions{display:flex;align-items:center;gap:12px}.openToggle{display:flex;align-items:center;gap:8px;background:#dff7ea;color:#087443;border:0;border-radius:20px;padding:9px 14px;font-size:12px;font-weight:800}.profile{display:flex;align-items:center;gap:9px;padding-left:13px;border-left:1px solid var(--border)}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#d91f35;color:#fff;font-weight:800}
.container{max-width:1200px;margin:auto;padding:22px 20px 45px}.mobileMenu{display:none}

/* Cards / common */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.cardTitle{font-size:16px;font-weight:800;margin:0 0 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.cardTitle small{font-size:11px;color:var(--muted);font-weight:500}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{padding:17px;border-radius:12px;border:1px solid var(--border);background:#fff;box-shadow:var(--shadow);min-height:105px}.statTop{display:flex;justify-content:space-between;align-items:center}.statIcon{width:39px;height:39px;border-radius:10px;display:grid;place-items:center;background:#edf4ff;color:#287be0}.stat:nth-child(2) .statIcon{background:#fff0fa;color:#df2d8a}.stat:nth-child(3) .statIcon{background:#e9fbf5;color:#12a36b}.stat:nth-child(4) .statIcon{background:#f4edff;color:#8238d5}.statLabel{font-size:11px;margin-top:10px}.statValue{font-size:24px;font-weight:800;margin-top:2px}.statChange{font-size:10px;color:var(--green);font-weight:700}
.twoCol{display:grid;grid-template-columns:1.15fr .85fr;gap:15px;margin-top:15px}.twoCol.equal{grid-template-columns:1fr 1fr}.threeCol{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:800;color:#263244}.btn:hover{background:#f8fafc}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:var(--danger);background:#fff1f1;border-color:#ffd0d0}.btn.blue{color:#1671d8;background:#edf6ff;border-color:#cde5ff}.btn.green{color:#087443;background:#e8faef;border-color:#bdeccf}.btn.sm{padding:7px 9px;font-size:11px}.actions{display:flex;gap:7px;flex-wrap:wrap}
.formGroup{margin-bottom:13px}.formGroup label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:6px}.input,.select,.textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 11px;background:#fff;color:#172033;outline:none;font-size:13px}.textarea{min-height:82px;resize:vertical}.input:focus,.select:focus,.textarea:focus{border-color:#b7a0a5;box-shadow:0 0 0 3px rgba(181,29,59,.06)}
.uploadRow{display:flex;gap:7px}.uploadRow .input{flex:1}.fileBtn{border:1px solid var(--border);background:#f5f7fa;border-radius:8px;padding:9px 11px;font-size:11px;font-weight:800;white-space:nowrap}
.profileBox{display:grid;grid-template-columns:145px 1fr;gap:20px;align-items:center}.bigLogo{width:140px;height:140px;border-radius:50%;object-fit:cover;background:#f3f4f6;border:1px solid var(--border)}
.mediaCover{height:180px;border-radius:11px;background:#e9e5df center/cover no-repeat;position:relative;overflow:hidden}.mediaCover .overlay{position:absolute;inset:auto 10px 10px auto;background:#fff;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:800}.mediaTiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}.mediaTile{height:105px;border-radius:10px;background:#f2eee8 center/cover no-repeat;display:flex;align-items:flex-end;justify-content:center;padding:7px}.mediaTile span{background:#fff;border-radius:6px;padding:6px 7px;font-size:9px;font-weight:800}
.serviceBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.serviceBtn{border:1px solid var(--border);background:#fff;border-radius:9px;padding:10px;font-size:11px;font-weight:700}.serviceBtn i{margin-right:5px}

/* Menu */
.menuToolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.menuToolbar .input{max-width:260px}.menuTable{width:100%;border-collapse:collapse;font-size:12px}.menuTable th{text-align:left;color:#6b7280;font-size:10px;text-transform:uppercase;padding:9px 6px;border-bottom:1px solid var(--border)}.menuTable td{padding:10px 6px;border-bottom:1px solid #eef0f3;vertical-align:middle}.menuTable tr:last-child td{border-bottom:0}.foodName{font-weight:800}.foodCat{font-size:10px;color:var(--muted);margin-top:2px}.foodType{display:inline-grid;place-items:center;width:16px;height:16px;border:1.5px solid #19a45a;border-radius:3px}.foodType.nv{border-color:#d93838}.foodType.nv:after{content:"";border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid #d93838}.foodType.veg:after{content:"";width:6px;height:6px;background:#19a45a;border-radius:50%}.foodType.egg{border-color:#d98b17}.foodType.egg:after{content:"";width:6px;height:6px;background:#d98b17;border-radius:50%}.pricesMini{white-space:nowrap;font-weight:700}.switch{width:38px;height:21px;background:#cbd5e1;border-radius:20px;padding:2px;border:0}.switch:after{content:"";display:block;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:#17aa6b}.switch.on:after{transform:translateX(17px)}.categoryCards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.categoryCard{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}.catImage{height:80px;background:#eee center/cover}.catBody{padding:9px}.catName{font-weight:800;font-size:12px}.catCount{font-size:10px;color:var(--muted);margin-top:3px}

/* Quick actions */
.quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{padding:14px;border-radius:10px;border:1px solid var(--border);display:flex;gap:12px;align-items:center}.quick i{font-size:20px;color:var(--green)}.quick strong{font-size:12px}.quick small{display:block;font-size:10px;color:var(--muted);margin-top:3px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:300}.modal.show{display:flex}.modalBox{background:#fff;border-radius:16px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:20px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalHead h3{margin:0;font-size:17px}.close{border:0;background:#f1f3f5;border-radius:8px;width:32px;height:32px}
.previewFrame{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}.previewTop{height:120px;background:linear-gradient(135deg,#461016,#9d2535);color:#fff;padding:25px}.previewTop strong{font-family:"Cormorant Garamond",serif;font-size:31px}.themeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.colorField{display:flex;align-items:center;gap:8px;border:1px solid var(--border);padding:8px;border-radius:8px}.colorField input{width:38px;height:30px;padding:0;border:0;background:none}.colorField span{font-size:11px;font-weight:700}

/* Toast */
#toast{position:fixed;bottom:22px;right:22px;background:#172033;color:#fff;padding:11px 15px;border-radius:9px;font-size:12px;font-weight:700;opacity:0;transform:translateY(15px);transition:.25s;z-index:500}#toast.show{opacity:1;transform:none}

/* Responsive */
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.twoCol,.twoCol.equal{grid-template-columns:1fr}.sidebar{width:205px}.content{margin-left:205px}.profileBox{grid-template-columns:110px 1fr}.bigLogo{width:105px;height:105px}}
@media(max-width:760px){
 .sidebar{transform:translateX(-100%);transition:.25s;width:250px}.sidebar.open{transform:none}.content{margin-left:0}.topbar{height:66px;padding:0 12px}.mobileMenu{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--border);background:#fff;border-radius:8px}.topActions .openToggle{display:none}.profile .profileName{display:none}.container{padding:15px 11px 35px}.grid4{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px;min-height:94px}.statValue{font-size:20px}.threeCol,.categoryCards{grid-template-columns:1fr}.profileBox{grid-template-columns:1fr;text-align:center}.bigLogo{margin:auto}.mediaCover{height:150px}.menuTable{min-width:700px}.menuTableWrap{overflow:auto}.quickGrid{grid-template-columns:1fr}.heroHideMobile{display:none}}
@media(max-width:430px){.grid4{grid-template-columns:1fr 1fr}.statLabel{font-size:9px}.statValue{font-size:18px}.restTitle{font-size:14px}.restAddress{font-size:9px}}
</style>

<style id="ownerLoginStyles">
#ownerLogin{position:fixed;inset:0;background:linear-gradient(135deg,#0d1624,#18263b);z-index:10000;display:none;align-items:center;justify-content:center;padding:18px}
#ownerLogin.show{display:flex}
.loginCard{width:min(430px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.28)}
.loginLogo{width:66px;height:66px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:linear-gradient(135deg,#8f1831,#c52345);color:#fff;font-size:27px}
.loginCard h1{font-family:"Cormorant Garamond",serif;text-align:center;font-size:34px;margin:0;color:#151c2a}
.loginCard .sub{text-align:center;color:#718096;font-size:12px;margin:4px 0 22px}
.loginError{background:#fff0f0;color:#b4232e;border:1px solid #ffd0d0;border-radius:8px;padding:9px 10px;font-size:11px;margin-bottom:12px}
.loginSubmit{width:100%;border:0;background:linear-gradient(90deg,#8f1831,#c52345);color:#fff;border-radius:9px;padding:12px;font-weight:800;cursor:pointer}
.loginSubmit:disabled{opacity:.6}
.loginHint{text-align:center;font-size:10px;color:#8a93a3;margin-top:13px;line-height:1.5}
</style></head>

<body>

<div id="ownerLogin">
  <div class="loginCard">
    <div class="loginLogo"><i class="fa-solid fa-utensils"></i></div>
    <h1>Owner Login</h1>
    <div class="sub">Restaurant Owner Panel</div>
    <div id="loginError" class="loginError hidden"></div>
    <div class="formGroup">
      <label>Email Address</label>
      <input class="input" id="loginEmail" type="email" autocomplete="email" placeholder="owner@example.com">
    </div>
    <div class="formGroup">
      <label>Password</label>
      <input class="input" id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password">
