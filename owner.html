<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard - FreeMenu.in</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --primary: #ff4757;
      --primary-hover: #ff6b81;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --veg-color: #16a34a;
      --nonveg-color: #dc2626;
      --egg-color: #d97706;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text-dark); min-height: 100vh; padding-bottom: 60px; }

    .navbar {
      background: #ffffff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
    .logo span { color: var(--text-dark); }
    .nav-btn { background: #f1f5f9; color: var(--text-dark); padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 700; }

    .container { max-width: 1050px; margin: 24px auto; padding: 0 16px; }
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    @media (min-width: 850px) {
      .dashboard-grid { grid-template-columns: 360px 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .card-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text-dark); }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255, 71, 87, 0.15); }
    
    .flex-row { display: flex; gap: 10px; }
    .flex-row .form-group { flex: 1; }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }

    .btn-action { padding: 6px 12px; border-radius: 8px; font-size: 12px; border: none; cursor: pointer; font-weight: 700; }
    .btn-edit { background: #e0f2fe; color: #0284c7; }
    .btn-delete { background: #fee2e2; color: #dc2626; }
    .btn-save { background: #dcfce7; color: #16a34a; }
    .btn-cancel { background: #f1f5f9; color: #64748b; }

    .cat-chips-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .cat-tag {
      background: #f1f5f9;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cat-tag-del { color: #dc2626; cursor: pointer; font-size: 14px; font-weight: bold; }

    /* Category Section Layout */
    .category-group-block {
      margin-bottom: 24px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
    }
    .category-group-header {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .category-item-count {
      font-size: 12px;
      color: var(--text-muted);
      background: #ffffff;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
    }

    .item-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .item-card:last-child { margin-bottom: 0; }
    
    .item-view-mode { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .item-header-inline { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .item-name { font-weight: 700; font-size: 15px; }
    .item-price { font-weight: 800; color: #16a34a; font-size: 15px; background: #f0fdf4; padding: 2px 8px; border-radius: 6px; }

    .item-edit-mode { display: flex; flex-direction: column; gap: 10px; }
    .inline-inputs-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .inline-inputs-row input, .inline-inputs-row select { font-size: 13px; padding: 8px; }

    .badge-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .badge-veg { background: var(--veg-color); }
    .badge-nonveg { background: var(--nonveg-color); }
    .badge-egg { background: var(--egg-color); }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#" class="logo">FreeMenu<span>.in</span></a>
    <a href="#" id="preview-link" target="_blank" class="nav-btn">View Live Menu ↗</a>
  </nav>

  <main class="container">
    <div class="dashboard-grid">
      
      <!-- Left Column: Settings, Category Add & Item Add Forms -->
      <div>
        <div class="card">
          <h3 class="card-title">Restaurant Details</h3>
          <div class="form-group">
            <label>Restaurant Name</label>
            <input type="text" id="rest-name" class="form-control" placeholder="e.g. Royal Spice Restaurant">
          </div>
          <div class="form-group">
            <label>Menu Slug Code (URL)</label>
            <input type="text" id="rest-slug" class="form-control" placeholder="e.g. royalspice">
          </div>
          <div class="form-group">
            <label>Logo Image URL</label>
            <input type="text" id="rest-logo" class="form-control" placeholder="https://example.com/logo.png">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="rest-phone" class="form-control" placeholder="+91 9876543210">
          </div>
          <button class="btn" onclick="saveRestaurant()">Save Restaurant Details</button>
        </div>

        <div class="card">
          <h3 class="card-title">Manage Categories</h3>
          <div class="form-group">
            <label>New Category Name</label>
            <div class="flex-row">
              <input type="text" id="new-cat-name" class="form-control" placeholder="e.g. Main Course, Fry, Starters">
              <button class="btn" style="width: auto; padding: 0 16px;" onclick="addCategory()">+ Add</button>
            </div>
          </div>
          <div class="cat-chips-list" id="categories-chips">
            <span style="font-size: 12px; color: var(--text-muted);">Loading categories...</span>
          </div>
        </div>

        <div class="card">
          <h3 class="card-title">Add New Dish</h3>
          <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="item-name" class="form-control" placeholder="e.g. Chicken Fry / Dal Makhani">
          </div>
          
          <div class="flex-row">
            <div class="form-group">
              <label>Price (₹)</label>
              <input type="number" id="item-price" class="form-control" placeholder="180">
            </div>
            <div class="form-group">
              <label>Food Type</label>
              <select id="item-type" class="form-control">
                <option value="veg">🟢 Veg</option>
                <option value="nonveg">🔴 Non-Veg</option>
                <option value="egg">🟡 Egg</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Select Category</label>
            <select id="item-category-select" class="form-control">
              <option value="">-- Choose Category --</option>
            </select>
          </div>

          <div class="form-group">
            <label>Image URL (Optional)</label>
            <input type="text" id="item-img" class="form-control" placeholder="https://example.com/dish.jpg">
          </div>
          <div class="form-group">
            <label>Short Description</label>
            <textarea id="item-desc" class="form-control" rows="2" placeholder="Brief details..."></textarea>
          </div>
          <button class="btn" onclick="addMenuItem()">+ Add Item to Menu</button>
        </div>
      </div>

      <!-- Right Column: Category-wise Menu Display -->
      <div>
        <div class="card">
          <div class="card-title">
            <span>Current Menu Items</span>
            <span id="items-count" style="font-size: 13px; color: var(--text-muted);">0 items</span>
          </div>

          <div id="items-list">
            <p style="color: var(--text-muted); text-align: center; padding: 20px 0;">Loading menu items...</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    let supabaseClient = null;
    let currentRestaurant = null;
    let categoriesList = [];
    let menuItems = [];

    function initSupabase() {
      const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return null;
    }

    async function loadDashboard() {
      supabaseClient = initSupabase();
      if (!supabaseClient) return;

      const { data: restaurants } = await supabaseClient.from('restaurants').select('*').limit(1);
      if (restaurants && restaurants.length > 0) {
        currentRestaurant = restaurants[0];
        document.getElementById('rest-name').value = currentRestaurant.name || '';
        document.getElementById('rest-slug').value = currentRestaurant.slug || '';
        document.getElementById('rest-logo').value = currentRestaurant.logo_url || '';
        document.getElementById('rest-phone').value = currentRestaurant.phone || '';
        
        if (currentRestaurant.slug) {
          document.getElementById('preview-link').href = `menu.html?r=${currentRestaurant.slug}`;
        }
        
        await fetchCategories(currentRestaurant.id);
        await loadMenuItems(currentRestaurant.id);
      } else {
        await fetchCategories(null);
        await loadMenuItems(null);
      }
    }

    async function saveRestaurant() {
      const name = document.getElementById('rest-name').value.trim();
      const slug = document.getElementById('rest-slug').value.trim().toLowerCase();
      const logo_url = document.getElementById('rest-logo').value.trim();
      const phone = document.getElementById('rest-phone').value.trim();

      if (!name || !slug) {
        alert("Please enter Name and Slug!");
        return;
      }

      const payload = { name, slug, logo_url, phone };

      if (currentRestaurant) {
        await supabaseClient.from('restaurants').update(payload).eq('id', currentRestaurant.id);
      } else {
        const { data, error } = await supabaseClient.from('restaurants').insert([payload]).select().single();
        if (error) { alert("Error: " + error.message); return; }
        currentRestaurant = data;
      }

      alert("Restaurant Saved!");
      loadDashboard();
    }

    async function fetchCategories(restaurantId) {
      let query = supabaseClient.from('categories').select('*');
      if (restaurantId) {
        query = query.eq('restaurant_id', restaurantId);
      }
      const { data } = await query;
      categoriesList = data || [];
      
      const selectEl = document.getElementById('item-category-select');
      selectEl.innerHTML = '<option value="">-- Choose Category --</option>';
      categoriesList.forEach(c => {
        selectEl.innerHTML += `<option value="${c.name}">${c.name}</option>`;
      });

      const chipsEl = document.getElementById('categories-chips');
      if (categoriesList.length === 0) {
        chipsEl.innerHTML = '<span style="font-size: 12px; color: var(--text-muted);">No categories added yet.</span>';
        return;
      }
      chipsEl.innerHTML = categoriesList.map(c => `
        <span class="cat-tag">
          ${c.name}
          <span class="cat-tag-del" onclick="deleteCategory('${c.id}')">&times;</span>
        </span>
      `).join('');
    }

    async function addCategory() {
      const catName = document.getElementById('new-cat-name').value.trim();
      if (!catName) return;

      const payload = { name: catName };
      if (currentRestaurant) payload.restaurant_id = currentRestaurant.id;

      const { error } = await supabaseClient.from('categories').insert([payload]);
      if (error) {
        alert("Category save error: " + error.message);
      } else {
        document.getElementById('new-cat-name').value = '';
        fetchCategories(currentRestaurant ? currentRestaurant.id : null);
      }
    }

    async function deleteCategory(id) {
      if (confirm("Delete this category?")) {
        await supabaseClient.from('categories').delete().eq('id', id);
        fetchCategories(currentRestaurant ? currentRestaurant.id : null);
      }
    }

    async function addMenuItem() {
      const name = document.getElementById('item-name').value.trim();
      const price = parseFloat(document.getElementById('item-price').value);
      const category = document.getElementById('item-category-select').value;
      const itemType = document.getElementById('item-type').value;
      const image_url = document.getElementById('item-img').value.trim();
      const description = document.getElementById('item-desc').value.trim();

      if (!name || isNaN(price)) { alert("Valid Name & Price zaroori hain!"); return; }

      const newItem = {
        name,
        price,
        category: category || 'General',
        item_type: itemType,
        is_veg: itemType === 'veg',
        image_url,
        description
      };

      if (currentRestaurant) {
        newItem.restaurant_id = currentRestaurant.id;
      }

      const { error } = await supabaseClient.from('menu_items').insert([newItem]);
      if (error) {
        alert("Failed to add item: " + error.message);
      } else {
        document.getElementById('item-name').value = '';
        document.getElementById('item-price').value = '';
        document.getElementById('item-img').value = '';
        document.getElementById('item-desc').value = '';
        loadMenuItems(currentRestaurant ? currentRestaurant.id : null);
      }
    }

    async function loadMenuItems(restaurantId) {
      let query = supabaseClient.from('menu_items').select('*');
      if (restaurantId) {
        query = query.eq('restaurant_id', restaurantId);
      }
      
      const { data: items, error } = await query;
      if (error) {
        console.error("Fetch items error:", error);
      }
      menuItems = items || [];
      renderGroupedItemList();
    }

    function renderGroupedItemList() {
      const listContainer = document.getElementById('items-list');
      document.getElementById('items-count').innerText = `${menuItems.length} items`;

      if (menuItems.length === 0) {
        listContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px 0;">No items found on dashboard.</p>';
        return;
      }

      // 1. Group items by Category
      const grouped = {};
      menuItems.forEach(item => {
        const catName = item.category ? item.category.trim() : 'General / Other Items';
        if (!grouped[catName]) {
          grouped[catName] = [];
        }
        grouped[catName].push(item);
      });

      // 2. Build Category Sections HTML
      let groupedHtml = '';

      for (const [catName, items] of Object.entries(grouped)) {
        groupedHtml += `
          <div class="category-group-block">
            <div class="category-group-header">
              <span>📂 ${catName}</span>
              <span class="category-item-count">${items.length} items</span>
            </div>
            ${items.map(item => renderItemCard(item)).join('')}
          </div>
        `;
      }

      listContainer.innerHTML = groupedHtml;
    }

    function renderItemCard(item) {
      let typeClass = 'badge-veg';
      if (item.item_type === 'egg') typeClass = 'badge-egg';
      else if (item.item_type === 'nonveg' || item.is_veg === false) typeClass = 'badge-nonveg';

      const catOptionsHtml = categoriesList.map(c => 
        `<option value="${c.name}" ${item.category === c.name ? 'selected' : ''}>${c.name}</option>`
      ).join('');

      return `
        <div class="item-card">
          <div class="item-view-mode" id="view-${item.id}">
            <div style="flex: 1;">
              <div class="item-header-inline">
                <span class="badge-dot ${typeClass}"></span>
                <span class="item-name">${item.name}</span>
              </div>
              <div style="font-size: 13px; color: var(--text-muted);">${item.description || ''}</div>
            </div>

            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="item-price">₹${item.price}</span>
              <button class="btn-action btn-edit" onclick="enableInlineEdit('${item.id}')">Edit</button>
              <button class="btn-action btn-delete" onclick="deleteItem('${item.id}')">Delete</button>
            </div>
          </div>

          <div class="item-edit-mode" id="edit-${item.id}" style="display: none;">
            <div class="inline-inputs-row">
              <input type="text" id="edit-name-${item.id}" class="form-control" value="${item.name}" placeholder="Name" style="flex: 2;">
              <input type="number" id="edit-price-${item.id}" class="form-control" value="${item.price}" placeholder="Price" style="flex: 1;">
              <select id="edit-type-${item.id}" class="form-control" style="flex: 1;">
                <option value="veg" ${item.item_type === 'veg' ? 'selected' : ''}>🟢 Veg</option>
                <option value="nonveg" ${item.item_type === 'nonveg' ? 'selected' : ''}>🔴 Non-Veg</option>
                <option value="egg" ${item.item_type === 'egg' ? 'selected' : ''}>🟡 Egg</option>
              </select>
            </div>

            <div class="inline-inputs-row">
              <select id="edit-cat-${item.id}" class="form-control" style="flex: 1;">
                <option value="">-- Select Category --</option>
                ${catOptionsHtml}
              </select>
              <input type="text" id="edit-desc-${item.id}" class="form-control" value="${item.description || ''}" placeholder="Description" style="flex: 2;">
            </div>

            <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px;">
              <button class="btn-action btn-cancel" onclick="cancelInlineEdit('${item.id}')">Cancel</button>
              <button class="btn-action btn-save" onclick="saveInlineEdit('${item.id}')">Save Changes</button>
            </div>
          </div>
        </div>
      `;
    }

    function enableInlineEdit(id) {
      document.getElementById(`view-${id}`).style.display = 'none';
      document.getElementById(`edit-${id}`).style.display = 'flex';
    }

    function cancelInlineEdit(id) {
      document.getElementById(`edit-${id}`).style.display = 'none';
      document.getElementById(`view-${id}`).style.display = 'flex';
    }

    async function saveInlineEdit(id) {
      const newName = document.getElementById(`edit-name-${id}`).value.trim();
      const newPrice = parseFloat(document.getElementById(`edit-price-${id}`).value);
      const newType = document.getElementById(`edit-type-${id}`).value;
      const newCat = document.getElementById(`edit-cat-${id}`).value;
      const newDesc = document.getElementById(`edit-desc-${id}`).value.trim();

      if (!newName || isNaN(newPrice)) { alert("Name and Price required!"); return; }

      const updatedData = {
        name: newName,
        price: newPrice,
        item_type: newType,
        is_veg: newType === 'veg',
        category: newCat,
        description: newDesc
      };

      const { error } = await supabaseClient.from('menu_items').update(updatedData).eq('id', id);
      if (error) alert("Error updating: " + error.message);
      else loadMenuItems(currentRestaurant ? currentRestaurant.id : null);
    }

    async function deleteItem(id) {
      if (confirm("Delete this item?")) {
        await supabaseClient.from('menu_items').delete().eq('id', id);
        loadMenuItems(currentRestaurant ? currentRestaurant.id : null);
      }
    }

    window.addEventListener('load', loadDashboard);
  </script>
</body>
</html>
