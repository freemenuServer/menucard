<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --primary: #10b981;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --border: #e2e8f0;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); padding-bottom: 40px; }

    .nav-bar {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .logout-btn { background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; }

    .container { max-width: 600px; margin: 20px auto; padding: 0 12px; }
    .card { background: #fff; border-radius: 10px; border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }

    /* File Upload Controls */
    .upload-row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .file-btn { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 10px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .upload-btn { background: #3b82f6; color: white; border: none; padding: 10px 14px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .upload-btn:disabled { background: #94a3b8; }
    .preview-img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; margin-top: 8px; display: none; border: 1px solid var(--border); }

    .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <div style="font-weight:700;">🏪 Restaurant Owner Dashboard</div>
    <button class="logout-btn" onclick="handleLogout()">Logout</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>⚙️ Profile & Logo Setup</h2>
      <br>
      
      <div class="form-group">
        <label>Restaurant Name</label>
        <input type="text" id="setting-name" placeholder="Restaurant Name">
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="setting-phone" placeholder="Phone Number">
      </div>

      <!-- Photo Upload Setup -->
      <div class="form-group">
        <label>Logo Image URL (Or Upload Photo from PC)</label>
        <input type="text" id="setting-logo" placeholder="https://image-link.com/logo.jpg">
        
        <div class="upload-row">
          <input type="file" id="logo-file" accept="image/*" style="display:none;" onchange="showFileName()">
          <button type="button" class="file-btn" onclick="document.getElementById('logo-file').click()">Select Photo</button>
          <button type="button" class="upload-btn" id="upload-action-btn" onclick="uploadLogo()">Upload Photo</button>
        </div>
        <img id="logo-preview" class="preview-img" alt="Logo Preview">
      </div>

      <button class="btn-main" onclick="saveProfile()">Save Profile Details</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let restaurantId = null;

    async function loadData() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('r');

      let query = supabaseClient.from('restaurants').select('*');
      if (slug) {
        query = query.eq('slug', slug);
      } else if (session && session.user) {
        query = query.eq('owner_id', session.user.id);
      }

      const { data } = await query.limit(1);
      if (data && data.length > 0) {
        const rest = data[0];
        restaurantId = rest.id;
        document.getElementById('setting-name').value = rest.name || '';
        document.getElementById('setting-phone').value = rest.phone || '';
        if (rest.logo_url) {
          document.getElementById('setting-logo').value = rest.logo_url;
          const img = document.getElementById('logo-preview');
          img.src = rest.logo_url;
          img.style.display = 'block';
        }
      }
    }

    function showFileName() {
      const file = document.getElementById('logo-file').files[0];
      if (file) {
        document.querySelector('.file-btn').innerText = file.name.substring(0, 10) + "...";
      }
    }

    async function uploadLogo() {
      const fileInput = document.getElementById('logo-file');
      const btn = document.getElementById('upload-action-btn');

      if (fileInput.files.length === 0) {
        return alert("Pehle computer se photo select karein!");
      }

      btn.innerText = "Uploading...";
      btn.disabled = true;

      const file = fileInput.files[0];
      const ext = file.name.split('.').pop();
      const fileName = `logo_${restaurantId || Date.now()}.${ext}`;

      const { data, error } = await supabaseClient.storage
        .from('restaurant-logos')
        .upload(fileName, file, { upsert: true });

      btn.innerText = "Upload Photo";
      btn.disabled = false;

      if (error) {
        alert("Upload error: " + error.message);
        return;
      }

      const { data: publicData } = supabaseClient.storage
        .from('restaurant-logos')
        .getPublicUrl(fileName);

      document.getElementById('setting-logo').value = publicData.publicUrl;
      const img = document.getElementById('logo-preview');
      img.src = publicData.publicUrl;
      img.style.display = 'block';

      alert("Photo Upload Ho Gayi!");
    }

    async function saveProfile() {
      if (!restaurantId) return alert('No Restaurant Found');

      const name = document.getElementById('setting-name').value;
      const phone = document.getElementById('setting-phone').value;
      const logo_url = document.getElementById('setting-logo').value;

      const { error } = await supabaseClient
        .from('restaurants')
        .update({ name, phone, logo_url })
        .eq('id', restaurantId);

      if (error) alert("Save Error: " + error.message);
      else alert("Profile Updated Successfully!");
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    window.onload = loadData;
  </script>
</body>
</html>
