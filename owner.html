<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard - FreeMenu.in</title>
  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --primary: #ff4757; --bg: #f8fafc; --text: #0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logout-btn { background: #e2e8f0; color: #334155; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .logout-btn:hover { background: #cbd5e1; }

    .card { background: white; padding: 24px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h1 { font-size: 22px; font-weight: 700; }
    h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: #1e293b; }
    .status-box { color: #64748b; font-size: 14px; margin-top: 4px; word-break: break-all; }
    
    .link-section { background: #f1f5f9; padding: 16px; border-radius: 10px; border: 1px dashed #cbd5e1; margin-bottom: 20px; }
    .link-title { font-size: 13px; font-weight: 600; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
    .link-box a { color: var(--primary); font-weight: 700; font-size: 16px; text-decoration: none; word-break: break-all; }

    .qr-section { text-align: center; background: #fafafa; padding: 20px; border-radius: 12px; border: 1px solid #f1f5f9; }
    #qrcode { display: flex; justify-content: center; margin: 16px 0; }
    #qrcode img { border: 8px solid white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    /* Form Styles */
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    .form-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    .form-input:focus { border-color: var(--primary); }
    .row { display: flex; gap: 10px; }

    .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
    .btn:hover { background: #e03847; }
    .btn-secondary { background: #3b82f6; }
    .btn-secondary:hover { background: #2563eb; }

    .item-list { margin-top: 15px; }
    .item-card { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #f1f5f9; }
    .item-info strong { display: block; font-size: 14px; }
    .item-info span { font-size: 12px; color: #64748b; }
    .item-price { font-weight: 700; color: #16a34a; }

    .err-text { color: #dc2626; font-weight: 600; }
    .warn-text { color: #d97706; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Header -->
    <div class="header-bar">
      <div>
        <h1>Owner Dashboard</h1>
        <div id="owner-email" class="status-box">Loading account details...</div>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- Live Menu Link & QR Section -->
    <div class="card">
      <div class="link-section">
        <div class="link-title">Your Public Menu Link</div>
        <div class="link-box" id="public-link">Fetching link...</div>
      </div>

      <div class="qr-section">
        <div class="link-title">Table Scan QR Code</div>
        <div id="qrcode"></div>
        <button class="btn" style="width: auto;" onclick="downloadQR()">Download QR Code</button>
      </div>
    </div>

    <!-- Add Item Form Section -->
    <div class="card">
      <h2>+ Add New Menu Item</h2>
      <form id="add-item-form" onsubmit="addMenuItem(event)">
        <div class="form-group">
          <label>Item Name</label>
          <input type="text" id="item-name" class="form-input" placeholder="e.g. Paneer Butter Masala" required>
        </div>
        
        <div class="row">
          <div class="form-group" style="flex:1;">
            <label>Price (₹)</label>
            <input type="number" id="item-price" class="form-input" placeholder="240" required>
          </div>
          <div class="form-group" style="flex:1;">
            <label>Category</label>
            <input type="text" id="item-category" class="form-input" placeholder="e.g. Main Course" required>
          </div>
        </div>

        <button type="submit" class="btn btn-secondary" id="save-btn">+ Add Item to Menu</button>
      </form>
    </div>

    <!-- Existing Items List Section -->
    <div class="card">
      <h2>Current Menu Items</h2>
      <div id="items-list" class="item-list">
        <p style="color: #64748b; font-size: 14px;">Loading menu items...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE"; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentRestaurantId = null;

    async function loadDashboard() {
      const emailEl = document.getElementById('owner-email');
      const linkEl = document.getElementById('public-link');

      try {
        // Step 1: Check Auth Session
        const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

        if (authError || !user) {
          window.location.href = "/login.html";
          return;
        }

        emailEl.innerText = `Logged in as: ${user.email}`;

        // Step 2: Fetch Restaurant Info
        const { data: restaurant, error: restError } = await supabaseClient
          .from('restaurants')
          .select('*')
          .eq('owner_id', user.id)
          .maybeSingle();

        if (restError || !restaurant) {
          linkEl.innerHTML = `<span class="warn-text">No restaurant registered yet.</span>`;
          return;
        }

        currentRestaurantId = restaurant.id;

        // Step 3: Display Dynamic URL & QR Code
        const fullCleanUrl = `${window.location.origin}/menu/${restaurant.slug}`;
        linkEl.innerHTML = `<a href="${fullCleanUrl}" target="_blank">${fullCleanUrl}</a>`;

        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
          text: fullCleanUrl,
          width: 160,
          height: 160
        });

        // Step 4: Load existing Menu Items
        loadMenuItems();

      } catch (err) {
        console.error("Runtime Error:", err);
      }
    }

    // Add Item Function
    async function addMenuItem(e) {
      e.preventDefault();
      if (!currentRestaurantId) {
        alert("Restaurant ID not found. Please try again.");
        return;
      }

      const name = document.getElementById('item-name').value;
      const price = parseFloat(document.getElementById('item-price').value);
      const category = document.getElementById('item-category').value;
      const saveBtn = document.getElementById('save-btn');

      saveBtn.innerText = "Saving...";
      saveBtn.disabled = true;

      const { error } = await supabaseClient
        .from('menu_items')
        .insert([{ 
          restaurant_id: currentRestaurantId, 
          name: name, 
          price: price, 
          category: category 
        }]);

      saveBtn.innerText = "+ Add Item to Menu";
      saveBtn.disabled = false;

      if (error) {
        console.error("Error adding item:", error);
        alert("Error adding item! Check database permissions.");
      } else {
        document.getElementById('add-item-form').reset();
        loadMenuItems();
      }
    }

    // Load Items List Function
    async function loadMenuItems() {
      const listEl = document.getElementById('items-list');
      
      const { data: items, error } = await supabaseClient
        .from('menu_items')
        .select('*')
        .eq('restaurant_id', currentRestaurantId);

      if (error || !items) {
        listEl.innerHTML = `<p style="color:#ef4444; font-size:14px;">Failed to load items.</p>`;
        return;
      }

      if (items.length === 0) {
        listEl.innerHTML = `<p style="color:#64748b; font-size:14px;">No items added yet.</p>`;
        return;
      }

      listEl.innerHTML = items.map(item => `
        <div class="item-card">
          <div class="item-info">
            <strong>${item.name}</strong>
            <span>Category: ${item.category || 'General'}</span>
          </div>
          <div class="item-price">₹${item.price}</div>
        </div>
      `).join('');
    }

    // Logout Function
    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = "/login.html";
    }

    // Download QR Code
    function downloadQR() {
      const qrImg = document.querySelector('#qrcode img');
      if (qrImg) {
        const link = document.createElement('a');
        link.href = qrImg.src;
        link.download = 'restaurant-menu-qr.png';
        link.click();
      }
    }

    window.onload = loadDashboard;
  </script>
</body>
</html>
