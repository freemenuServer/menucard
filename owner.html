<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Portal - FreeMenu.in</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --primary: #ff4757; --bg: #f8fafc; --text: #0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .container { max-width: 650px; margin: 0 auto; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo-title { font-size: 20px; font-weight: 800; color: var(--primary); text-decoration: none; }
    .logout-btn { background: #e2e8f0; color: #334155; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .logout-btn:hover { background: #cbd5e1; }

    .card { background: white; padding: 24px; border-radius: 16px; border: 1px solid #e2e8f0; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; color: #1e293b; }
    .status-box { color: #64748b; font-size: 14px; word-break: break-all; }
    
    .link-section { background: #f1f5f9; padding: 16px; border-radius: 10px; border: 1px dashed #cbd5e1; margin-bottom: 20px; }
    .link-title { font-size: 13px; font-weight: 600; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
    .link-box a { color: var(--primary); font-weight: 700; font-size: 16px; text-decoration: none; word-break: break-all; }

    .qr-section { text-align: center; background: #fafafa; padding: 20px; border-radius: 12px; border: 1px solid #f1f5f9; }
    #qrcode { display: flex; justify-content: center; margin: 16px 0; }
    #qrcode img { border: 8px solid white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    .form-input, .form-select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: white; }
    .form-input:focus, .form-select:focus { border-color: var(--primary); }
    .row { display: flex; gap: 10px; }

    .btn { background: var(--primary); color: white; border: none; padding: 11px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; font-size: 14px; }
    .btn:hover { background: #e03847; }
    .btn-secondary { background: #3b82f6; }
    .btn-secondary:hover { background: #2563eb; }
    
    .delete-btn { background: #fee2e2; color: #dc2626; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .delete-btn:hover { background: #fca5a5; }

    .item-list { margin-top: 10px; }
    .item-card { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
    .item-info strong { display: block; font-size: 14px; }
    .item-info span { font-size: 12px; color: #64748b; }
    .item-right { display: flex; align-items: center; gap: 12px; }
    .item-price { font-weight: 700; color: #16a34a; font-size: 15px; }

    .err-text { color: #dc2626; font-weight: 600; font-size: 13px; }
    .success-text { color: #16a34a; font-weight: 600; font-size: 13px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="header-bar">
      <a href="/" class="logo-title">🍽️ freemenu.in</a>
      <button id="logout-btn" class="logout-btn hidden" onclick="logout()">Logout</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-section" class="card hidden">
      <h1>Owner Login</h1>
      <p style="color:#64748b; font-size:14px; margin-bottom:20px;">Log in to manage menu & categories</p>

      <form id="login-form" onsubmit="handleAuth(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="owner@restaurant.com" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="auth-submit-btn" class="btn">Login / Sign Up</button>
      </form>
      <div id="auth-msg" style="margin-top: 12px;"></div>
    </div>

    <!-- OWNER DASHBOARD -->
    <div id="dashboard-section" class="hidden">
      <div class="card">
        <h1>Dashboard</h1>
        <div id="owner-email" class="status-box">Loading...</div>
      </div>

      <div class="card">
        <div class="link-section">
          <div class="link-title">Your Public Menu Link</div>
          <div class="link-box" id="public-link">Fetching link...</div>
        </div>

        <div class="qr-section">
          <div class="link-title">Table Scan QR Code</div>
          <div id="qrcode"></div>
          <button class="btn" style="width: auto; margin-top: 8px;" onclick="downloadQR()">Download QR Code</button>
        </div>
      </div>

      <!-- Add Category Section -->
      <div class="card">
        <h2>1. Add Category</h2>
        <form id="add-category-form" onsubmit="addCategory(event)">
          <div class="row">
            <input type="text" id="category-name" class="form-input" placeholder="e.g. Starters, Main Course, Drinks" required>
            <button type="submit" id="add-cat-btn" class="btn" style="width: 150px;">+ Add Category</button>
          </div>
        </form>
      </div>

      <!-- Add Menu Item Section -->
      <div class="card">
        <h2>2. Add New Menu Item</h2>
        <form id="add-item-form" onsubmit="addMenuItem(event)">
          <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="item-name" class="form-input" placeholder="e.g. Paneer Tikka" required>
          </div>
          
          <div class="row">
            <div class="form-group" style="flex:1;">
              <label>Select Category</label>
              <select id="item-category-select" class="form-select" required>
                <option value="">Loading categories...</option>
              </select>
            </div>
            <div class="form-group" style="flex:1;">
              <label>Price (₹)</label>
              <input type="number" id="item-price" class="form-input" placeholder="220" required>
            </div>
          </div>

          <button type="submit" class="btn btn-secondary" id="save-item-btn">+ Add Item to Menu</button>
        </form>
      </div>

      <!-- Current Items List -->
      <div class="card">
        <h2>Current Menu Items</h2>
        <div id="items-list" class="item-list">
          <p style="color: #64748b; font-size: 14px;">Loading menu items...</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE"; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentRestaurantId = null;

    async function initPage() {
      const { data: { user } } = await supabaseClient.auth.getUser();

      if (!user) {
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
        document.getElementById('logout-btn').classList.add('hidden');
      } else {
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('logout-btn').classList.remove('hidden');
        loadDashboardData(user);
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const msgEl = document.getElementById('auth-msg');
      const submitBtn = document.getElementById('auth-submit-btn');

      submitBtn.innerText = "Authenticating...";
      submitBtn.disabled = true;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ email, password });

        if (signUpError) {
          msgEl.innerHTML = `<span class="err-text">${error.message}</span>`;
          submitBtn.innerText = "Login / Sign Up";
          submitBtn.disabled = false;
        } else {
          msgEl.innerHTML = `<span class="success-text">Account created & Logged in!</span>`;
          initPage();
        }
      } else {
        msgEl.innerHTML = `<span class="success-text">Logged in successfully!</span>`;
        initPage();
      }
    }

    async function loadDashboardData(user) {
      document.getElementById('owner-email').innerText = `Logged in as: ${user.email}`;
      const linkEl = document.getElementById('public-link');

      const { data: restaurant, error } = await supabaseClient
        .from('restaurants')
        .select('*')
        .eq('owner_id', user.id)
        .maybeSingle();

      if (error || !restaurant) {
        linkEl.innerHTML = `<span class="err-text">No restaurant linked to this account.</span>`;
        return;
      }

      currentRestaurantId = restaurant.id;

      const fullCleanUrl = `${window.location.origin}/menu/${restaurant.slug}`;
      linkEl.innerHTML = `<a href="${fullCleanUrl}" target="_blank">${fullCleanUrl}</a>`;

      document.getElementById('qrcode').innerHTML = "";
      new QRCode(document.getElementById("qrcode"), { text: fullCleanUrl, width: 160, height: 160 });

      await loadCategories();
      loadMenuItems();
    }

    // Database mein Permamently Category Add Karein
    async function addCategory(e) {
      e.preventDefault();
      if (!currentRestaurantId) return alert("Restaurant not loaded.");

      const catInput = document.getElementById('category-name');
      const catBtn = document.getElementById('add-cat-btn');
      const categoryName = catInput.value.trim();

      if (!categoryName) return;

      catBtn.innerText = "Adding...";
      catBtn.disabled = true;

      const { error } = await supabaseClient
        .from('categories')
        .insert([{ restaurant_id: currentRestaurantId, name: categoryName }]);

      catBtn.innerText = "+ Add Category";
      catBtn.disabled = false;

      if (error) {
        alert("Category Error: " + error.message);
      } else {
        catInput.value = "";
        loadCategories();
      }
    }

    // Database se Categories Load karke Dropdown mein Dikhayein
    async function loadCategories() {
      const selectEl = document.getElementById('item-category-select');

      const { data: categories, error } = await supabaseClient
        .from('categories')
        .select('*')
        .eq('restaurant_id', currentRestaurantId)
        .order('created_at', { ascending: true });

      if (error) {
        selectEl.innerHTML = '<option value="">Error loading categories</option>';
        return;
      }

      if (!categories || categories.length === 0) {
        selectEl.innerHTML = '<option value="">No categories added yet</option>';
        return;
      }

      selectEl.innerHTML = '<option value="">-- Choose Category --</option>';
      categories.forEach(cat => {
        selectEl.innerHTML += `<option value="${cat.name}">${cat.name}</option>`;
      });
    }

    // Menu Item Add Karein
    async function addMenuItem(e) {
      e.preventDefault();
      if (!currentRestaurantId) return alert("Restaurant ID missing.");

      const name = document.getElementById('item-name').value;
      const category = document.getElementById('item-category-select').value;
      const price = parseFloat(document.getElementById('item-price').value);
      const saveBtn = document.getElementById('save-item-btn');

      if (!category) return alert("Please select a category first!");

      saveBtn.innerText = "Saving...";
      saveBtn.disabled = true;

      const { error } = await supabaseClient
        .from('menu_items')
        .insert([{ restaurant_id: currentRestaurantId, name, category, price }]);

      saveBtn.innerText = "+ Add Item to Menu";
      saveBtn.disabled = false;

      if (error) {
        alert("Error adding item: " + error.message);
      } else {
        document.getElementById('add-item-form').reset();
        loadMenuItems();
      }
    }

    // Menu Items Load & Delete Action
    async function loadMenuItems() {
      const listEl = document.getElementById('items-list');
      
      const { data: items, error } = await supabaseClient
        .from('menu_items')
        .select('*')
        .eq('restaurant_id', currentRestaurantId);

      if (error || !items) {
        listEl.innerHTML = `<p class="err-text">Failed to load items.</p>`;
        return;
      }

      if (items.length === 0) {
        listEl.innerHTML = `<p style="color:#64748b; font-size:14px;">No items added yet.</p>`;
        return;
      }

      listEl.innerHTML = items.map(item => `
        <div class="item-card">
          <div class="item-info">
            <strong>${item.name}</strong>
            <span>Category: ${item.category || 'General'}</span>
          </div>
          <div class="item-right">
            <span class="item-price">₹${item.price}</span>
            <button class="delete-btn" onclick="deleteMenuItem('${item.id}')">🗑️ Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function deleteMenuItem(itemId) {
      if (!confirm("Are you sure you want to delete this item?")) return;

      const { error } = await supabaseClient
        .from('menu_items')
        .delete()
        .eq('id', itemId);

      if (error) {
        alert("Failed to delete item: " + error.message);
      } else {
        loadMenuItems();
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      initPage();
    }

    function downloadQR() {
      const qrImg = document.querySelector('#qrcode img');
      if (qrImg) {
        const link = document.createElement('a');
        link.href = qrImg.src;
        link.download = 'restaurant-menu-qr.png';
        link.click();
      }
    }

    window.onload = initPage;
  </script>
</body>
</html>
