<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7b1e16" />
  <title>Digital Menu</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    :root {
      --primary: #7b1e16;
      --primary-dark: #5a140f;
      --primary-soft: #fff4e8;
      --accent: #c8943e;
      --bg: #f5eee5;
      --surface: #fffaf2;
      --surface-2: #f7eee4;
      --text: #4a281a;
      --muted: #7d6558;
      --border: #d9c39a;
      --veg: #16a34a;
      --nonveg: #dc2626;
      --egg: #d97706;
      --danger: #dc2626;
      --radius: 18px;
      --shadow: 0 10px 30px rgba(15, 23, 42, .06);
      --font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-family);
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    img { display: block; max-width: 100%; }

    .app-shell {
      width: min(100%, 820px);
      margin: 0 auto;
    }

    /* HERO */
    .hero {
      position: relative;
      min-height: 190px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--primary) 94%, black 6%), var(--primary-dark));
      overflow: hidden;
      color: #fff;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      pointer-events: none;
    }
    .hero::before { width: 190px; height: 190px; right: -70px; top: -65px; }
    .hero::after { width: 120px; height: 120px; left: -40px; bottom: -55px; }

    .hero-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .22;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.44));
    }

    .hero-content {
      position: relative;
      z-index: 2;
      min-height: 190px;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      padding: 22px 16px 18px;
    }

    .logo-wrap {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      flex: 0 0 auto;
      background: rgba(255,255,255,.96);
      border: 3px solid rgba(255,255,255,.65);
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--primary);
    }

    .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .logo-fallback svg { width: 30px; height: 30px; }

    .hero-info { min-width: 0; flex: 1; }
    .restaurant-name {
      margin: 0;
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.1;
      font-weight: 850;
      letter-spacing: -.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,.2);
    }

    .restaurant-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-top: 8px;
      font-size: 12.5px;
      color: rgba(255,255,255,.9);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      backdrop-filter: blur(8px);
      font-weight: 700;
      white-space: nowrap;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
    .status-badge.closed .status-dot { background: #f87171; }

    .hero-action {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 14px;
      background: rgba(255,255,255,.16);
      color: #fff;
      display: none;
      place-items: center;
      text-decoration: none;
      backdrop-filter: blur(10px);
    }

    /* STICKY CONTROL AREA */
    .sticky-panel {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      padding: 10px 12px 8px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(15,23,42,.04);
      overflow: hidden;
    }

    .search-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--muted);
      flex: 0 0 auto;
    }

    #menu-search {
      width: 100%;
      height: 44px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 0 12px 0 0;
      font-size: 14px;
    }
    #menu-search::placeholder { color: #9ca3af; }

    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 9px;
      scrollbar-width: none;
      overscroll-behavior-inline: contain;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      min-height: 34px;
      padding: 7px 13px;
      border-radius: 999px;
      white-space: nowrap;
      font-size: 12.5px;
      font-weight: 750;
      cursor: pointer;
      transition: .18s ease;
    }
    .cat-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 5px 14px color-mix(in srgb, var(--primary) 22%, transparent);
    }

    /* CONTENT */
    .menu-wrap { padding: 14px 12px 30px; }

    .summary-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 2px 2px 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .category-section {
      scroll-margin-top: 110px;
      margin-bottom: 20px;
    }

    .category-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 2px 9px;
    }

    .category-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 850;
      letter-spacing: -.2px;
    }
    .item-count {
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .items-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }


    /* Plan-gated public menu enhancements: additive only. */
    .item-ar{margin-top:10px;border-radius:14px;overflow:hidden;background:#f7f7f7}
    .item-ar model-viewer{width:100%;height:220px;background:transparent}
    .ar-actions{display:flex;gap:8px;padding:9px;flex-wrap:wrap}
    .ar-actions a,.ar-actions button{border:1px solid #ddd;border-radius:10px;padding:7px 10px;background:#fff;font:inherit;text-decoration:none;cursor:pointer}
    .plan-share-link{display:inline-flex;align-items:center;gap:6px}

    .menu-item {
      position: relative;
      display: flex;
      gap: 13px;
      padding: 14px;
      border-bottom: 1px solid var(--border);
      transition: background .2s ease;
    }
    .menu-item:last-child { border-bottom: 0; }
    .menu-item:active { background: var(--surface-2); }
    .menu-item.unavailable { opacity: .58; }

    .item-content { flex: 1; min-width: 0; }
    .item-main-row { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-topline { display: flex; align-items: flex-start; gap: 7px; }

    /* Menu-style right-aligned portion columns */
    .item-price-area {
      flex: 0 0 158px;
      width: 158px;
      align-self: flex-start;
      margin-left: auto;
    }
    .price-header {
      display: grid;
      grid-template-columns: repeat(3, 45px);
      gap: 5px;
      justify-content: end;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 10px;
      line-height: 1;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .45px;
      text-align: center;
    }
    .price-header.single { grid-template-columns: 58px; }
    .portion-prices {
      display: grid;
      grid-template-columns: repeat(3, 45px);
      gap: 5px;
      justify-content: end;
      align-items: center;
    }
    .portion-price {
      width: 45px;
      min-width: 45px;
      padding: 2px 0;
      text-align: center;
      border: 0;
      background: transparent;
      border-radius: 0;
      color: var(--primary);
      font-weight: 850;
    }
    .portion-price.empty {
      background: transparent;
      border: 0;
      color: #cbbdaf;
    }
    .portion-price .label { display: none; }
    .portion-price .amount {
      margin-top: 0;
      font-size: 13px;
      line-height: 1.25;
      white-space: nowrap;
    }
    .single-price-area { display: flex; justify-content: flex-end; }
    .single-price {
      margin-top: 0;
      width: 58px;
      padding: 2px 0;
      border: 0;
      background: transparent;
      border-radius: 0;
      color: var(--primary);
      font-size: 13px;
      font-weight: 850;
      text-align: center;
      white-space: nowrap;
    }

    .food-symbol {
      width: 15px;
      height: 15px;
      margin-top: 2px;
      border-radius: 3px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }
    .food-symbol::after { content: ""; width: 7px; height: 7px; border-radius: 50%; }
    .food-symbol.veg { border: 1.6px solid var(--veg); }
    .food-symbol.veg::after { background: var(--veg); }
    .food-symbol.nonveg { border: 1.6px solid var(--nonveg); }
    .food-symbol.nonveg::after { background: var(--nonveg); border-radius: 1px; transform: rotate(45deg); width: 6px; height: 6px; }
    .food-symbol.egg { border: 1.6px solid var(--egg); }
    .food-symbol.egg::after { background: var(--egg); }

    .item-name {
      margin: 0;
      font-size: 15.5px;
      line-height: 1.25;
      font-weight: 790;
      color: var(--text);
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 10px;
      line-height: 1;
      font-weight: 800;
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .tag.out { background: #fef2f2; color: #b91c1c; }
    .tag.hot { background: #fff7ed; color: #c2410c; }

    .item-desc {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-image-wrap {
      position: relative;
      width: 92px;
      height: 92px;
      flex: 0 0 92px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .item-image { width: 100%; height: 100%; object-fit: cover; }
    .img-placeholder {
      width: 100%; height: 100%;
      display: grid; place-items: center;
      color: #9ca3af;
      background: linear-gradient(135deg, #f8fafc, #f1f5f9);
    }
    .img-placeholder svg { width: 26px; height: 26px; }

    /* Warm printed-menu card styling */
    .category-section { margin-bottom: 18px; }
    .category-heading {
      margin: 0;
      padding: 11px 14px;
      background: var(--primary);
      border-radius: 15px 15px 0 0;
      color: #fffaf2;
    }
    .category-title {
      color: #fffaf2;
      font-size: 17px;
      text-transform: uppercase;
      letter-spacing: .35px;
    }
    .item-count { color: rgba(255,250,242,.78); }
    .items-list {
      border: 1px solid var(--border);
      border-top: 0;
      border-radius: 0 0 15px 15px;
      background: var(--surface);
      box-shadow: 0 4px 12px rgba(90,20,15,.07);
    }
    .menu-item {
      padding: 11px 13px;
      border-bottom: 1px dashed #e2cda9;
      background: var(--surface);
    }
    .menu-item:last-child { border-bottom: 0; }
    .item-name { color: #6b174b; font-size: 14.5px; }
    .item-desc { color: #8a7668; }
    .price-header { color: #5a321e; }
    .summary-line { color: var(--muted); }

    @media (max-width: 560px) {
      .menu-item { padding: 10px 10px; gap: 8px; }
      .item-main-row { gap: 6px; }
      .item-price-area { flex-basis: 151px; width: 151px; }
      .price-header, .portion-prices { grid-template-columns: repeat(3, 43px); gap: 4px; }
      .portion-price { width: 43px; min-width: 43px; }
      .price-header.single { grid-template-columns: 55px; }
      .single-price { width: 55px; }
      .item-name { font-size: 14px; }
      .portion-price .amount, .single-price { font-size: 12px; }
    }

    /* STATES */
    .state-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 34px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      color: var(--muted);
    }
    .state-card strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 5px; }

    .skeleton {
      overflow: hidden;
      position: relative;
      background: #e9edf2;
      border-radius: 10px;
    }
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
      animation: shimmer 1.25s infinite;
    }
    @keyframes shimmer { 100% { transform: translateX(100%); } }

    .loading-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .loading-row { display: flex; gap: 12px; padding: 14px; border-bottom: 1px solid var(--border); }
    .loading-row:last-child { border-bottom: 0; }
    .sk-line { height: 12px; margin-bottom: 8px; }
    .sk-title { width: 58%; height: 15px; }
    .sk-text { width: 85%; }
    .sk-price { width: 35%; }
    .sk-img { width: 90px; height: 90px; flex: 0 0 90px; }

    .footer-note {
      text-align: center;
      color: #9ca3af;
      font-size: 11px;
      padding: 8px 16px 0;
    }

    @media (min-width: 640px) {
      body { padding-top: 18px; }
      .app-shell {
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(15,23,42,.08);
      }
      .hero, .hero-content { min-height: 220px; }
      .hero-content { padding: 28px 24px 22px; }
      .sticky-panel { padding-inline: 18px; }
      .menu-wrap { padding-inline: 18px; }
      .menu-item { padding: 16px; }
      .item-image-wrap { width: 110px; height: 100px; flex-basis: 110px; }
    }
  
    .hero-welcome{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:18px;color:var(--accent,#d8ad62);margin-bottom:2px}
    .hero-tagline{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(28px,6vw,48px);line-height:.98;text-transform:uppercase;letter-spacing:1px;margin:0;color:#fff}
    .hero-subtitle{font-size:12px;font-weight:800;letter-spacing:2px;margin-top:7px;color:rgba(255,255,255,.94)}
    .hero-features{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:13px;font-size:12px;color:#fff}
    .hero-feature{display:inline-flex;align-items:center;gap:5px}
    .hero-slogans{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;line-height:.98;margin-top:18px;color:#fff}
    .hero-slogans div:last-child{padding-left:45px;margin-top:3px}
    .service-strip{background:#fff;color:#111827;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;font-size:12px}
    .service-left{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
    .open-pill{background:#12964e;color:#fff;border-radius:999px;padding:8px 13px;font-weight:800}
    .service-time{font-weight:700}
    .services{display:flex;align-items:center;gap:15px;flex-wrap:wrap;font-weight:700}
    .service{display:inline-flex;align-items:center;gap:5px}
    @media(max-width:640px){
      .hero-features{gap:7px 10px}.hero-slogans{font-size:17px}
      .service-strip{align-items:flex-start;flex-direction:column}.services{gap:10px}
    }


    /* ===== Modern restaurant menu refresh ===== */
    .app-shell{background:var(--bg);}
    .hero{
      min-height:330px;
      border-radius:0 0 28px 28px;
      isolation:isolate;
      box-shadow:0 14px 40px rgba(30,20,10,.16);
    }

      background:
        linear-gradient(180deg,rgba(8,8,8,.05) 0%,rgba(8,8,8,.18) 40%,rgba(8,8,8,.82) 100%),
        linear-gradient(135deg,rgba(0,0,0,.18),transparent 60%);
    }
    .hero::before{width:260px;height:260px;right:-120px;top:-110px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12)}

    .logo-wrap{
      width:78px;height:78px;border-radius:22px;border:4px solid rgba(255,255,255,.9);
      box-shadow:0 12px 28px rgba(0,0,0,.28);background:#fff;
    }
    .hero-info{padding-bottom:2px;}
    .hero-welcome{font-size:17px;opacity:.94}
    .hero-tagline{font-size:clamp(30px,8vw,52px);text-shadow:0 3px 18px rgba(0,0,0,.25)}
    .hero-subtitle{font-size:11px;letter-spacing:2.4px;opacity:.94}
    .hero-features{gap:7px;margin-top:12px}
    .hero-feature{padding:5px 9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.10);border-radius:999px;backdrop-filter:blur(10px)}
    .hero-slogans{margin-top:14px;font-size:18px}

    .service-strip{
      margin:-14px 12px 0;position:relative;z-index:4;border:1px solid rgba(255,255,255,.8);

    }
    .open-pill{padding:7px 11px;font-size:11px}
    .services{font-size:11px;gap:9px;color:#4b5563}
    .service{padding:4px 7px;background:#f8fafc;border-radius:999px}

    .sticky-panel{
      top:0;margin-top:10px;padding:10px 12px 7px;background:linear-gradient(180deg,rgba(245,238,229,.97),rgba(245,238,229,.82));
      border-bottom:0;
    }
    .search-wrap{border-radius:17px;box-shadow:0 10px 24px rgba(0,0,0,.07);background:rgba(255,255,255,.9)}
    .search-icon{width:46px;height:46px;color:var(--primary)}
    #menu-search{height:46px;font-size:14px}
    .category-scroll{gap:9px;padding:10px 1px 5px;margin-bottom:12px}
    .cat-chip{border-radius:999px!important;padding:9px 14px!important;font-weight:800!important;box-shadow:0 3px 10px rgba(0,0,0,.05)}

    .menu-wrap{padding:8px 12px 18px}

    .category-section{margin-bottom:20px}
    .category-heading{
      padding:13px 15px;border-radius:18px 18px 0 0;box-shadow:0 5px 16px rgba(60,20,10,.12);position:relative;overflow:hidden;
    }
    .category-heading::after{content:"";position:absolute;right:-15px;top:-24px;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.09)}
    .category-title{font-size:15px;letter-spacing:.8px}
    .items-list{border-radius:0 0 18px 18px;box-shadow:0 8px 22px rgba(30,20,10,.08);}
    .menu-item{padding:14px 13px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,250,242,.94));}
    .menu-item + .menu-item{background:rgba(255,250,242,.92)}
    .menu-item:active{transform:scale(.997);background:var(--surface-2)}
    .item-main-row{align-items:center}
    .item-topline{align-items:center}
    .item-name{font-size:15.5px;letter-spacing:-.1px}
    .item-desc{font-size:12px;line-height:1.5;margin-top:6px}
    .item-tags{margin-top:7px}
    .tag{padding:4px 8px;font-size:9.5px}

  <script>
    /* =========================================================
       SUPABASE CONFIG
       Keep RLS enabled in Supabase. An anon/public key is safe to
       expose only when your database policies are configured correctly.
    ========================================================== */
    const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let restaurant = null;
    let allItems = [];
    let currentCategory = "all";
    let searchText = "";

    const $ = (id) => document.getElementById(id);

    function escapeHTML(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeUrl(value) {
      if (!value) return "";
      try {
        const url = new URL(value, window.location.origin);
        if (["http:", "https:"].includes(url.protocol)) return url.href;
      } catch (_) {}
      return "";
    }

    function cssColor(value, fallback) {
      if (!value) return fallback;
      const test = document.createElement("span");
      test.style.color = "";
      test.style.color = value;
      return test.style.color ? value : fallback;
    }

    function applyRestaurantTheme(rest) {
      const root = document.documentElement.style;

      // These fields are OPTIONAL. If your table does not have them,
      // the fallback colors below will be used automatically.
      const primary = cssColor(rest.primary_color || rest.theme_primary, "#0f766e");
      const primaryDark = cssColor(rest.primary_dark || rest.theme_primary_dark, "#115e59");
      const bg = cssColor(rest.background_color || rest.theme_background, "#f6f7f9");
      const surface = cssColor(rest.card_color || rest.theme_card, "#ffffff");
      const text = cssColor(rest.text_color || rest.theme_text, "#111827");

      root.setProperty("--primary", primary);
      root.setProperty("--primary-dark", primaryDark);
      root.setProperty("--bg", bg);
      root.setProperty("--surface", surface);
      root.setProperty("--text", text);

      const radius = Number(rest.card_radius || rest.theme_radius);
      if (Number.isFinite(radius) && radius >= 0 && radius <= 40) {
        root.setProperty("--radius", `${radius}px`);
      }

      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", primary);
    }

    function showLoading() {
      $("menu-sections").innerHTML = `
        <div class="loading-list" aria-label="Loading menu">
          ${[1,2,3,4].map(() => `
            <div class="loading-row">
              <div style="flex:1; padding-top:4px;">
                <div class="skeleton sk-title sk-line"></div>
                <div class="skeleton sk-text sk-line"></div>
                <div class="skeleton sk-price sk-line"></div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function showState(title, message) {
      $("menu-sections").innerHTML = `
        <div class="state-card">
          <strong>${escapeHTML(title)}</strong>
          <span>${escapeHTML(message)}</span>
        </div>
      `;
    }

    function logoFallback() {
      return `
        <div class="logo-fallback" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 11h18M5 11v7h14v-7M8 7h8M9 4h6"/>
          </svg>
        </div>
      `;
    }


    function publicPlanSlug(){
      return String(window.fmPublicPlan?.slug || window.fmPublicPlan?.name || "free-starter").trim().toLowerCase();
    }
    function publicPlanFeatures(){
      const raw=window.fmPublicPlan?.features;
      return Array.isArray(raw) ? raw.filter(x=>x && x.enabled !== false).map(x=>String(x.text||"").toLowerCase()) : [];
    }
    function publicPlanHasFeature(fragment){
      const needle=String(fragment||"").toLowerCase();
      return publicPlanFeatures().some(text=>text.includes(needle));
    }
    function publicPlanTier(){
      const slug=publicPlanSlug();
      if(slug.includes("full-3d")) return "full-3d-experience";
      if(slug.includes("signature-3d") || slug.includes("signature")) return "signature-3d";
      if(slug.includes("growth") || slug.includes("premium")) return "growth-photos";
      return "free-starter";
    }
    function publicPlanAllowsPhotos(){
      return publicPlanTier() !== "free-starter";
    }
    function publicPlanAllowsTags(){
      return publicPlanHasFeature("bestseller") || publicPlanHasFeature("chef special") || publicPlanHasFeature("veg / non-veg / egg");
    }
    function publicPlanAllowsWhatsApp(){
      return publicPlanHasFeature("whatsapp menu sharing");
    }
    function publicPlanArLimit(){
      const p=window.fmPublicPlan;
      if(!p) return 0;
      const configured=Number(p.signature_3d_dishes_max);
      if(Number.isFinite(configured) && configured>0) return configured;
      return publicPlanTier()==="full-3d-experience" ? 15 : publicPlanTier()==="signature-3d" ? 5 : 0;
    }
    function publicPlanAllowsAR(item){
      if(publicPlanArLimit()<=0) return false;
      if(window.fmPublicArIds instanceof Set && item?.id != null) return window.fmPublicArIds.has(String(item.id));
      return !!(item && (item.ar_model_url || item.ar_usdz_url) && item.ar_enabled !== false);
    }

    function renderItemAR(item){
      if(!publicPlanAllowsAR(item)) return "";
      const glb=item.ar_model_url || "";
      const usdz=item.ar_usdz_url || "";
      if(!glb && !usdz) return "";
      return `<div class="item-ar">
        <model-viewer src="${escapeHTML(glb)}" ${usdz?`ios-src="${escapeHTML(usdz)}"`:""} alt="${escapeHTML(item.name || "3D menu item")}" camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look" loading="lazy" reveal="interaction"></model-viewer>
        <div class="ar-actions">
          <button type="button" data-ar-launch="${escapeHTML(item.id || "")}">View 3D / AR</button>
        </div>
      </div>`;
    }

    function getItemType(item) {
      if (String(item.item_type || "").toLowerCase() === "egg") return "egg";
      if (String(item.item_type || "").toLowerCase() === "nonveg" || item.is_veg === false) return "nonveg";
      return "veg";
    }

    function isUnavailable(item) {
      return item.is_available === false || item.available === false || item.status === "unavailable" || item.status === "out_of_stock";
    }

    function getAvailablePriceModes(items) {
      const hasQuarter = items.some(item =>
        item.price_quarter !== null && item.price_quarter !== undefined && item.price_quarter !== ""
      );
      const hasHalf = items.some(item =>
        item.price_half !== null && item.price_half !== undefined && item.price_half !== ""
      );
      const hasFull = items.some(item =>
        (item.price_full !== null && item.price_full !== undefined && item.price_full !== "") ||
        (item.price !== null && item.price !== undefined && item.price !== "")
      );

      return [
        ...(hasQuarter ? [["quarter", "Quarter"]] : []),
        ...(hasHalf ? [["half", "Half"]] : []),
        ...(hasFull ? [["full", "Full"]] : [])
      ];
    }

    function getPriceValue(item, mode) {
      if (mode === "quarter") return item.price_quarter;
      if (mode === "half") return item.price_half;
      return item.price_full ?? item.price;
    }

    function renderCategoryPriceLabels(items) {
      const modes = getAvailablePriceModes(items);
      if (!modes.length) return "";

      return `
        <div class="categoryPriceSwitch fixed-price-columns" aria-label="Available price sizes">
          ${modes.map(([mode, label]) => `
            <span class="price-size-label" data-price-mode="${mode}">${label}</span>
          `).join("")}
        </div>
      `;
    }

    function renderPrice(item, category, categoryItems) {
      const modes = getAvailablePriceModes(categoryItems || [item]);
      if (!modes.length) return "";

      return `
        <div class="single-price-area fixed-price-columns">
          ${modes.map(([mode]) => {
            const value = getPriceValue(item, mode);
            return `
              <span class="single-price ${value === null || value === undefined || value === "" ? "price-empty" : ""}">
                ${value !== null && value !== undefined && value !== "" ? `₹${escapeHTML(value)}` : "—"}
              </span>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderTags(item) {
      const tags = [];
      if (publicPlanAllowsTags()) {
        if (item.is_bestseller === true || item.bestseller === true) tags.push(`<span class="tag hot">★ Bestseller</span>`);
        if (item.is_recommended === true || item.recommended === true) tags.push(`<span class="tag">Recommended</span>`);
        if (item.is_spicy === true || item.spicy === true) tags.push(`<span class="tag hot">🌶 Spicy</span>`);
      }
      if (isUnavailable(item)) tags.push(`<span class="tag out">Unavailable</span>`);
      return tags.length ? `<div class="item-tags">${tags.join("")}</div>` : "";
    }

    function renderItem(item, categoryItems) {
      const type = getItemType(item);
      const unavailable = isUnavailable(item);

      return `
        <article class="menu-item ${unavailable ? "unavailable" : ""}" data-name="${escapeHTML((item.name || "").toLowerCase())}">
          <div class="item-content">
            <div class="item-main-row">
              <div class="item-info">
                <div class="item-topline">
                  <span class="food-symbol ${type}" aria-label="${type}"></span>
                  <h3 class="item-name">${escapeHTML(item.name || "Unnamed item")}</h3>
                </div>
                ${renderTags(item)}
                ${item.description ? `<p class="item-desc">${escapeHTML(item.description)}</p>` : ""}
                ${renderItemAR(item)}
              </div>
              <div class="item-price-area">
                ${renderPrice(item, categoryKey(item.category), categoryItems)}
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function categoryKey(category) {
      return String(category || "General").trim() || "General";
    }

    function sectionId(name) {
      return `cat-${name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "general"}`;
    }


/* FreeMenu owner-controlled menu ordering */
function getSavedCategoryOrder(rest, items) {
  const names = [...new Set(items.map(item => categoryKey(item.category)))];
  const saved = Array.isArray(rest?.category_order) ? rest.category_order.map(String) : [];
  const rank = new Map(saved.map((x,i)=>[x,i]));
  return names.sort((a,b)=>{
    const ar=rank.has(a)?rank.get(a):999999, br=rank.has(b)?rank.get(b):999999;
    return ar-br || a.localeCompare(b);
  });
}

    function getCategories(items) {
      const categories = [];
      const seen = new Set();
      items.forEach(item => {
        const category = categoryKey(item.category);
        if (!seen.has(category)) {
          seen.add(category);
          categories.push(category);
        }
      });
      return categories;
    }

    function renderCategoryChips() {
      const categories = getSavedCategoryOrder(restaurant, allItems);
      $("category-chips").innerHTML = [
        `<button class="cat-chip ${currentCategory === "all" ? "active" : ""}" data-category="all">
          <span class="cat-chip-icon">${categoryIconSVG("all")}</span>
          <span class="cat-chip-label">All Menu</span>
        </button>`,
        ...categories.map(category => `
          <button class="cat-chip ${currentCategory === category ? "active" : ""}" data-category="${escapeHTML(category)}">
            <span class="cat-chip-icon">${categoryIconSVG(category)}</span>
            <span class="cat-chip-label">${escapeHTML(category)}</span>
          </button>
        `)
      ].join("");
    }

    function getFilteredItems() {
      const q = searchText.trim().toLowerCase();
      return allItems.filter(item => {
        const category = categoryKey(item.category);
        const categoryMatch = currentCategory === "all" || category === currentCategory;
        const haystack = `${item.name || ""} ${item.description || ""} ${category}`.toLowerCase();
        const searchMatch = !q || haystack.includes(q);
        return categoryMatch && searchMatch;
      });
    }

    function renderMenu() {
      const filtered = getFilteredItems();
      const grouped = {};
      filtered.forEach(item => {
        const category = categoryKey(item.category);
        if (!grouped[category]) grouped[category] = [];
        grouped[category].push(item);
      });
      const orderedCategories = getSavedCategoryOrder(restaurant, Object.values(grouped).flat());
      orderedCategories.forEach(category => {
        if (grouped[category]) {
          grouped[category].sort((a,b) => {
            const ao = Number(a.sort_order ?? a.position ?? 999999);
            const bo = Number(b.sort_order ?? b.position ?? 999999);
            return ao - bo || String(a.name||"").localeCompare(String(b.name||""));
          });
        }
      });

      $("summary-line").style.display = "none";
      $("summary-line").innerHTML = "";

      if (!filtered.length) {
        showState("Nothing found", "Try another search or category.");
        return;
      }

      $("menu-sections").innerHTML = orderedCategories.filter(category => grouped[category]).map(category => {
        const items = grouped[category];
        return `
        <section class="category-section" id="${sectionId(category)}" data-category="${escapeHTML(category)}">
          <div class="category-heading categoryHeadWithPrices">
            <div class="categoryTitleWrap">
              <h2 class="category-title">${escapeHTML(category)}</h2>

            </div>
            ${renderCategoryPriceLabels(items)}
          </div>
          <div class="items-list">
            ${items.map(item => renderItem(item, items)).join("")}
          </div>
        </section>
      `}).join("");
    }

    
function categoryIconSVG(category) {
  const key = String(category || "").toLowerCase();

  let path = '<path d="M4 6h16M7 4v4M17 4v4M5 10h14v10H5zM8 14h8M8 17h5"/>';

  if (key === "all" || key.includes("menu")) {
    path = '<path d="M4 5h6v6H4zM14 5h6v6h-6zM4 15h6v6H4zM14 15h6v6h-6z"/>';

  } else if (key.includes("bread") || key.includes("roti") || key.includes("naan")) {
    path = '<path d="M5 14c0-4 3-7 7-7s7 3 7 7c0 3-2 5-7 5s-7-2-7-5Z"/><path d="M8 13c1-2 2-3 4-3s3 1 4 3"/>';
  } else if (key.includes("rice") || key.includes("biryani")) {

  } else if (key.includes("curry") || key.includes("main") || key.includes("gravy")) {
    path = '<path d="M4 11h16c0 5-3.6 8-8 8s-8-3-8-8Z"/><path d="M7 8h10M9 5h6"/>';
  } else if (key.includes("drink") || key.includes("beverage") || key.includes("shake") || key.includes("juice")) {

  } else if (key.includes("dessert") || key.includes("sweet")) {

    path = '<path d="M4 11h16c0 5-3.5 8-8 8s-8-3-8-8Z"/><path d="M7 9c1-3 3-4 5-4s4 1 5 4M12 5V3"/>';
  }

  return `<svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>`;
}

function renderRestaurant(rest) {
      restaurant = rest;
      applyRestaurantTheme(rest);

      const restaurantName = rest.name || "Restaurant";
      $("rest-welcome").textContent = rest.welcome_text || "Welcome to";
      $("rest-name").textContent = rest.tagline || restaurantName;
      $("rest-subtitle").textContent = rest.subtitle_text || "THE TASTE YOU\'LL LOVE";
      const featureDefaults = ["Pure Veg & Non-Veg", "Hygienic Food", "Great Taste"];
      ["rest-feature1","rest-feature2","rest-feature3"].forEach((id, i) => {
        const el = $(id);
        if (!el) return;

        el.textContent = value;
        el.style.display = value ? "inline-flex" : "none";
      });
      $("rest-slogan1").textContent = rest.slogan_1 || "Good Food";
      $("rest-slogan2").textContent = rest.slogan_2 || "Good Mood";
      document.title = `${restaurantName} • Menu`;
      const footerRestaurant = document.getElementById("footer-restaurant-name");

      const brandName = document.getElementById("site-brand-name");
      if (brandName) brandName.textContent = rest.name || "Restaurant";

      const logoUrl = safeUrl(rest.logo_url);
      const brandMark = document.getElementById("site-brand-mark");
      $("logo-container").innerHTML = logoUrl
        ? `<img src="${escapeHTML(logoUrl)}" alt="${escapeHTML(rest.name || "Restaurant")} logo" onerror="this.parentElement.innerHTML=logoFallback()" />`
        : logoFallback();
      if (brandMark) {
        brandMark.innerHTML = logoUrl
          ? `<img src="${escapeHTML(logoUrl)}" alt="" onerror="this.parentElement.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18M5 11v7h14v-7M8 7h8M9 4h6"/></svg>'" />`
          : `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18M5 11v7h14v-7M8 7h8M9 4h6"/></svg>`;
      }
      const contactLink=document.getElementById("site-contact-link");
      if(contactLink && rest.phone){
        const phone=String(rest.phone).replace(/[^+\d]/g,"");

      }

      const coverUrl = safeUrl(rest.banner_url || rest.cover_url || rest.cover_image);
      const dummyBanner = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
          <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#6b1f1a"/><stop offset="0.55" stop-color="#9f5a32"/><stop offset="1" stop-color="#d8a84e"/></linearGradient></defs>
          <rect width="1200" height="520" fill="url(#g)"/>
          <circle cx="960" cy="110" r="160" fill="rgba(255,255,255,.10)"/>
          <circle cx="180" cy="470" r="220" fill="rgba(255,255,255,.08)"/>
          <path d="M0 390 C260 280 420 480 650 350 S1020 260 1200 360 L1200 520 L0 520Z" fill="rgba(0,0,0,.16)"/>
          <text x="600" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="54" font-weight="700" fill="white" opacity=".95">YOUR RESTAURANT</text>
          <text x="600" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="6" fill="white" opacity=".78">FOOD • FLAVOUR • EXPERIENCE</text>
        </svg>`)} `;
      $("rest-cover").src = coverUrl || dummyBanner;
      $("rest-cover").style.display = "block";

      if (rest.phone) {
        const phone = String(rest.phone).replace(/[^+\d]/g, "");
        $("rest-call-btn").href = `tel:${phone}`;
        $("rest-call-btn").style.display = "grid";
        const callText = rest.call_button_text || "Call Restaurant";
        $("rest-call-btn").setAttribute("aria-label", callText);
        $("rest-call-btn").title = callText;
      }

      const whatsappBtn=$("rest-whatsapp-btn");
      if(whatsappBtn){
        if(publicPlanAllowsWhatsApp()){
          const shareUrl=window.location.href;
          const message=`${restaurantName} — Digital Menu\n${shareUrl}`;
          whatsappBtn.href=`https://wa.me/?text=${encodeURIComponent(message)}`;
          whatsappBtn.style.display="grid";
        }else{
          whatsappBtn.style.display="none";
          whatsappBtn.removeAttribute("href");
        }
      }

      const address = rest.address || rest.location || rest.city;
      if (address) {
        $("rest-address").textContent = `• ${address}`;

      const openPill = $("rest-open-pill");
      if(openPill){
        openPill.textContent = isOpen ? "● Open Now" : "● Closed";
        openPill.style.background = isOpen ? "#12964e" : "#b4232e";
      }
      const fmtTime = (v)=>{
        if(!v) return "";
        const parts=String(v).split(":");
        let h=Number(parts[0]),m=Number(parts[1]||0),suffix=h>=12?"PM":"AM";
        h=h%12||12;
        return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")} ${suffix}`;
      };
      const hrs=`${fmtTime(rest.opening_time)||"11:00 AM"} – ${fmtTime(rest.closing_time)||"11:00 PM"}`;
      if($("rest-hours")) $("rest-hours").textContent=hrs;
      if($("svc-dine")) $("svc-dine").style.display=rest.dine_in===false?"none":"inline-flex";
      if($("svc-take")) $("svc-take").style.display=rest.takeaway===false?"none":"inline-flex";
      if($("svc-delivery")) $("svc-delivery").style.display=rest.home_delivery===false?"none":"inline-flex";

    async function loadPublicMenu() {
      showLoading();

      try {
        const params = new URLSearchParams(window.location.search);
        let slug = (window.__FM_ROUTE_SLUG || params.get("r") || "").trim().toLowerCase();

        // Clean-URL compatibility: also accept /menu/{slug} when the host
        // does not pass the rewrite query through to menu.html.
        if (!slug) {
          const pathParts = window.location.pathname.split("/").filter(Boolean);
          const menuIndex = pathParts.findIndex(part => part.toLowerCase() === "menu");
          if (menuIndex >= 0 && pathParts[menuIndex + 1]) {
            slug = decodeURIComponent(pathParts[menuIndex + 1]).trim().toLowerCase();
          }
        }

        let query = supabaseClient.from("restaurants").select("*");
        if (slug) query = query.eq("slug", slug);

        const { data: restaurants, error: restError } = await query.limit(1);
        if (restError) throw restError;

        if (!restaurants || !restaurants.length) {
          $("rest-name").textContent = "Restaurant Not Found";
          $("category-chips").innerHTML = "";
          $("summary-line").style.display = "none";
          showState("Restaurant not found", "Please check the menu link and try again.");
          return;
        }

        const rest = restaurants[0];

        // Read the currently assigned plan, but NEVER redirect the public menu
        // to a template that may not exist. The core menu engine must remain
        // usable for every active restaurant/plan.
        // Resolve the assigned plan. plan_id is the source of truth; the legacy
        // restaurants.plan value is supported only as a backward-compatible fallback.
        window.fmPublicPlan = null;
        if (rest.plan_id) {
          const { data: assignedPlan } = await supabaseClient
            .from("plans")
            .select("id,name,slug,plan_type,qr_stickers_max,signature_3d_dishes_max,features,is_active")
            .eq("id", rest.plan_id)
            .maybeSingle();
          if (assignedPlan && assignedPlan.is_active !== false) {
            window.fmPublicPlan = assignedPlan;
            rest.public_plan = assignedPlan;
          }
        }

        if (!window.fmPublicPlan) {
          const legacy = String(rest.plan || "").trim().toLowerCase();
          const legacyPlanMap = {
            free: "free-starter",
            starter: "free-starter",
            "free-starter": "free-starter",
            growth: "growth-photos",
            premium: "growth-photos",
            "growth-photos": "growth-photos",
            signature: "signature-3d",
            "signature-3d": "signature-3d",
            signature_3d: "signature-3d",
            "full-3d": "full-3d-experience",
            "full_3d": "full-3d-experience",
            "full-3d-experience": "full-3d-experience"
          };
          const legacySlug = legacyPlanMap[legacy];
          if (legacySlug) {
            const { data: legacyPlan } = await supabaseClient
              .from("plans")
              .select("id,name,slug,plan_type,qr_stickers_max,signature_3d_dishes_max,features,is_active")
              .eq("slug", legacySlug)
              .maybeSingle();
            if (legacyPlan && legacyPlan.is_active !== false) {
              window.fmPublicPlan = legacyPlan;
              rest.public_plan = legacyPlan;
            }
          }
        }

        /* =========================================================
           PUBLIC MENU TEMPLATE ROUTING
           Resolve the plan first (including legacy fallback), then
           route only when the assigned plan needs another template.
           Free Starter intentionally stays on menu.html.
        ========================================================== */
        const resolvedPlan = window.fmPublicPlan;
        const resolvedPlanKey = `${resolvedPlan?.slug || ""} ${resolvedPlan?.name || ""}`
          .toLowerCase()
          .trim();

        const isSignature3D =
          resolvedPlanKey.includes("signature 3d") ||
          resolvedPlanKey.includes("signature-3d") ||
          resolvedPlanKey.includes("signature_3d") ||
          (resolvedPlanKey.includes("signature") && resolvedPlanKey.includes("3d"));

        const isFull3D =
          resolvedPlanKey.includes("full 3d") ||
          resolvedPlanKey.includes("full-3d") ||
          resolvedPlanKey.includes("full_3d") ||
          (resolvedPlanKey.includes("full") && resolvedPlanKey.includes("3d"));

        const isGrowthPhotos =
          resolvedPlanKey.includes("growth") ||
          resolvedPlanKey.includes("growth-photos") ||
          resolvedPlanKey.includes("growth photos") ||
          resolvedPlanKey.includes("photo_menu_v1");

        const isCustomMenu = rest.custom_plan_enabled === true;

        let targetFile = "menu.html";
        if (isSignature3D || isFull3D || isCustomMenu) {
          targetFile = "signaturemenu.html";
        } else if (isGrowthPhotos) {
          targetFile = "menugrowth.html";
        }

        const currentFile = window.location.pathname.split("/").pop().toLowerCase();

        // IMPORTANT:
        // Free Starter is the default menu. When /menu/:slug is rewritten
        // internally to menu.html, the browser can still report the clean
        // /menu/:slug pathname. Never redirect Free Starter; otherwise the
        // clean rewrite + client routing can create a reload loop.
        if (targetFile !== "menu.html" && currentFile !== targetFile && !window.__FM_ROUTED_TEMPLATE) {
          const targetUrl = new URL(`/${targetFile}`, window.location.origin);
          targetUrl.searchParams.set("r", rest.slug || rest.id);
          window.location.replace(targetUrl.href);
          return;
        }

        // Three public template targets: Free, Growth, and one shared 3D template.
        // Signature 3D and Full 3D NEVER use separate public templates.
        const planSlug = publicPlanSlug();
        const template = publicPlanTier() === "free-starter"
          ? "free"
          : publicPlanTier() === "growth-photos"
            ? "growth"
            : "3d";
        window.fmMenuSettings = {
          template,
          templateKey: template,
          planSlug,
          planName: window.fmPublicPlan?.name || "Free Starter",
          qrLimit: Number(window.fmPublicPlan?.qr_stickers_max || 0),
          foodTags: publicPlanAllowsTags(),
          whatsapp: publicPlanAllowsWhatsApp(),
          arLimit: publicPlanArLimit(),
          shared3dTemplate: template === "3d",
          plan: window.fmPublicPlan || null
        };
        document.documentElement.dataset.menuTemplate = template;
        document.documentElement.dataset.menuPlan = planSlug;

        renderRestaurant(rest);

        const { data: items, error: itemsError } = await supabaseClient
          .from("menu_items")
          .select("*")
          .eq("restaurant_id", rest.id);

        if (itemsError) throw itemsError;

        allItems = Array.isArray(items) ? items : [];

        // Optional sorting if you later add sort_order fields.
        allItems.sort((a, b) => {
          const aOrder = Number(a.sort_order ?? a.position ?? 999999);
          const bOrder = Number(b.sort_order ?? b.position ?? 999999);
          return aOrder - bOrder;
        });

        // Enforce the assigned plan's public AR allowance without changing menu data.
        const arLimit=publicPlanArLimit();
        window.fmPublicArIds=new Set(
          arLimit>0
            ? allItems.filter(item=>item && (item.ar_model_url || item.ar_usdz_url) && item.ar_enabled !== false).slice(0,arLimit).map(item=>String(item.id))
            : []
        );

        if (!allItems.length) {
          $("category-chips").innerHTML = "";
          $("summary-line").style.display = "none";
          showState("Menu is being prepared", "No menu items have been added yet.");
          return;
        }

        renderCategoryChips();
        renderMenu();
      } catch (error) {
        console.error("Menu load error:", error);
        $("rest-name").textContent = "Menu Unavailable";
        $("category-chips").innerHTML = "";
        $("summary-line").style.display = "none";
        showState("Unable to load menu", "Please refresh the page or try again shortly.");
      }
    }

    $("menu-search").addEventListener("input", (event) => {
      searchText = event.target.value || "";
      renderMenu();
    });

    $("category-chips").addEventListener("click", (event) => {
      const btn = event.target.closest(".cat-chip");
      if (!btn) return;

      currentCategory = btn.dataset.category || "all";
      renderCategoryChips();
      renderMenu();

      window.scrollTo({
        top: document.querySelector(".sticky-panel").offsetTop,
        behavior: "smooth"
      });
    });

    window.addEventListener("load", loadPublicMenu);
  </script>

<script id="freemenu-price-column-count">
(function(){
  function syncPriceColumns(){
    document.querySelectorAll(".category-section").forEach(function(section){
      const labels = section.querySelector(".categoryPriceSwitch.fixed-price-columns");
      if (!labels) return;
      const count = labels.querySelectorAll(".price-size-label").length || 1;
      /* Keep the parent header/item grid in sync with the child price grid. */
      section.style.setProperty("--price-cols", count);
      labels.style.setProperty("--price-cols", count);
      section.querySelectorAll(".single-price-area.fixed-price-columns").forEach(function(row){
        row.style.setProperty("--price-cols", count);
      });
    });
  }
  document.addEventListener("DOMContentLoaded", syncPriceColumns);
  const observer = new MutationObserver(syncPriceColumns);
  observer.observe(document.documentElement, {childList:true, subtree:true});
})();
</script>
