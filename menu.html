<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7b1e16" />
  <title>Digital Menu</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --primary: #7b1e16;
      --primary-dark: #5a140f;
      --primary-soft: #fff4e8;
      --accent: #c8943e;
      --bg: #f5eee5;
      --surface: #fffaf2;
      --surface-2: #f7eee4;
      --text: #4a281a;
      --muted: #7d6558;
      --border: #d9c39a;
      --veg: #16a34a;
      --nonveg: #dc2626;
      --egg: #d97706;
      --danger: #dc2626;
      --radius: 18px;
      --shadow: 0 10px 30px rgba(15, 23, 42, .06);
      --font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-family);
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    img { display: block; max-width: 100%; }

    .app-shell {
      width: min(100%, 820px);
      margin: 0 auto;
    }

    /* HERO */
    .hero {
      position: relative;
      min-height: 190px;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--primary) 94%, black 6%), var(--primary-dark));
      overflow: hidden;
      color: #fff;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      pointer-events: none;
    }
    .hero::before { width: 190px; height: 190px; right: -70px; top: -65px; }
    .hero::after { width: 120px; height: 120px; left: -40px; bottom: -55px; }

    .hero-cover {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .22;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.44));
    }

    .hero-content {
      position: relative;
      z-index: 2;
      min-height: 190px;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      padding: 22px 16px 18px;
    }

    .logo-wrap {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      flex: 0 0 auto;
      background: rgba(255,255,255,.96);
      border: 3px solid rgba(255,255,255,.65);
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--primary);
    }

    .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .logo-fallback svg { width: 30px; height: 30px; }

    .hero-info { min-width: 0; flex: 1; }
    .restaurant-name {
      margin: 0;
      font-size: clamp(22px, 5vw, 30px);
      line-height: 1.1;
      font-weight: 850;
      letter-spacing: -.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,.2);
    }

    .restaurant-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      margin-top: 8px;
      font-size: 12.5px;
      color: rgba(255,255,255,.9);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      backdrop-filter: blur(8px);
      font-weight: 700;
      white-space: nowrap;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
    .status-badge.closed .status-dot { background: #f87171; }

    .hero-action {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 14px;
      background: rgba(255,255,255,.16);
      color: #fff;
      display: none;
      place-items: center;
      text-decoration: none;
      backdrop-filter: blur(10px);
    }

    /* STICKY CONTROL AREA */
    .sticky-panel {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      padding: 10px 12px 8px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(15,23,42,.04);
      overflow: hidden;
    }

    .search-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--muted);
      flex: 0 0 auto;
    }

    #menu-search {
      width: 100%;
      height: 44px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 0 12px 0 0;
      font-size: 14px;
    }
    #menu-search::placeholder { color: #9ca3af; }

    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 9px;
      scrollbar-width: none;
      overscroll-behavior-inline: contain;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      min-height: 34px;
      padding: 7px 13px;
      border-radius: 999px;
      white-space: nowrap;
      font-size: 12.5px;
      font-weight: 750;
      cursor: pointer;
      transition: .18s ease;
    }
    .cat-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 5px 14px color-mix(in srgb, var(--primary) 22%, transparent);
    }

    /* CONTENT */
    .menu-wrap { padding: 14px 12px 30px; }

    .summary-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 2px 2px 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .category-section {
      scroll-margin-top: 110px;
      margin-bottom: 20px;
    }

    .category-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 2px 9px;
    }

    .category-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 850;
      letter-spacing: -.2px;
    }
    .item-count {
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .items-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .menu-item {
      position: relative;
      display: flex;
      gap: 13px;
      padding: 14px;
      border-bottom: 1px solid var(--border);
      transition: background .2s ease;
    }
    .menu-item:last-child { border-bottom: 0; }
    .menu-item:active { background: var(--surface-2); }
    .menu-item.unavailable { opacity: .58; }

    .item-content { flex: 1; min-width: 0; }
    .item-main-row { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-topline { display: flex; align-items: flex-start; gap: 7px; }

    /* Menu-style right-aligned portion columns */
    .item-price-area {
      flex: 0 0 158px;
      width: 158px;
      align-self: flex-start;
      margin-left: auto;
    }
    .price-header {
      display: grid;
      grid-template-columns: repeat(3, 45px);
      gap: 5px;
      justify-content: end;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 10px;
      line-height: 1;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .45px;
      text-align: center;
    }
    .price-header.single { grid-template-columns: 58px; }
    .portion-prices {
      display: grid;
      grid-template-columns: repeat(3, 45px);
      gap: 5px;
      justify-content: end;
      align-items: center;
    }
    .portion-price {
      width: 45px;
      min-width: 45px;
      padding: 2px 0;
      text-align: center;
      border: 0;
      background: transparent;
      border-radius: 0;
      color: var(--primary);
      font-weight: 850;
    }
    .portion-price.empty {
      background: transparent;
      border: 0;
      color: #cbbdaf;
    }
    .portion-price .label { display: none; }
    .portion-price .amount {
      margin-top: 0;
      font-size: 13px;
      line-height: 1.25;
      white-space: nowrap;
    }
    .single-price-area { display: flex; justify-content: flex-end; }
    .single-price {
      margin-top: 0;
      width: 58px;
      padding: 2px 0;
      border: 0;
      background: transparent;
      border-radius: 0;
      color: var(--primary);
      font-size: 13px;
      font-weight: 850;
      text-align: center;
      white-space: nowrap;
    }

    .food-symbol {
      width: 15px;
      height: 15px;
      margin-top: 2px;
      border-radius: 3px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }
    .food-symbol::after { content: ""; width: 7px; height: 7px; border-radius: 50%; }
    .food-symbol.veg { border: 1.6px solid var(--veg); }
    .food-symbol.veg::after { background: var(--veg); }
    .food-symbol.nonveg { border: 1.6px solid var(--nonveg); }
    .food-symbol.nonveg::after { background: var(--nonveg); border-radius: 1px; transform: rotate(45deg); width: 6px; height: 6px; }
    .food-symbol.egg { border: 1.6px solid var(--egg); }
    .food-symbol.egg::after { background: var(--egg); }

    .item-name {
      margin: 0;
      font-size: 15.5px;
      line-height: 1.25;
      font-weight: 790;
      color: var(--text);
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 7px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 10px;
      line-height: 1;
      font-weight: 800;
      background: var(--primary-soft);
      color: var(--primary-dark);
    }
    .tag.out { background: #fef2f2; color: #b91c1c; }
    .tag.hot { background: #fff7ed; color: #c2410c; }

    .item-desc {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .item-image-wrap {
      position: relative;
      width: 92px;
      height: 92px;
      flex: 0 0 92px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .item-image { width: 100%; height: 100%; object-fit: cover; }
    .img-placeholder {
      width: 100%; height: 100%;
      display: grid; place-items: center;
      color: #9ca3af;
      background: linear-gradient(135deg, #f8fafc, #f1f5f9);
    }
    .img-placeholder svg { width: 26px; height: 26px; }

    /* Warm printed-menu card styling */
    .category-section { margin-bottom: 18px; }
    .category-heading {
      margin: 0;
      padding: 11px 14px;
      background: var(--primary);
      border-radius: 15px 15px 0 0;
      color: #fffaf2;
    }
    .category-title {
      color: #fffaf2;
      font-size: 17px;
      text-transform: uppercase;
      letter-spacing: .35px;
    }
    .item-count { color: rgba(255,250,242,.78); }
    .items-list {
      border: 1px solid var(--border);
      border-top: 0;
      border-radius: 0 0 15px 15px;
      background: var(--surface);
      box-shadow: 0 4px 12px rgba(90,20,15,.07);
    }
    .menu-item {
      padding: 11px 13px;
      border-bottom: 1px dashed #e2cda9;
      background: var(--surface);
    }
    .menu-item:last-child { border-bottom: 0; }
    .item-name { color: #6b174b; font-size: 14.5px; }
    .item-desc { color: #8a7668; }
    .price-header { color: #5a321e; }
    .summary-line { color: var(--muted); }

    @media (max-width: 560px) {
      .menu-item { padding: 10px 10px; gap: 8px; }
      .item-main-row { gap: 6px; }
      .item-price-area { flex-basis: 151px; width: 151px; }
      .price-header, .portion-prices { grid-template-columns: repeat(3, 43px); gap: 4px; }
      .portion-price { width: 43px; min-width: 43px; }
      .price-header.single { grid-template-columns: 55px; }
      .single-price { width: 55px; }
      .item-name { font-size: 14px; }
      .portion-price .amount, .single-price { font-size: 12px; }
    }

    /* STATES */
    .state-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 34px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      color: var(--muted);
    }
    .state-card strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 5px; }

    .skeleton {
      overflow: hidden;
      position: relative;
      background: #e9edf2;
      border-radius: 10px;
    }
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
      animation: shimmer 1.25s infinite;
    }
    @keyframes shimmer { 100% { transform: translateX(100%); } }

    .loading-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .loading-row { display: flex; gap: 12px; padding: 14px; border-bottom: 1px solid var(--border); }
    .loading-row:last-child { border-bottom: 0; }
    .sk-line { height: 12px; margin-bottom: 8px; }
    .sk-title { width: 58%; height: 15px; }
    .sk-text { width: 85%; }
    .sk-price { width: 35%; }
    .sk-img { width: 90px; height: 90px; flex: 0 0 90px; }

    .footer-note {
      text-align: center;
      color: #9ca3af;
      font-size: 11px;
      padding: 8px 16px 0;
    }

    @media (min-width: 640px) {
      body { padding-top: 18px; }
      .app-shell {
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(15,23,42,.08);
      }
      .hero, .hero-content { min-height: 220px; }
      .hero-content { padding: 28px 24px 22px; }
      .sticky-panel { padding-inline: 18px; }
      .menu-wrap { padding-inline: 18px; }
      .menu-item { padding: 16px; }
      .item-image-wrap { width: 110px; height: 100px; flex-basis: 110px; }
    }
  
    .hero-welcome{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:18px;color:var(--accent,#d8ad62);margin-bottom:2px}

    .hero-subtitle{font-size:12px;font-weight:800;letter-spacing:2px;margin-top:7px;color:rgba(255,255,255,.94)}

    .hero-feature{display:inline-flex;align-items:center;gap:5px}
    .hero-slogans{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:19px;line-height:.98;margin-top:18px;color:#fff}
    .hero-slogans div:last-child{padding-left:45px;margin-top:3px}

    .service-time{font-weight:700}
    .services{display:flex;align-items:center;gap:15px;flex-wrap:wrap;font-weight:700}
    .service{display:inline-flex;align-items:center;gap:5px}
    @media(max-width:640px){
      .hero-features{gap:7px 10px}.hero-slogans{font-size:17px}
      .service-strip{align-items:flex-start;flex-direction:column}.services{gap:10px}
    }

    .footer-note{padding:12px 16px 22px;font-size:10px}

      .hero{min-height:300px}
      .hero-content{min-height:300px;padding:20px 14px 18px}
      .logo-wrap{width:70px;height:70px;border-radius:19px}
      .service-strip{margin-top:-12px}
      .menu-wrap{padding-inline:10px}
      .item-price-area{flex-basis:144px;width:144px}

.site-brand-mark img{display:none !important}
.site-nav-links{gap:6px !important}
.site-nav-link{color:#d8deea !important}
.site-nav-link:hover{background:rgba(255,255,255,.08) !important;color:#fff !important}
.hero{
  background:linear-gradient(135deg,#171a27,#111522) !important;
  min-height:350px !important;border-radius:26px 26px 20px 20px !important;
  box-shadow:0 18px 50px rgba(0,0,0,.34) !important;
  overflow:hidden;
}
.hero-cover{display:block !important;opacity:.40 !important;filter:saturate(1.35) contrast(1.08) !important}
.hero-overlay{
  display:block !important;
  background:
    linear-gradient(180deg,rgba(5,7,13,.12),rgba(5,7,13,.38) 45%,rgba(5,7,13,.94) 100%),
    linear-gradient(135deg,rgba(255,28,90,.20),rgba(0,208,255,.12) 55%,rgba(124,92,255,.18)) !important;
}
.hero-content{min-height:350px !important;padding:26px 30px 24px !important}
.logo-wrap{
  width:96px !important;height:96px !important;border-radius:24px !important;
  border:3px solid rgba(255,255,255,.88) !important;
  box-shadow:0 16px 36px rgba(0,0,0,.40),0 0 28px rgba(255,42,92,.20) !important;
}
.hero-welcome{color:#ffd166 !important}
.hero-tagline{color:#fff !important;text-shadow:0 4px 24px rgba(0,0,0,.55) !important}
.hero-subtitle{color:#dbe7ff !important}
.hero-feature{
  color:#fff !important;background:linear-gradient(135deg,rgba(255,42,92,.20),rgba(0,214,255,.14)) !important;
  border-color:rgba(255,255,255,.18) !important;
}
.hero-slogans{color:#fff !important}
.status-badge{background:rgba(255,255,255,.12) !important;border:1px solid rgba(255,255,255,.14)}
.service-strip{
  background:rgba(18,23,34,.94) !important;color:var(--fm-text) !important;
  border:1px solid var(--fm-border) !important;
  box-shadow:0 14px 34px rgba(0,0,0,.28) !important;
}
.service{background:rgba(255,255,255,.06) !important;color:#e8edf6 !important;border:1px solid rgba(255,255,255,.07)}
.service-time{color:#c9d2e3 !important}
.sticky-panel{
  background:rgba(10,13,21,.90) !important;
  border:1px solid var(--fm-border) !important;
  box-shadow:0 12px 32px rgba(0,0,0,.25) !important;
}
.search-wrap{
  background:#151b28 !important;border:1px solid rgba(255,255,255,.12) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 22px rgba(0,0,0,.18) !important;
}
.search-icon{color:#ff4f87 !important}
#menu-search{color:#fff !important}
#menu-search::placeholder{color:#7f8ba0 !important}
.cat-chip{
  background:#141a26 !important;color:#bfc8d8 !important;border-color:rgba(255,255,255,.11) !important;
}
.cat-chip.active{
  background:linear-gradient(135deg,#ff2f67,#7c5cff) !important;border-color:transparent !important;color:#fff !important;
  box-shadow:0 8px 22px rgba(255,47,103,.24) !important;
}
.menu-wrap{
  max-width:820px !important;margin-left:0 !important;margin-right:auto !important;
  padding:20px 4px 40px !important;
}
.summary-line{color:#9eabc0 !important}
.category-heading{
  background:linear-gradient(90deg,rgba(255,47,103,.16),rgba(124,92,255,.11),transparent) !important;
  border:1px solid rgba(255,255,255,.08) !important;border-bottom:0 !important;
  border-radius:18px 18px 0 0 !important;
  box-shadow:none !important;
}
.category-title{color:#fff !important}
.item-count{color:#9eabc0 !important}
.category-heading::after{background:rgba(0,214,255,.12) !important}
.items-list{
  background:#10151f !important;border:1px solid rgba(255,255,255,.08) !important;
  border-top:0 !important;box-shadow:0 14px 30px rgba(0,0,0,.24) !important;
}
.menu-item,.menu-item + .menu-item{
  background:linear-gradient(90deg,rgba(18,23,34,.98),rgba(14,19,29,.98)) !important;

      // These fields are OPTIONAL. If your table does not have them,
      // the fallback colors below will be used automatically.
      const primary = cssColor(rest.primary_color || rest.theme_primary, "#0f766e");
      const primaryDark = cssColor(rest.primary_dark || rest.theme_primary_dark, "#115e59");
      const bg = cssColor(rest.background_color || rest.theme_background, "#f6f7f9");
      const surface = cssColor(rest.card_color || rest.theme_card, "#ffffff");
      const text = cssColor(rest.text_color || rest.theme_text, "#111827");

      root.setProperty("--primary", primary);
      root.setProperty("--primary-dark", primaryDark);
      root.setProperty("--bg", bg);
      root.setProperty("--surface", surface);
      root.setProperty("--text", text);

      const radius = Number(rest.card_radius || rest.theme_radius);
      if (Number.isFinite(radius) && radius >= 0 && radius <= 40) {
        root.setProperty("--radius", `${radius}px`);
      }

      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", primary);
    }

    function showLoading() {
      $("menu-sections").innerHTML = `
        <div class="loading-list" aria-label="Loading menu">
          ${[1,2,3,4].map(() => `
            <div class="loading-row">
              <div style="flex:1; padding-top:4px;">
                <div class="skeleton sk-title sk-line"></div>
                <div class="skeleton sk-text sk-line"></div>
                <div class="skeleton sk-price sk-line"></div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function showState(title, message) {
      $("menu-sections").innerHTML = `
        <div class="state-card">
          <strong>${escapeHTML(title)}</strong>
          <span>${escapeHTML(message)}</span>
        </div>
      `;
    }

    function logoFallback() {
      return `
        <div class="logo-fallback" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 11h18M5 11v7h14v-7M8 7h8M9 4h6"/>
          </svg>
        </div>
      `;
    }


    function getItemType(item) {
      if (String(item.item_type || "").toLowerCase() === "egg") return "egg";
      if (String(item.item_type || "").toLowerCase() === "nonveg" || item.is_veg === false) return "nonveg";
      return "veg";
    }

    function isUnavailable(item) {
      return item.is_available === false || item.available === false || item.status === "unavailable" || item.status === "out_of_stock";
    }

    function priceValue(item, key) {
      const value = item?.[key];
      return value !== null && value !== undefined && value !== "" ? value : null;
    }

    function getPriceFlags(items) {
      const flags = [];
      if (items.some(item => priceValue(item, "price_quarter") !== null)) flags.push("quarter");
      if (items.some(item => priceValue(item, "price_half") !== null)) flags.push("half");
      if (items.some(item => priceValue(item, "price_full") !== null || priceValue(item, "price") !== null)) flags.push("full");
      return flags;
    }

    function renderPrice(item, priceFlags) {
      if (!priceFlags.length) return "";
      const slotFlags = ["quarter", "half", "full"];
      const cells = slotFlags.map(flag => {
        if (!priceFlags.includes(flag)) {
          return `<div class="price-cell price-slot-empty" aria-hidden="true"></div>`;
        }
        const key = flag === "quarter" ? "price_quarter" : flag === "half" ? "price_half" : "price_full";
        const fallback = flag === "full" ? "price" : null;
        const value = priceValue(item, key);
        const display = value === null && fallback ? priceValue(item, fallback) : value;
        return `<div class="price-cell ${display === null ? "empty" : ""}">
          <span class="price-label">${flag === "quarter" ? "Quarter" : flag === "half" ? "Half" : "Full"}</span>
          <span class="price-amount">${display === null ? "—" : `₹${escapeHTML(display)}`}</span>
        </div>`;
      }).join("");
      return `<div class="item-price-area" style="--price-cols:3">${cells}</div>`;
    }

    function renderTags(item) {
      const tags = [];
      if (item.is_bestseller === true || item.bestseller === true) tags.push(`<span class="tag hot">★ Bestseller</span>`);
      if (item.is_recommended === true || item.recommended === true) tags.push(`<span class="tag">Recommended</span>`);
      if (item.is_spicy === true || item.spicy === true) tags.push(`<span class="tag hot">🌶 Spicy</span>`);
      if (isUnavailable(item)) tags.push(`<span class="tag out">Unavailable</span>`);
      return tags.length ? `<div class="item-tags">${tags.join("")}</div>` : "";
    }

    function renderItem(item, priceFlags) {
      const type = getItemType(item);
      const unavailable = isUnavailable(item);

      return `
        <article class="menu-item ${unavailable ? "unavailable" : ""}" data-name="${escapeHTML((item.name || "").toLowerCase())}">
          <div class="item-content">
            <div class="item-main-row">
              <div class="item-info">
                <div class="item-topline">
                  <span class="food-symbol ${type}" aria-label="${type}"></span>
                  <h3 class="item-name">${escapeHTML(item.name || "Unnamed item")}</h3>
                </div>
                ${renderTags(item)}
                ${item.description ? `<p class="item-desc">${escapeHTML(item.description)}</p>` : ""}
              </div>
              ${renderPrice(item, priceFlags)}
            </div>
          </div>
        </article>
      `;
    }

    function categoryIconSVG(category) {
      const c = String(category || "").toLowerCase();
      if (/dessert|ice|sweet|cake|kulfi|cream/.test(c)) {
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l-1 5H8L7 4Z"/><path d="M9 9v7a3 3 0 0 0 6 0V9"/><path d="M8 20h8"/></svg>';
      }
      if (/chinese|noodle|starter|momo/.test(c)) {
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14"/><path d="M7 8v5a5 5 0 0 0 10 0V8"/><path d="M9 4c1 2 2 2 3 0M13 4c1 2 2 2 3 0"/><path d="M8 20h8"/></svg>';
      }
      if (/dosa|south|idli|uttapam|roast|fusion/.test(c)) {
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15c2-6 14-6 16 0-2 3-14 3-16 0Z"/><path d="M6 15c2 1 10 1 12 0"/><path d="M12 6v3M9 7l1 2M15 7l-1 2"/></svg>';
      }
      if (/pizza|burger|sandwich|fast/.test(c)) {
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16"/><path d="M6 11c1-5 11-5 12 0"/><path d="M5 15h14"/><path d="M7 18h10"/></svg>';
      }
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14v11H5z"/><path d="M8 7V5h8v2M9 11h6M9 14h4"/></svg>';
    }

    function categoryKey(category) {
      return String(category || "General").trim() || "General";
    }

    function sectionId(name) {
      return `cat-${name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "general"}`;
    }


/* FreeMenu owner-controlled menu ordering */
function getSavedCategoryOrder(rest, items) {
  const names = [...new Set(items.map(item => categoryKey(item.category)))];
  const saved = Array.isArray(rest?.category_order) ? rest.category_order.map(String) : [];
  const rank = new Map(saved.map((x,i)=>[x,i]));
  return names.sort((a,b)=>{
    const ar=rank.has(a)?rank.get(a):999999, br=rank.has(b)?rank.get(b):999999;
    return ar-br || a.localeCompare(b);
  });
}

    function getCategories(items) {
      const categories = [];
      const seen = new Set();
      items.forEach(item => {
        const category = categoryKey(item.category);
        if (!seen.has(category)) {
          seen.add(category);
          categories.push(category);
        }
      });
      return categories;
    }

    function renderCategoryChips() {
      const categories = getSavedCategoryOrder(restaurant, allItems);
      $("category-chips").innerHTML = [
        `<button class="cat-chip ${currentCategory === "all" ? "active" : ""}" data-category="all">
          <span class="category-chip-icon">${categoryIconSVG("all")}</span>
          <span class="category-chip-text">All Menu</span>
        </button>`,
        ...categories.map(category => `
          <button class="cat-chip ${currentCategory === category ? "active" : ""}" data-category="${escapeHTML(category)}">
            <span class="category-chip-icon">${categoryIconSVG(category)}</span>
            <span class="category-chip-text">${escapeHTML(category)}</span>
          </button>
        `)
      ].join("");
    }

    function getFilteredItems() {
      const q = searchText.trim().toLowerCase();
      return allItems.filter(item => {
        const category = categoryKey(item.category);
        const type = getItemType(item);
        const categoryMatch = currentCategory === "all" || category === currentCategory;
        const foodMatch = currentFoodType === "all" || type === currentFoodType;
        const haystack = `${item.name || ""} ${item.description || ""} ${category}`.toLowerCase();
        const searchMatch = !q || haystack.includes(q);
        return categoryMatch && foodMatch && searchMatch;
      });
    }

    function renderFoodFilters() {
      const counts = { all: allItems.length, veg: 0, nonveg: 0 };
      allItems.forEach(item => {
        const type = getItemType(item);
        if (type === "veg") counts.veg++;
        if (type === "nonveg") counts.nonveg++;
      });
      $("food-filters").innerHTML = [
        `<button class="food-filter ${currentFoodType === "all" ? "active" : ""}" data-food-type="all" type="button">All <span>${counts.all}</span></button>`,
        `<button class="food-filter veg-filter ${currentFoodType === "veg" ? "active" : ""}" data-food-type="veg" type="button"><span class="filter-dot veg"></span> Veg <span>${counts.veg}</span></button>`,
        `<button class="food-filter nonveg-filter ${currentFoodType === "nonveg" ? "active" : ""}" data-food-type="nonveg" type="button"><span class="filter-dot nonveg"></span> Non-Veg <span>${counts.nonveg}</span></button>`
      ].join("");
    }

    function renderMenu() {
      const filtered = getFilteredItems();
      const grouped = {};
      filtered.forEach(item => {
        const category = categoryKey(item.category);
        if (!grouped[category]) grouped[category] = [];
        grouped[category].push(item);
      });
      const orderedCategories = getSavedCategoryOrder(restaurant, Object.values(grouped).flat());
      orderedCategories.forEach(category => {
        if (grouped[category]) {
          grouped[category].sort((a,b) => {
            const ao = Number(a.sort_order ?? a.position ?? 999999);
            const bo = Number(b.sort_order ?? b.position ?? 999999);
            return ao - bo || String(a.name||"").localeCompare(String(b.name||""));
          });
        }
      });

      $("summary-line").style.display = "flex";
      $("summary-line").innerHTML = `
        <span>${filtered.length} item${filtered.length === 1 ? "" : "s"}</span>
        ${searchText ? `<span>Search: “${escapeHTML(searchText)}”</span>` : ""}
      `;

      if (!filtered.length) {
        showState("Nothing found", "Try another search or category.");
        return;
      }

      $("menu-sections").innerHTML = orderedCategories.filter(category => grouped[category]).map(category => {
        const items = grouped[category];
        const priceFlags = getPriceFlags(items);
        const priceHeader = priceFlags.length
          ? `<div class="items-price-header" style="--price-cols:3">
              <span class="${priceFlags.includes("quarter") ? "" : "header-empty"}">${priceFlags.includes("quarter") ? "Quarter" : ""}</span>
              <span class="${priceFlags.includes("half") ? "" : "header-empty"}">${priceFlags.includes("half") ? "Half" : ""}</span>
              <span class="${priceFlags.includes("full") ? "" : "header-empty"}">${priceFlags.includes("full") ? "Full" : ""}</span>
             </div>`
          : "";
        return `
        <section class="category-section" id="${sectionId(category)}" data-category="${escapeHTML(category)}">
          <div class="category-heading">
            <div style="display:flex;align-items:center;gap:9px;min-width:0">
              <h2 class="category-title">${escapeHTML(category)}</h2>
              <span class="item-count">${items.length} item${items.length === 1 ? "" : "s"}</span>
            </div>
          </div>
          <div class="items-list">
            ${priceHeader}
            ${items.map(item => renderItem(item, priceFlags)).join("")}
          </div>
        </section>
      `}).join("");
    }

    function renderRestaurant(rest) {
      restaurant = rest;
      applyRestaurantTheme(rest);

      const restaurantName = rest.name || "Restaurant";
      $("rest-welcome").textContent = rest.welcome_text || "Welcome to";
      $("rest-name").textContent = rest.tagline || restaurantName;
      $("rest-subtitle").textContent = rest.subtitle_text || "THE TASTE YOU\'LL LOVE";
      const featureDefaults = ["Pure Veg & Non-Veg", "Hygienic Food", "Great Taste"];
      ["rest-feature1","rest-feature2","rest-feature3"].forEach((id, i) => {
        const el = $(id);
        if (!el) return;
        const value = rest[`feature_${i+1}`] || featureDefaults[i];
        el.textContent = value;
        el.style.display = value ? "inline-flex" : "none";
      });
      $("rest-slogan1").textContent = rest.slogan_1 || "Good Food";
      $("rest-slogan2").textContent = rest.slogan_2 || "Good Mood";
      document.title = `${restaurantName} • Menu`;

      const logoUrl = safeUrl(rest.logo_url);
      const brandMark = document.getElementById("site-brand-mark");
      $("logo-container").innerHTML = logoUrl
        ? `<img src="${escapeHTML(logoUrl)}" alt="${escapeHTML(rest.name || "Restaurant")} logo" onerror="this.parentElement.innerHTML=logoFallback()" />`
        : logoFallback();
      if (brandMark) {
        brandMark.innerHTML = logoUrl
          ? `<img src="${escapeHTML(logoUrl)}" alt="" onerror="this.parentElement.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18M5 11v7h14v-7M8 7h8M9 4h6"/></svg>'" />`
          : `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18M5 11v7h14v-7M8 7h8M9 4h6"/></svg>`;
      }
      const contactLink=document.getElementById("site-contact-link");
      if(contactLink && rest.phone){
        const phone=String(rest.phone).replace(/[^+\d]/g,"");
        contactLink.href=`tel:${phone}`;
      }

      const coverUrl = safeUrl(rest.banner_url || rest.cover_url || rest.cover_image);
      const dummyBanner = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
          <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#6b1f1a"/><stop offset="0.55" stop-color="#9f5a32"/><stop offset="1" stop-color="#d8a84e"/></linearGradient></defs>
          <rect width="1200" height="520" fill="url(#g)"/>
          <circle cx="960" cy="110" r="160" fill="rgba(255,255,255,.10)"/>
          <circle cx="180" cy="470" r="220" fill="rgba(255,255,255,.08)"/>
          <path d="M0 390 C260 280 420 480 650 350 S1020 260 1200 360 L1200 520 L0 520Z" fill="rgba(0,0,0,.16)"/>
          <text x="600" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="54" font-weight="700" fill="white" opacity=".95">YOUR RESTAURANT</text>
          <text x="600" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" letter-spacing="6" fill="white" opacity=".78">FOOD • FLAVOUR • EXPERIENCE</text>
        </svg>`)} `;
      $("rest-cover").src = coverUrl || dummyBanner;
      $("rest-cover").style.display = "block";

      if (rest.phone) {
        const phone = String(rest.phone).replace(/[^+\d]/g, "");
        $("rest-call-btn").href = `tel:${phone}`;
        $("rest-call-btn").style.display = "grid";
        const callText = rest.call_button_text || "Call Restaurant";
        $("rest-call-btn").setAttribute("aria-label", callText);
        $("rest-call-btn").title = callText;
      }

      const address = rest.address || rest.location || rest.city;
      if (address) {
        $("rest-address").textContent = `• ${address}`;
        $("rest-address").style.display = "inline";
      }

      const isOpen = rest.is_open !== false && rest.status !== "closed" && rest.is_active !== false;
      const statusEl = $("rest-status");
      statusEl.classList.toggle("closed", !isOpen);
      statusEl.querySelector("span:last-child").textContent = isOpen ? "Open" : "Closed";
      const openPill = $("rest-open-pill");
      if(openPill){
        openPill.textContent = isOpen ? "● Open Now" : "● Closed";
        openPill.style.background = isOpen ? "#12964e" : "#b4232e";
      }
      const fmtTime = (v)=>{
        if(!v) return "";
        const parts=String(v).split(":");
        let h=Number(parts[0]),m=Number(parts[1]||0),suffix=h>=12?"PM":"AM";
        h=h%12||12;
        return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")} ${suffix}`;
      };
      const hrs=`${fmtTime(rest.opening_time)||"11:00 AM"} – ${fmtTime(rest.closing_time)||"11:00 PM"}`;
      if($("rest-hours")) $("rest-hours").textContent=hrs;
      if($("svc-dine")) $("svc-dine").style.display=rest.dine_in===false?"none":"inline-flex";
      if($("svc-take")) $("svc-take").style.display=rest.takeaway===false?"none":"inline-flex";
      if($("svc-delivery")) $("svc-delivery").style.display=rest.home_delivery===false?"none":"inline-flex";
    }

    async function loadPublicMenu() {
      showLoading();

      try {
        const params = new URLSearchParams(window.location.search);
        const pathParts = window.location.pathname.split("/").filter(Boolean);

        // Current menu page routing:
        // /menu/<restaurant-slug>
        // The existing /menu.html?r=<restaurant-slug> URL remains supported
        // only as a compatibility entry point; no old menu page is used.
        const pathSlug =
          pathParts[0] === "menu" && pathParts[1]
            ? decodeURIComponent(pathParts[1])
            : "";

        const slug = (pathSlug || params.get("r") || "").trim().toLowerCase();

        let query = supabaseClient.from("restaurants").select("*");
        if (slug) query = query.eq("slug", slug);

        const { data: restaurants, error: restError } = await query.limit(1);
        if (restError) throw restError;

        if (!restaurants || !restaurants.length) {
          $("rest-name").textContent = "Restaurant Not Found";
          $("category-chips").innerHTML = "";
          $("summary-line").style.display = "none";
          showState("Restaurant not found", "Please check the menu link and try again.");
          return;
        }

        const rest = restaurants[0];

        // Keep this exact current menu page as the route target.
        // No legacy/alternate menu file is loaded.
        if (rest.slug) {
          const cleanPath = `/menu/${encodeURIComponent(String(rest.slug).trim())}`;
          if (window.location.pathname !== cleanPath) {
            try {
              window.history.replaceState({}, "", cleanPath);
            } catch (_) {}
          }
        }

        renderRestaurant(rest);

        const { data: items, error: itemsError } = await supabaseClient
          .from("menu_items")
          .select("*")
          .eq("restaurant_id", rest.id);

        if (itemsError) throw itemsError;

        allItems = Array.isArray(items) ? items : [];
        renderFoodFilters();

        // Optional sorting if you later add sort_order fields.
        allItems.sort((a, b) => {
          const aOrder = Number(a.sort_order ?? a.position ?? 999999);
          const bOrder = Number(b.sort_order ?? b.position ?? 999999);
          return aOrder - bOrder;
        });

        if (!allItems.length) {
          $("category-chips").innerHTML = "";
          $("summary-line").style.display = "none";
          showState("Menu is being prepared", "No menu items have been added yet.");
          return;
        }

        renderCategoryChips();
        renderMenu();
      } catch (error) {
        console.error("Menu load error:", error);
        $("rest-name").textContent = "Menu Unavailable";
        $("category-chips").innerHTML = "";
        $("summary-line").style.display = "none";
        showState("Unable to load menu", "Please refresh the page or try again shortly.");
      }
    }

    $("menu-search").addEventListener("input", (event) => {
      searchText = event.target.value || "";
      renderMenu();
    });

    $("food-filters").addEventListener("click", (event) => {
      const btn = event.target.closest(".food-filter");
      if (!btn) return;

      currentFoodType = btn.dataset.foodType || "all";
      renderFoodFilters();
      renderMenu();
    });

    $("category-chips").addEventListener("click", (event) => {
      const btn = event.target.closest(".cat-chip");
      if (!btn) return;

      currentCategory = btn.dataset.category || "all";
      renderCategoryChips();
      renderMenu();

      window.scrollTo({
        top: document.querySelector(".sticky-panel").offsetTop,
        behavior: "smooth"
      });
    });

    window.addEventListener("load", loadPublicMenu);
  </script>
