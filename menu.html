  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --bg:#171513;--surface:#211e1b;--surface2:#2a2521;--text:#f8f3ea;--muted:#b9afa4;
      --accent:#f59e0b;--accent2:#d97706;--border:rgba(255,255,255,.09);--shadow:0 12px 35px rgba(0,0,0,.16);
      --font:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    html{scroll-behavior:smooth;scroll-padding-top:110px}
    body{background:var(--bg);color:var(--text);font-family:var(--font)}
    [data-theme="minimal"]{--bg:#f8faf9;--surface:#fff;--surface2:#f0f5f2;--text:#18201b;--muted:#64706a;--accent:#059669;--accent2:#047857;--border:rgba(15,23,42,.09);--shadow:0 10px 30px rgba(15,23,42,.07)}
    [data-theme="luxury"]{--bg:#0b0a09;--surface:#151311;--surface2:#211d18;--text:#f5ead0;--muted:#b9aa8e;--accent:#d7b56d;--accent2:#a98443;--border:rgba(215,181,109,.18);--shadow:0 15px 40px rgba(0,0,0,.35);--font:Georgia,"Times New Roman",serif}
    [data-theme="organic"]{--bg:#f3ecdf;--surface:#fffaf0;--surface2:#e9e0ce;--text:#26372a;--muted:#697265;--accent:#3f6b48;--accent2:#315638;--border:rgba(38,55,42,.12);--shadow:0 10px 30px rgba(63,75,52,.08)}
    .surface{background:var(--surface);border:1px solid var(--border)}
    .muted{color:var(--muted)}
    .accent{color:var(--accent)}
    .accent-bg{background:var(--accent);color:var(--bg)}
    .border-theme{border-color:var(--border)}
    .shadow-theme{box-shadow:var(--shadow)}
    .hero-placeholder{background:linear-gradient(135deg,var(--surface2),var(--accent2));}
    .logo-placeholder{background:var(--surface2);border:1px solid var(--border)}
    .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none;-ms-overflow-style:none}
    .veg-dot{width:12px;height:12px;border:2px solid currentColor;border-radius:3px;display:inline-flex;align-items:center;justify-content:center}
    .veg-dot:after{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}
    .veg{color:#22c55e}.nonveg{color:#ef4444}
    .dock{padding-bottom:calc(8px + env(safe-area-inset-bottom))}.category-section{scroll-margin-top:118px}.category-icon{background:var(--surface2);border:1px solid var(--border)}.item-card{background:var(--surface)}.mobile-dock{box-shadow:0 -12px 30px rgba(0,0,0,.12)}
    @media(min-width:768px){.mobile-dock{display:none}.desktop-only{display:flex}}
    @media(max-width:767px){.desktop-only{display:none}}
  
    .fm-settings-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:80;display:none}.fm-settings-backdrop.open{display:block}
    .fm-settings{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);background:var(--surface);color:var(--text);z-index:90;transform:translateX(100%);transition:transform .25s ease;overflow:auto;border-left:1px solid var(--border);box-shadow:-20px 0 50px rgba(0,0,0,.2)}.fm-settings.open{transform:translateX(0)}
    .fm-input{width:100%;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:10px 12px;outline:none}.fm-icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface)}.fm-search{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:14px;padding:12px 14px;width:100%;outline:none}.hero-img{object-fit:cover;width:100%;height:100%;display:block}
  
    .menu-state{max-width:720px;margin:18px auto;text-align:center}
    .menu-loading{display:grid;gap:10px}
    .menu-loading .sk{height:16px;border-radius:999px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:fmShimmer 1.2s linear infinite}
    .menu-loading .sk.wide{height:22px;width:62%;margin:auto}
    @keyframes fmShimmer{to{background-position:-200% 0}}




<style id="freemenu-price-alignment">
  /* Category heading and item prices share the EXACT same three columns. */
  .category-header{
    display:flex!important;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    min-height:108px;
  }

  .category-header-main{
    min-width:0;
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
  }

  .category-header-copy{
    min-width:0;
  }

  .category-icon-box{
    width:50px;
    height:50px;
    flex:0 0 50px;
    border-radius:16px;
    display:grid;
    place-items:center;
    color:var(--accent);
    background:var(--surface2);
    border:1px solid var(--border);
  }

  .category-price-columns,
  .item-price-columns{
    width:300px;
    min-width:300px;
    display:grid;
    grid-template-columns:repeat(var(--price-count, 3),minmax(0,1fr));
    column-gap:12px;
    align-items:center;
  }

  .category-price-columns{
    flex:0 0 300px;
    margin-left:auto;
  }

  .price-count-1{--price-count:1}
  .price-count-2{--price-count:2}
  .price-count-3{--price-count:3}

  .category-price-columns span{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    line-height:1;
    font-weight:900;
    letter-spacing:.08em;
    white-space:nowrap;
  }

  .item-price-columns{
    align-self:center;
    flex:0 0 300px;
    margin-left:auto;
  }

  .item-price-columns span{
    display:block;
    min-height:20px;
    text-align:center;
    color:var(--text);
    font-size:15px;
    line-height:20px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .menu-item-row{
    align-items:center!important;
  }

  .menu-item-row > .min-w-0{
    min-width:0;
    flex:1 1 auto;
  }

  @media(max-width:1100px) and (min-width:768px){
    .category-header{
      gap:16px;
    }

    .category-price-columns,
    .item-price-columns{
      width:255px;
      min-width:255px;
    }

    .item-price-columns{
      flex-basis:255px;
    }
  }

  @media(max-width:767px){
    .category-header{
      gap:10px;
      padding:13px 12px!important;
      min-height:82px;
    }

    .category-header-main{
      gap:8px;
    }

    .category-icon-box{
      display:none;
    }

    .category-price-columns,
    .item-price-columns{
      width:180px;
      min-width:180px;
      column-gap:3px;
    }

    .item-price-columns{
      flex-basis:180px;
    }

    .category-price-columns span{
      font-size:8px;
      letter-spacing:.03em;
    }

    .item-price-columns span{
      font-size:12px;
      line-height:18px;
      min-height:18px;
    }

    .menu-item-row{
      gap:8px!important;
      padding:13px 12px!important;
    }
  }

  @media(max-width:430px){
    .category-header{
      gap:8px;
    }

    .category-price-columns,
    .item-price-columns{
      width:156px;
      min-width:156px;
    }

    .item-price-columns{
      flex-basis:156px;
    }

    .category-price-columns span{
      font-size:7px;
    }

    .item-price-columns span{
      font-size:11px;
    }
  }
</style>


<style id="freemenu-responsive-category-nav">
  @media (min-width:768px){
    .category-tabs-mobile-hide{display:block!important}
    .mobile-dock{display:none!important}
  }
  @media (max-width:767px){
    .category-tabs-mobile-hide{display:none!important}
    .mobile-dock{
      display:block!important;
      padding-bottom:calc(7px + env(safe-area-inset-bottom));
    }
    .mobile-dock-inner{
      display:flex;
      gap:8px;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .mobile-dock-inner::-webkit-scrollbar{display:none}
    .mobile-category{
      scroll-snap-align:start;
      flex:0 0 72px;
      text-align:center;
      padding:5px 2px 3px;
      border-radius:16px;
      transition:.18s ease;
    }
    .mobile-category-icon{
      width:46px;
      height:46px;
      margin:0 auto;
      display:grid;
      place-items:center;
      border-radius:15px;
      background:var(--surface2);
      border:1px solid var(--border);
      box-shadow:0 4px 14px rgba(0,0,0,.08);
    }
    .mobile-category-icon svg{
      width:23px;
      height:23px;
    }
    .mobile-category.is-active .mobile-category-icon{
      color:var(--accent);
      border-color:var(--accent);
      box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent),0 7px 18px rgba(0,0,0,.12);
      transform:translateY(-1px);
    }
    .mobile-category.is-active .mobile-category-label{
      color:var(--accent);
    }
    .mobile-category-label{
      display:block;
      margin-top:5px;
      font-size:10px;
      line-height:12px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
  }
</style>


<style id="freemenu-exact-price-ruler">
  /* Exact compact ruler: only the price types that exist take space. */
  .category-price-columns.price-count-1,
  .item-price-columns.price-count-1{
    width:90px!important;
    min-width:90px!important;
  }
  .category-price-columns.price-count-2,
  .item-price-columns.price-count-2{
    width:190px!important;
    min-width:190px!important;
  }
  .category-price-columns.price-count-3,
  .item-price-columns.price-count-3{
    width:290px!important;
    min-width:290px!important;
  }

  .category-price-columns.price-count-1{flex-basis:90px!important}
  .category-price-columns.price-count-2{flex-basis:190px!important}
  .category-price-columns.price-count-3{flex-basis:290px!important}

  .item-price-columns.price-count-1{flex-basis:90px!important}
  .item-price-columns.price-count-2{flex-basis:190px!important}
  .item-price-columns.price-count-3{flex-basis:290px!important}

  @media(max-width:767px){
    .category-price-columns.price-count-1,
    .item-price-columns.price-count-1{
      width:58px!important;
      min-width:58px!important;
      flex-basis:58px!important;
    }
    .category-price-columns.price-count-2,
    .item-price-columns.price-count-2{
      width:122px!important;
      min-width:122px!important;
      flex-basis:122px!important;
    }
    .category-price-columns.price-count-3,
    .item-price-columns.price-count-3{
      width:180px!important;
      min-width:180px!important;
      flex-basis:180px!important;
    }
  }
</style>


<style id="desktop-category-icon-hide">
@media (min-width:768px){
  .category-header .category-icon-box{display:none!important}
}
@media (max-width:767px){
  .mobile-category-icon{
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--text);
  }
  .mobile-category.is-active .mobile-category-icon{
    color:var(--accent);
    border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 10%,var(--surface2));
  }
}
</style>

<style id="diet-filter-visibility">.filter-btn[hidden]{display:none!important}</style>
<style id="diet-filter-visibility-fix">.filter-btn[hidden]{display:none!important}</style>
</head>

    const $ = (id) => document.getElementById(id);

    function escapeHTML(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeUrl(value) {
      if (!value) return "";
      try {
        const url = new URL(value, window.location.origin);
        if (["http:", "https:"].includes(url.protocol)) return url.href;
      } catch (_) {}
      return "";
    }

    function cssColor(value, fallback) {
      if (!value) return fallback;
      const test = document.createElement("span");
      test.style.color = "";
      test.style.color = value;
      return test.style.color ? value : fallback;
    }

    function applyRestaurantTheme(rest) {
      const root = document.documentElement.style;

      // These fields are OPTIONAL. If your table does not have them,
      // the fallback colors below will be used automatically.
      const primary = cssColor(rest.primary_color || rest.theme_primary, "#0f766e");
      const primaryDark = cssColor(rest.primary_dark || rest.theme_primary_dark, "#115e59");
      const bg = cssColor(rest.background_color || rest.theme_background, "#f6f7f9");
      const surface = cssColor(rest.card_color || rest.theme_card, "#ffffff");
      const text = cssColor(rest.text_color || rest.theme_text, "#111827");

      const accent = cssColor(rest.accent_color || rest.theme_accent, "#c8943e");
      root.setProperty("--primary", primary);
      root.setProperty("--primary-dark", primaryDark);
      root.setProperty("--accent", accent);
      root.setProperty("--primary-soft", `color-mix(in srgb, ${primary} 10%, white)`);
      root.setProperty("--bg", bg);
      root.setProperty("--surface", surface);
      root.setProperty("--surface-2", `color-mix(in srgb, ${surface} 92%, ${primary} 8%)`);
      root.setProperty("--text", text);

      const radius = Number(rest.card_radius || rest.theme_radius);
      if (Number.isFinite(radius) && radius >= 0 && radius <= 40) {
        root.setProperty("--radius", `${radius}px`);
      }

      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) metaTheme.setAttribute("content", primary);
    }

    function getItemType(item) {
      if (String(item.item_type || "").toLowerCase() === "egg") return "egg";
      if (String(item.item_type || "").toLowerCase() === "nonveg" || item.is_veg === false) return "nonveg";
      return "veg";
    }

    function isUnavailable(item) {
      return item.is_available === false || item.available === false || item.unavailable === true || item.status === "unavailable" || item.status === "out_of_stock";
    }

    function renderPrice(item, priceTypes = ["qtr","half","full"]) {
      const clean = v =>
        (v !== null && v !== undefined && String(v).trim() !== "")
          ? String(v).trim()
          : "";

      const values = {
        qtr: clean(item.price_quarter),
        half: clean(item.price_half),
        full: clean(item.price_full) || clean(item.price)
      };

      const visible = priceTypes.filter(type => values[type]);
      if (!visible.length) return "";

      return `
        <div class="item-price-columns price-count-${visible.length}" aria-label="Item prices">
          ${visible.map(type => `<span>${"₹" + escapeHTML(values[type])}</span>`).join("")}
        </div>`;
    }

    function renderTags(item) {
      const tags = [];
      if (item.is_bestseller === true || item.bestseller === true) tags.push(`<span class="text-[10px] uppercase tracking-wider px-2 py-1 rounded-full accent-bg font-bold">Bestseller</span>`);
      if (item.is_recommended === true || item.recommended === true) tags.push(`<span class="text-[10px] px-2 py-1 rounded-full surface border-theme">Recommended</span>`);
      if (item.is_spicy === true || item.spicy === true) tags.push(`<span class="text-[10px] px-2 py-1 rounded-full surface border-theme">Spicy</span>`);
      if (isUnavailable(item)) tags.push(`<span class="text-[10px] px-2 py-1 rounded-full bg-red-100 text-red-700">Unavailable</span>`);
      return tags.length ? `<div class="flex flex-wrap gap-1.5 mt-2">${tags.join("")}</div>` : "";
    }

    function renderItem(item, priceTypes) {
      const type = getItemType(item);
      const unavailable = isUnavailable(item);
      return `
        <article class="p-4 md:p-5 flex items-start justify-between gap-4 border-b border-theme last:border-0 ${unavailable ? "opacity-50" : ""} menu-item-row">
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-center gap-2">
              <span class="${type === "veg" ? "veg" : type === "nonveg" ? "nonveg" : "text-amber-600"}"><span class="veg-dot" title="${type}"></span></span>
              <h3 class="font-bold text-base md:text-lg">${escapeHTML(item.name || "Unnamed item")}</h3>
            </div>
            ${renderTags(item)}
            ${item.description ? `<p class="muted text-sm mt-1.5 leading-6">${escapeHTML(item.description)}</p>` : ""}
          </div>
          ${renderPrice(item, priceTypes)}
        </article>`;
    }

    function categoryKey(category) {
      return String(category || "General").trim() || "General";
    }

    function sectionId(name) {
      return `cat-${name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "general"}`;
    }

    function getSavedCategoryOrder(rest, items) {
      const names = [...new Set(items.map(item => categoryKey(item.category)))];
      const saved = Array.isArray(rest?.category_order) ? rest.category_order.map(String) : [];
      const rank = new Map(saved.map((x,i)=>[x,i]));
      return names.sort((a,b)=>{
        const ar=rank.has(a)?rank.get(a):999999, br=rank.has(b)?rank.get(b):999999;
        return ar-br || a.localeCompare(b);
      });
    }

    function getCategories(items) {
      return getSavedCategoryOrder(restaurant, items);
    }

    function categoryIcon(category) {
      const c = String(category || "").toLowerCase();
      if (c.includes("starter") || c.includes("tandoori") || c.includes("kebab")) return '<path d="M5 19h14M7 15h10M9 11h6M10 4h4M8 7h8l1 8H8l1-8Z"/>';
      if (c.includes("main") || c.includes("curry") || c.includes("rice")) return '<path d="M4 13h16a8 8 0 0 1-16 0Z"/><path d="M7 10V7M12 10V5M17 10V7"/>';
      if (c.includes("bread") || c.includes("roti") || c.includes("naan") || c.includes("roll")) return '<path d="M5 17c0-4 3-7 7-7s7 3 7 7H5Z"/><path d="M8 10c.4-3 1.8-5 4-6 2.2 1 3.6 3 4 6"/>';
      if (c.includes("dessert") || c.includes("sweet") || c.includes("ice cream")) return '<path d="m7 10 5 10 5-10H7Z"/><path d="M8 8a4 4 0 1 1 8 0"/><path d="M12 4v2"/>';
      if (c.includes("beverage") || c.includes("drink") || c.includes("tea") || c.includes("coffee") || c.includes("shake")) return '<path d="M6 7h10v8a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4V7Z"/><path d="M16 9h2a2 2 0 0 1 0 4h-2"/><path d="M9 3c0 1 1 1 1 2M13 3c0 1 1 1 1 2"/>';
      if (c.includes("soup")) return '<path d="M5 12h14a7 7 0 0 1-14 0Z"/><path d="M8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4"/>';
      if (c.includes("chinese")) return '<path d="M5 9h14M7 9v7a5 5 0 0 0 10 0V9"/><path d="M9 5h6"/>';
      if (c.includes("momos")) return '<path d="M5 14c0-4 3-7 7-7s7 3 7 7H5Z"/><path d="M7 14h10M9 11l1 2M12 10l1 3M15 11l1 2"/>';
      if (c.includes("pasta") || c.includes("noodle")) return '<path d="M5 8h14M7 8v5a5 5 0 0 0 10 0V8"/><path d="M9 4c0 2 2 2 2 4M13 4c0 2 2 2 2 4"/>';
      return '<path d="m12 3 2.2 5.2L20 10l-5.8 1.8L12 17l-2.2-5.2L4 10l5.8-1.8L12 3Z"/>';
    }

    function renderCategoryChips() {

    function getFilteredItems() {
      const q = searchText.trim().toLowerCase();
      return allItems.filter(item => {
        const category = categoryKey(item.category);
        const categoryMatch = currentCategory === "all" || category === currentCategory;
        const haystack = `${item.name || ""} ${item.description || ""} ${category}`.toLowerCase();
        return categoryMatch && (!q || haystack.includes(q));
      });
    }


    function updateNonVegFilter() {
      const btn = document.querySelector('.filter-btn[data-filter="nonveg"]');
      if (!btn) return;

      const hasNonVeg = Array.isArray(allItems) && allItems.some(item => {
        const type = String(getItemType(item) || "").toLowerCase();
        return type === "nonveg";

      btn.hidden = !hasNonVeg;
      btn.style.display = hasNonVeg ? "" : "none";

      if (!hasNonVeg && activeDietFilter === "nonveg") {
        activeDietFilter = "all";
      }

    function renderMenu() {
      const filtered = getFilteredItems();
      const grouped = {};

      filtered.forEach(item => {
        const category = categoryKey(item.category);
        if (!grouped[category]) grouped[category] = [];
        grouped[category].push(item);
      });

      const orderedCategories = getSavedCategoryOrder(
        restaurant,
        Object.values(grouped).flat()
      );

      orderedCategories.forEach(category => {
        if (grouped[category]) {
          grouped[category].sort((a,b) => {
            const ao = Number(a.sort_order ?? a.position ?? 999999);
            const bo = Number(b.sort_order ?? b.position ?? 999999);
            return ao - bo || String(a.name || "").localeCompare(String(b.name || ""));
          });
        }
      });

      const menuEl = $("menu");

      if (!filtered.length) {
        menuEl.innerHTML = `<div class="surface rounded-2xl p-8 text-center muted">Nothing found. Try another search or category.</div>`;
        return;
      }

      menuEl.innerHTML = orderedCategories
        .filter(category => grouped[category])
        .map(category => {
          const items = grouped[category];

          // Show only the price types that actually exist anywhere in this category.
          const priceTypes = [];
          if (items.some(x => String(x.price_quarter ?? "").trim() !== "")) priceTypes.push("qtr");
          if (items.some(x => String(x.price_half ?? "").trim() !== "")) priceTypes.push("half");
          if (items.some(x => String(x.price_full ?? x.price ?? "").trim() !== "")) priceTypes.push("full");

          const priceLabels = {
            qtr: "QTR",
            half: "HALF",
            full: "FULL"
          };

          return `
          <section id="${sectionId(category)}"
                   data-category="${escapeHTML(category)}"
                   class="category-section mb-9">

            <div class="surface shadow-theme rounded-2xl p-4 sm:p-5 mb-3 category-header">

              <div class="category-header-main">
                <div class="category-header-copy">
                  <h2 class="text-xl md:text-2xl font-black">${escapeHTML(category)}</h2>
                  
                </div>
              </div>

              ${priceTypes.length ? `
              <div class="category-price-columns price-count-${priceTypes.length}" aria-label="Available price types">
                ${priceTypes.map(type => `<span>${priceLabels[type]}</span>`).join("")}
              </div>` : ""}

            </div>

            <div class="surface rounded-2xl overflow-hidden shadow-theme item-card">
              ${items.map(item => renderItem(item, priceTypes)).join("")}
            </div>
          </section>`;
        }).join("");
    }

          : `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18M5 11v7h14v-7M8 7h8M9 4h6"/></svg>`;

      if($("svc-delivery")) $("svc-delivery").style.display=rest.home_delivery===false?"none":"inline-flex";
    }

    // ==================== FreeMenu Google AdSense ====================
    // Super Admin controls these values in platform_settings.
    // No arbitrary HTML is accepted from the admin panel.
    let fmAdConfig = null;

    function fmSettingValue(rows, key, fallback = "") {
      const row = (rows || []).find(x => x.key === key);
      return row ? row.value : fallback;
    }

    function fmBool(value, fallback = false) {
      if (value === true || value === false) return value;
      if (value == null || value === "") return fallback;
      return String(value).toLowerCase() === "true";
    }

    async function loadFreeMenuAdConfig(rest) {
      try {
        const settingsResult = await supabaseClient
          .from("platform_settings")
          .select("key,value")
          .in("key", ["adsense_client_id", "ads_default_slot", "free_plan_ads", "premium_plan_ads", "ads_position"]);

        if (settingsResult.error) {
          console.warn("Ad settings unavailable; ads hidden.", settingsResult.error.message);
          return null;
        }

        const rows = settingsResult.data || [];
        const client = String(fmSettingValue(rows, "adsense_client_id", "")).trim();
        const slot = String(fmSettingValue(rows, "ads_default_slot", "")).trim();
        const freeAds = fmBool(fmSettingValue(rows, "free_plan_ads", true), true);
        const premiumAds = fmBool(fmSettingValue(rows, "premium_plan_ads", false), false);
        const plan = String(rest.plan || "free").toLowerCase();

        // If restaurant is premium and its subscription table is available,
        // require an active premium subscription before suppressing ads.
        let activePremium = false;
        const subResult = await supabaseClient
          .from("subscriptions")
          .select("plan,status,expiry_date")
          .eq("restaurant_id", rest.id)
          .eq("status", "active");

        if (!subResult.error && Array.isArray(subResult.data)) {
          activePremium = subResult.data.some(s => {
            if (String(s.plan || "").toLowerCase() !== "premium") return false;
            if (!s.expiry_date) return true;
            const expiry = new Date(s.expiry_date);
            return Number.isNaN(expiry.getTime()) || expiry >= new Date();
          });
        }

        const shouldShow = activePremium ? premiumAds : (plan === "premium" ? premiumAds : freeAds);
        if (!shouldShow) return null;
        if (!/^ca-pub-\d{6,}$/.test(client) || !/^\d{4,}$/.test(slot)) return null;
        return { client, slot, position: String(fmSettingValue(rows, "ads_position", "after_2_categories")) };
      } catch (e) {
        console.warn("Ad configuration error; ads hidden.", e);
        return null;
      }
    }

    function ensureAdSenseScript(client) {
      if (!client || document.querySelector('script[data-freemenu-adsense="1"]')) return;
      const script = document.createElement("script");
      script.async = true;
      script.crossOrigin = "anonymous";
      script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + encodeURIComponent(client);
      script.setAttribute("data-freemenu-adsense", "1");
      document.head.appendChild(script);
    }

    function renderMenuAd() {
      if (!fmAdConfig) return "";
      const id = "fm-ad-" + Math.random().toString(36).slice(2, 9);
      setTimeout(() => {
        const wrap = document.getElementById(id);
        if (!wrap) return;
        const ins = wrap.querySelector("ins");
        if (!ins) return;
        ins.setAttribute("data-ad-client", fmAdConfig.client);
        ins.setAttribute("data-ad-slot", fmAdConfig.slot);
        ins.setAttribute("data-ad-format", "auto");
        ins.setAttribute("data-full-width-responsive", "true");
        try { (window.adsbygoogle = window.adsbygoogle || []).push({}); }
        catch (e) { console.warn("AdSense render skipped", e); }
      }, 50);
      return `<div id="${id}" class="fm-ad-wrap" aria-label="Advertisement"><ins class="adsbygoogle"></ins></div>`;
    }


    /* ==================== FreeMenu Menu Maintenance ==================== */
    let fmMaintenanceTimer = null;

    function isMenuMaintenanceOn(rest){
      return rest?.menu_update_mode === true;
    }

    function showMenuMaintenance(){
      if ($("categoryTabs")) $("categoryTabs").innerHTML = "";
      if ($("mobileCategories")) $("mobileCategories").innerHTML = "";
      const menuEl = $("menu");
      if (!menuEl) return;
      menuEl.innerHTML = `<section class="surface rounded-3xl p-8 md:p-12 text-center shadow-theme">
        <div class="mx-auto w-14 h-14 rounded-2xl category-icon grid place-items-center accent mb-4">
          <span class="text-2xl" aria-hidden="true">🛠️</span>
        </div>
        <h2 class="text-2xl md:text-3xl font-black">Price Now Updating</h2>
        <p class="muted mt-2 leading-6">Menu will be available soon.<br>Please check again in a little while.</p>
        <span class="inline-flex mt-5 px-3 py-1.5 rounded-full border-theme accent text-xs font-bold uppercase tracking-wider">Menu Temporarily Offline</span>
      </section>`;
    }

    async function checkMenuMaintenance(){
      if(!restaurant?.id) return;
      try{
        const {data,error}=await supabaseClient
          .from("restaurants")
          .select("menu_update_mode")
          .eq("id",restaurant.id)
          .maybeSingle();

        if(error) return;

        const enabled = data?.menu_update_mode === true;
        if(enabled){
          showMenuMaintenance();
        }else if(restaurant.menu_update_mode === true){
          window.location.reload();
        }
        restaurant.menu_update_mode = enabled;
      }catch(e){
        console.warn("Menu maintenance status check failed:",e);
      }
    }

    // Owner/Super-Admin settings consumed by the public menu.
    // These remain data-driven and are never exposed as a public settings panel.
    const PUBLIC_MENU_SETTINGS = Object.freeze({
      restaurant: ["name","slug","welcome_text","tagline","subtitle_text","feature_1","feature_2","feature_3","slogan_1","slogan_2","logo_url","banner_url","cover_url","cover_image","phone","call_button_text","address","is_open","status","is_active","opening_time","closing_time","dine_in","takeaway","home_delivery","category_order","primary_color","primary_dark","background_color","card_color","text_color","accent_color","card_radius","theme_primary","theme_primary_dark","theme_background","theme_card","theme_text","theme_accent","theme_radius","menu_update_mode","plan","plan_id","custom_plan_enabled"],
      menuItem: ["name","description","category","item_type","is_veg","is_available","available","unavailable","status","price","price_quarter","price_half","price_full","is_bestseller","bestseller","is_recommended","recommended","is_spicy","spicy","sort_order","position"],
      platform: ["adsense_client_id","ads_default_slot","free_plan_ads","premium_plan_ads","ads_position"],
      subscription: ["plan","status","expiry_date"]
    });

    async function loadPublicMenu() {
      showLoading();

      try {
        const params = new URLSearchParams(window.location.search);
        const slug = (params.get("r") || "").trim().toLowerCase();

        let query = supabaseClient.from("restaurants").select("*");
        if (slug) query = query.eq("slug", slug);

        const { data: restaurants, error: restError } = await query.limit(1);
        if (restError) throw restError;

        if (!restaurants || !restaurants.length) {
          const nameEl = $("restaurant-name"); if (nameEl) nameEl.textContent = "Restaurant Not Found";
          if ($("categoryTabs")) $("categoryTabs").innerHTML = "";
          if ($("mobileCategories")) $("mobileCategories").innerHTML = "";
          showState("Restaurant not found", "Please check the menu link and try again.");
          return;
        }

        const rest = restaurants[0];

        // Menu maintenance must be checked before plan/template routing.
        if (isMenuMaintenanceOn(rest)) {
          restaurant = rest;
          showMenuMaintenance();
          if (fmMaintenanceTimer) clearInterval(fmMaintenanceTimer);
          fmMaintenanceTimer = setInterval(checkMenuMaintenance, 10000);
          return;
        }

        // PLAN -> PUBLIC MENU TEMPLATE ROUTING
        // Super Admin assigns restaurants.plan_id. The assigned plan decides
        // which public menu template the restaurant receives.
        if (rest.plan_id) {
          const { data: assignedPlan, error: planError } = await supabaseClient
            .from("plans")
            .select("id,name,slug,is_active")
            .eq("id", rest.plan_id)
            .maybeSingle();

          if (!planError && assignedPlan && assignedPlan.is_active !== false) {
            const planKey = `${assignedPlan.slug || ""} ${assignedPlan.name || ""}`.toLowerCase().trim();

            const isSignature3D =
              planKey.includes("signature 3d") ||
              planKey.includes("signature-3d") ||
              planKey.includes("signature_3d") ||
              (planKey.includes("signature") && planKey.includes("3d"));

            // NEW: Full 3D Experience also uses the Signature Menu template.
            // The actual GLB / AR dish limit remains controlled by the assigned
            // plan's signature_3d_dishes_max value in Owner Dashboard.
            const isFull3D =
              planKey.includes("full 3d") ||
              planKey.includes("full-3d") ||
              planKey.includes("full_3d") ||
              (planKey.includes("full") && planKey.includes("3d"));

            // NEW: Super Admin Custom Menu also uses the Signature Menu template.
            // Custom Menu stays fully controlled by the restaurant's custom
            // settings (including custom_signature_3d_dishes_max) in Owner Dashboard.
            const isCustomMenu = rest.custom_plan_enabled === true;

            if (isSignature3D || isFull3D || isCustomMenu) {
              const signatureUrl = new URL("/signaturemenu.html", window.location.origin);
              signatureUrl.searchParams.set("r", rest.slug);
              window.location.replace(signatureUrl.href);
              return;
            }

            const isGrowthPhotos =
              planKey.includes("growth") ||
              planKey.includes("growth-photos") ||
              planKey.includes("growth photos") ||
              planKey.includes("photo_menu_v1");

            if (isGrowthPhotos) {
              const growthUrl = new URL("/menugrowth.html", window.location.origin);
              growthUrl.searchParams.set("r", rest.slug);
              window.location.replace(growthUrl.href);
              return;
            }
          }
        }

        if (fmMaintenanceTimer) { clearInterval(fmMaintenanceTimer); fmMaintenanceTimer = null; }
        renderRestaurant(rest);
        fmAdConfig = await loadFreeMenuAdConfig(rest);
        if (fmAdConfig) ensureAdSenseScript(fmAdConfig.client);

        const { data: items, error: itemsError } = await supabaseClient
          .from("menu_items")
          .select("*")
          .eq("restaurant_id", rest.id);

        if (itemsError) throw itemsError;

        allItems = Array.isArray(items) ? items : [];

        // Optional sorting if you later add sort_order fields.
        allItems.sort((a, b) => {
          const aOrder = Number(a.sort_order ?? a.position ?? 999999);
          const bOrder = Number(b.sort_order ?? b.position ?? 999999);
          return aOrder - bOrder;
        });

        if (!allItems.length) {
          if ($("categoryTabs")) $("categoryTabs").innerHTML = "";
          if ($("mobileCategories")) $("mobileCategories").innerHTML = "";
          showState("Menu is being prepared", "No menu items have been added yet.");
          return;
        }

        renderCategoryChips();
        renderMenu();
        updateNonVegFilter();
        setupCategoryObserver();
      } catch (error) {
        console.error("Menu load error:", error);

        const nameEl = $("restaurant-name");
        if (nameEl) nameEl.textContent = "Menu Unavailable";
        if ($("categoryTabs")) $("categoryTabs").innerHTML = "";
        if ($("mobileCategories")) $("mobileCategories").innerHTML = "";
        showState("Unable to load menu", "Please refresh the page or check your connection.");
      }
    }

    document.getElementById("menuSearch").addEventListener("input", (event) => {
      searchText = event.target.value || "";
      renderMenu();
    });

    document.addEventListener("click", (event) => {
      const mobileBtn = event.target.closest("#mobileCategories [data-category]");
      if (mobileBtn) {
        event.preventDefault();
        currentCategory = mobileBtn.dataset.category || "all";
        renderCategoryChips();
        renderMenu();
        const target = document.getElementById(sectionId(currentCategory));
        if (target) target.scrollIntoView({behavior:"smooth", block:"start"});
        return;
      }
      const desktopBtn = event.target.closest("#categoryTabs [data-category]");
      if (!desktopBtn) return;
      event.preventDefault();
      currentCategory = desktopBtn.dataset.category || "all";
      renderCategoryChips();
      renderMenu();
      const target = currentCategory === "all" ? document.getElementById("menu") : document.getElementById(sectionId(currentCategory));
      if (target) target.scrollIntoView({behavior:"smooth", block:"start"});
    });

    document.getElementById("categoryTabs")?.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-category]");
      if (!btn) return;
      event.preventDefault();
      currentCategory = btn.dataset.category || "all";
      renderCategoryChips();
      renderMenu();
      const target = currentCategory === "all" ? document.getElementById("menu") : document.getElementById(sectionId(currentCategory));
      if (target) target.scrollIntoView({behavior:"smooth", block:"start"});
    });


    // Scroll-aware category highlighting.
    let categoryObserver = null;
    function setupCategoryObserver() {
      if (categoryObserver) categoryObserver.disconnect();
      const sections = [...document.querySelectorAll("#menu .category-section")];
      if (!sections.length) return;
      categoryObserver = new IntersectionObserver((entries) => {
        const visible = entries
          .filter(entry => entry.isIntersecting)
          .sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!visible || searchText.trim()) return;
        const category = visible.target.dataset.category;
        if (category && category !== currentCategory) {
          currentCategory = category;
          renderCategoryChips();
        }
      }, { rootMargin: "-18% 0px -65% 0px", threshold: [0.05, 0.2, 0.5] });
      sections.forEach(section => categoryObserver.observe(section));
    }

    document.addEventListener("click", (event) => {
      const filter = event.target.closest(".filter-btn");
      if (!filter) return;
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("accent-bg");
        btn.classList.add("surface");
      });
      filter.classList.add("accent-bg");
      filter.classList.remove("surface");
      const value = filter.dataset.filter || "all";
      window.dietaryFilter = value;
      renderMenu();
    });

    // Apply dietary filter without changing the existing Supabase item schema.
    const _getFilteredItems = getFilteredItems;
    getFilteredItems = function() {
      const base = _getFilteredItems();
      const filter = window.dietaryFilter || "all";
      if (filter === "all") return base;
      return base.filter(item => {
        const type = getItemType(item);
        return filter === type;
      });
    };

    window.addEventListener("load", () => { loadPublicMenu(); });
  </script>

  <div id="legacyCompat" hidden>
    <span id="rest-welcome"></span><span id="rest-subtitle"></span>
    <span id="rest-feature1"></span><span id="rest-feature2"></span><span id="rest-feature3"></span>
    <span id="rest-features"></span><span id="rest-slogans"></span><span id="rest-slogan1"></span><span id="rest-slogan2"></span>
    <span id="rest-phone"></span><span id="rest-call-btn"></span><span id="rest-hours"></span>
    <span id="rest-open-pill"></span><span id="rest-status"></span>
    <span id="svc-dine"></span><span id="svc-take"></span><span id="svc-delivery"></span>
    <span id="rest-address"></span><span id="logo-container"></span><img id="rest-cover" alt="">
  </div>
