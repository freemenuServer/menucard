<script>
  const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co"; 
  const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE"; 
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // 1. Query parameter (?r=urban ya ?restaurant=urban) se slug extract karne ka code
  function getSlugFromUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('r') || urlParams.get('restaurant');
  }

  async function loadMenu() {
    const slug = getSlugFromUrl();

    // Agar URL me query parameter missing hai
    if (!slug) {
      showError("Invalid Menu Link", "Please open link with restaurant code like: /menu.html?r=urban");
      return;
    }

    // 2. Fetch Restaurant Details using Slug
    const { data: restaurant, error: restError } = await supabaseClient
      .from('restaurants')
      .select('*')
      .eq('slug', slug)
      .maybeSingle();

    if (restError || !restaurant) {
      showError("Restaurant Not Found", `No restaurant found with code '${slug}'`);
      return;
    }

    document.getElementById('restaurant-name').innerText = restaurant.name || "Menu";
    document.title = `${restaurant.name || 'Menu'} - FreeMenu.in`;

    // 3. Fetch Menu Items
    const { data: items, error: itemsError } = await supabaseClient
      .from('menu_items')
      .select('*')
      .eq('restaurant_id', restaurant.id);

    if (itemsError || !items || items.length === 0) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('menu-view').style.display = 'block';
      document.getElementById('menu-container').innerHTML = `
        <div class="status-container" style="padding: 40px 0;">
          <div class="status-sub">No items found in this menu.</div>
        </div>
      `;
      return;
    }

    // 4. Group Items by Category
    const groupedItems = {};
    items.forEach(item => {
      const cat = item.category || 'General';
      if (!groupedItems[cat]) groupedItems[cat] = [];
      groupedItems[cat].push(item);
    });

    // 5. Render Menu UI
    renderMenuUI(groupedItems);
  }

  function renderMenuUI(groupedItems) {
    const container = document.getElementById('menu-container');
    container.innerHTML = '';

    for (const category in groupedItems) {
      const catSection = document.createElement('div');
      catSection.className = 'category-section';

      const categoryHeader = `
        <div class="category-title">
          <span>${category}</span>
          <span class="category-count">${groupedItems[category].length} items</span>
        </div>
      `;

      const itemsHtml = groupedItems[category].map(item => `
        <div class="menu-card">
          <div class="item-info">
            <div class="item-name">${item.name || item.title}</div>
          </div>
          <div class="item-price">₹${item.price}</div>
        </div>
      `).join('');

      catSection.innerHTML = categoryHeader + itemsHtml;
      container.appendChild(catSection);
    }

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('menu-view').style.display = 'block';
  }

  function showError(title, message) {
    document.getElementById('loading-state').style.display = 'none';
    const errEl = document.getElementById('error-state');
    if (title) document.getElementById('error-title').innerText = title;
    if (message) document.getElementById('error-sub').innerText = message;
    errEl.style.display = 'block';
  }

  window.onload = loadMenu;
</script>
