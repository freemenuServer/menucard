<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Menu Card</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --menu-bg: #fffcf8;
      --text-main: #1c1917;
      --text-muted: #78716c;
      --accent-color: #991b1b;
      --border-color: #e7e5e4;
      --veg: #16a34a;
      --nonveg: #dc2626;
      --egg: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Georgia, 'Times New Roman', serif; }
    
    body { 
      background: #1e293b; 
      color: var(--text-main); 
      min-height: 100vh; 
      padding: 20px 10px;
    }

    /* Paper Menu Canvas Look */
    .paper-menu {
      max-width: 680px;
      margin: 0 auto;
      background: var(--menu-bg);
      padding: 30px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border-radius: 4px;
      border: 1px solid #d6d3d1;
    }

    /* Classic Restaurant Header */
    .menu-header {
      text-align: center;
      border-bottom: 2px double var(--accent-color);
      padding-bottom: 18px;
      margin-bottom: 24px;
    }
    .restaurant-logo { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; }
    .restaurant-name { 
      font-size: 28px; 
      font-weight: 700; 
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent-color); 
    }
    .restaurant-phone { font-family: sans-serif; font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    /* Category Section */
    .category-block { margin-bottom: 28px; }

    .category-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--accent-color);
      padding-bottom: 6px;
      margin-bottom: 14px;
    }

    .category-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .portion-headers {
      display: flex;
      gap: 12px;
      font-family: sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .portion-col { width: 48px; text-align: right; }

    /* Item Row Layout */
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px dotted var(--border-color);
    }
    .item-row:last-child { border-bottom: none; }

    .item-left { flex: 1; padding-right: 15px; }
    .item-title-wrapper { display: flex; align-items: center; gap: 8px; }
    .item-name { font-size: 16px; font-weight: 600; color: var(--text-main); }
    .item-desc { font-family: sans-serif; font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Prices Group */
    .price-group { display: flex; gap: 12px; align-items: center; font-family: sans-serif; }
    .price-text {
      width: 48px;
      text-align: right;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
    }
    .price-text.empty { color: #d6d3d1; font-weight: 400; }

    .badge-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .badge-veg { background: var(--veg); }
    .badge-nonveg { background: var(--nonveg); }
    .badge-egg { background: var(--egg); }
  </style>
</head>
<body>

  <!-- Menu Paper Outer -->
  <main class="paper-menu">
    <!-- Header -->
    <header class="menu-header">
      <img id="rest-logo" class="restaurant-logo" src="" style="display: none;" alt="Logo">
      <h1 id="rest-name" class="restaurant-name">Loading Menu...</h1>
      <p id="rest-phone" class="restaurant-phone"></p>
    </header>

    <!-- Menu Items List -->
    <div id="menu-content"></div>
  </main>

  <script>
    const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadPaperMenu() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('r');

      let restQuery = supabaseClient.from('restaurants').select('*');
      if (slug) {
        restQuery = restQuery.eq('slug', slug.toLowerCase());
      }
      
      const { data: restaurants } = await restQuery.limit(1);

      if (!restaurants || restaurants.length === 0) {
        document.getElementById('rest-name').innerText = "Restaurant Not Found";
        return;
      }

      const rest = restaurants[0];
      document.getElementById('rest-name').innerText = rest.name || 'Menu';
      if (rest.phone) document.getElementById('rest-phone').innerText = `📞 ${rest.phone}`;
      if (rest.logo_url) {
        const logoImg = document.getElementById('rest-logo');
        logoImg.src = rest.logo_url;
        logoImg.style.display = 'inline-block';
      }

      const { data: items } = await supabaseClient
        .from('menu_items')
        .select('*')
        .eq('restaurant_id', rest.id);

      renderPaperStyleMenu(items || []);
    }

    function renderPaperStyleMenu(items) {
      const container = document.getElementById('menu-content');
      if (items.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding: 30px; color: #78716c; font-family: sans-serif;">No items available in menu.</p>';
        return;
      }

      const grouped = {};
      items.forEach(item => {
        const cat = item.category ? item.category.trim() : 'General';
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(item);
      });

      let html = '';

      for (const [catName, catItems] of Object.entries(grouped)) {
        const hasPortions = catItems.some(i => i.price_quarter || i.price_half || i.price_full);

        html += `
          <div class="category-block">
            <div class="category-header-row">
              <h2 class="category-title">${catName}</h2>
              ${hasPortions ? `
                <div class="portion-headers">
                  <span class="portion-col">QTR</span>
                  <span class="portion-col">HALF</span>
                  <span class="portion-col">FULL</span>
                </div>
              ` : `
                <div class="portion-headers">
                  <span class="portion-col" style="width:60px;">PRICE</span>
                </div>
              `}
            </div>
            <div>
              ${catItems.map(item => renderItemRow(item, hasPortions)).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderItemRow(item, hasPortions) {
      let typeClass = 'badge-veg';
      if (item.item_type === 'egg') typeClass = 'badge-egg';
      else if (item.item_type === 'nonveg' || item.is_veg === false) typeClass = 'badge-nonveg';

      let pricesHtml = '';

      if (hasPortions) {
        const qtr = item.price_quarter ? `₹${item.price_quarter}` : '-';
        const half = item.price_half ? `₹${item.price_half}` : '-';
        const fullVal = item.price_full || item.price;
        const full = fullVal ? `₹${fullVal}` : '-';

        pricesHtml = `
          <div class="price-group">
            <span class="price-text ${!item.price_quarter ? 'empty' : ''}">${qtr}</span>
            <span class="price-text ${!item.price_half ? 'empty' : ''}">${half}</span>
            <span class="price-text ${!fullVal ? 'empty' : ''}">${full}</span>
          </div>
        `;
      } else {
        const singlePrice = item.price || item.price_full || item.price_half || item.price_quarter || 0;
        pricesHtml = `
          <div class="price-group">
            <span class="price-text" style="width: 60px;">₹${singlePrice}</span>
          </div>
        `;
      }

      return `
        <div class="item-row">
          <div class="item-left">
            <div class="item-title-wrapper">
              <span class="badge-dot ${typeClass}"></span>
              <span class="item-name">${item.name}</span>
            </div>
            ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
          </div>
          ${pricesHtml}
        </div>
      `;
    }

    window.addEventListener('load', loadPaperMenu);
  </script>
</body>
</html>
