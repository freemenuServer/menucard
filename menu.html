<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Menu - FreeMenu.in</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --primary: #10b981; --bg: #f8fafc; --text: #0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; }
    .menu-container { max-width: 600px; margin: 0 auto; }
    .header { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; text-align: center; }
    .header h1 { font-size: 24px; font-weight: 800; color: #0f172a; }
    .menu-item { background: white; border-radius: 10px; padding: 14px; border: 1px solid #e2e8f0; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .item-name { font-weight: 600; font-size: 16px; }
    .item-price { font-weight: 700; color: var(--primary); }
    .badge-veg { color: green; border: 1px solid green; padding: 2px 6px; font-size: 10px; border-radius: 4px; }
    .badge-nonveg { color: red; border: 1px solid red; padding: 2px 6px; font-size: 10px; border-radius: 4px; }
    .error-msg { text-align: center; margin-top: 50px; font-size: 18px; color: #ef4444; }
  </style>
</head>
<body>
  <div class="menu-container">
    <div class="header">
      <h1 id="restaurant-name">Loading Menu...</h1>
      <p id="restaurant-slug" style="color: #64748b; font-size: 14px;"></p>
    </div>

    <div id="menu-items-list">
      <!-- Menu Items Dynamic Inject -->
    </div>
  </div>

  <script>
    // Supabase Initialization
    const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_URL.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.onload = async () => {
      let slug = null;

      // 1. URL Path se Extract Karein (e.g. freemenu.in/menu/urban)
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      if (pathSegments.length >= 2 && pathSegments[0] === 'menu') {
        slug = pathSegments[1];
      }

      // 2. Fallback: Query Parameter Check Karein (e.g. ?slug=urban)
      if (!slug) {
        const urlParams = new URLSearchParams(window.location.search);
        slug = urlParams.get('slug');
      }

      // 3. Menu Load Function Call
      if (slug) {
        loadRestaurantMenu(slug);
      } else {
        document.body.innerHTML = "<div class='error-msg'>Invalid Restaurant Link!</div>";
      }
    };

    async function loadRestaurantMenu(slug) {
      // Step A: Fetch Restaurant Info
      const { data: restaurant, error: restError } = await supabase
        .from('restaurants')
        .select('*')
        .eq('slug', slug)
        .single();

      if (restError || !restaurant) {
        document.body.innerHTML = "<div class='error-msg'>Restaurant Not Found!</div>";
        return;
      }

      document.getElementById('restaurant-name').innerText = restaurant.name;
      document.getElementById('restaurant-slug').innerText = `@${restaurant.slug}`;

      // Step B: Fetch Menu Items
      const { data: items, error: itemsError } = await supabase
        .from('menu_items')
        .select('*')
        .eq('restaurant_id', restaurant.id)
        .eq('is_available', true);

      const listContainer = document.getElementById('menu-items-list');
      listContainer.innerHTML = "";

      if (itemsError || !items || items.length === 0) {
        listContainer.innerHTML = "<p style='text-align:center;'>No items available in menu right now.</p>";
        return;
      }

      // Step C: Render Items
      items.forEach(item => {
        const badgeClass = item.is_veg ? 'badge-veg' : 'badge-nonveg';
        const badgeText = item.is_veg ? 'VEG' : 'NON-VEG';

        listContainer.innerHTML += `
          <div class="menu-item">
            <div>
              <span class="${badgeClass}">${badgeText}</span>
              <div class="item-name" style="margin-top: 4px;">${item.name}</div>
            </div>
            <div class="item-price">₹${item.price}</div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
