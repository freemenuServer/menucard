<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Menu Card</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #047857;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --veg: #16a34a;
      --nonveg: #dc2626;
      --egg: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 50px; }

    /* Sticky Top Header */
    .top-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .header-content {
      max-width: 768px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Left: Logo */
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo-wrapper { position: relative; flex-shrink: 0; }
    .restaurant-logo { 
      width: 48px; 
      height: 48px; 
      border-radius: 12px; 
      object-fit: cover; 
      border: 1px solid #e2e8f0; 
    }
    .status-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 12px;
      height: 12px;
      background: #22c55e;
      border: 2px solid #ffffff;
      border-radius: 50%;
    }

    /* Center: Name & Sub-text */
    .header-center { flex: 1; min-width: 0; }
    .restaurant-name { 
      font-size: 17px; 
      font-weight: 800; 
      color: var(--text-main); 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      line-height: 1.2;
    }
    .restaurant-subtitle { 
      font-size: 12px; 
      color: var(--text-muted); 
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Right: Call Button */
    .header-right { flex-shrink: 0; }
    .call-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: var(--primary-dark);
      border: 1px solid #a7f3d0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .call-btn:active { transform: scale(0.96); }

    /* Main Container */
    .menu-container { max-width: 768px; margin: 16px auto; padding: 0 12px; }

    /* Category Navigation Bar */
    .category-scroll-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .category-scroll-bar::-webkit-scrollbar { display: none; }

    .cat-chip {
      white-space: nowrap;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }
    .cat-chip.active {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    /* Category Cards Layout */
    .category-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .category-header {
      background: #f8fafc;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
    }
    .category-title { font-size: 15px; font-weight: 800; color: #1e293b; text-transform: uppercase; letter-spacing: 0.5px; }

    .portion-labels-header {
      display: flex;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .portion-col { width: 54px; text-align: center; }

    /* Item Row Layout */
    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
    }
    .item-row:last-child { border-bottom: none; }

    .item-details { flex: 1; padding-right: 12px; }
    .item-title-flex { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
    .item-name { font-size: 15px; font-weight: 700; color: var(--text-main); }
    .item-desc { font-size: 12px; color: var(--text-muted); line-height: 1.3; margin-top: 2px; }

    /* Green Badge Prices */
    .price-columns-group { display: flex; gap: 8px; align-items: center; }

    .price-pill-badge {
      width: 54px;
      text-align: center;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 5px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .price-pill-badge.empty {
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      font-weight: 400;
      box-shadow: none;
    }

    /* Veg / Non-Veg Icons */
    .veg-symbol {
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--veg);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .veg-symbol::after {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--veg);
      border-radius: 50%;
    }

    .nonveg-symbol {
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--nonveg);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .nonveg-symbol::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 7px solid var(--nonveg);
    }

    .egg-symbol {
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--egg);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .egg-symbol::after {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--egg);
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <!-- Top Fixed Navbar Header -->
  <nav class="top-navbar">
    <div class="header-content">
      <!-- Left: Logo -->
      <div class="header-left">
        <div class="logo-wrapper">
          <img id="rest-logo" class="restaurant-logo" src="https://via.placeholder.com/48" alt="Logo">
          <span class="status-indicator"></span>
        </div>
      </div>

      <!-- Center: Restaurant Name & Info -->
      <div class="header-center">
        <h1 id="rest-name" class="restaurant-name">Loading Restaurant...</h1>
        <div class="restaurant-subtitle">
          <span>🍽️ Fresh & Authentic Food Menu</span>
        </div>
      </div>

      <!-- Right: Direct Call Button -->
      <div class="header-right">
        <a id="rest-call-btn" href="#" class="call-btn" style="display: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          Call
        </a>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="menu-container">
    <!-- Quick Filter Category Bar -->
    <div class="category-scroll-bar" id="category-chips"></div>

    <!-- Menu Items List -->
    <div id="menu-sections"></div>
  </main>

  <script>
    const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadPublicMenu() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('r');

      let restQuery = supabaseClient.from('restaurants').select('*');
      if (slug) {
        restQuery = restQuery.eq('slug', slug.toLowerCase());
      }
      
      const { data: restaurants } = await restQuery.limit(1);

      if (!restaurants || restaurants.length === 0) {
        document.getElementById('rest-name').innerText = "Restaurant Not Found";
        return;
      }

      const rest = restaurants[0];
      document.getElementById('rest-name').innerText = rest.name || 'Menu';
      
      // Update Call Button Link
      if (rest.phone) {
        const callBtn = document.getElementById('rest-call-btn');
        callBtn.href = `tel:${rest.phone}`;
        callBtn.style.display = 'inline-flex';
      }

      // Update Logo
      if (rest.logo_url) {
        document.getElementById('rest-logo').src = rest.logo_url;
      }

      const { data: items } = await supabaseClient
        .from('menu_items')
        .select('*')
        .eq('restaurant_id', rest.id);

      renderCategorizedMenu(items || []);
    }

    function renderCategorizedMenu(items) {
      const container = document.getElementById('menu-sections');
      const chipsContainer = document.getElementById('category-chips');

      if (items.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding: 40px; color: #64748b;">No items added to the menu yet.</p>';
        return;
      }

      const grouped = {};
      items.forEach(item => {
        const cat = item.category ? item.category.trim() : 'General';
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(item);
      });

      // Render Category Filter Chips
      let chipsHtml = `<span class="cat-chip active">All Menu</span>`;
      Object.keys(grouped).forEach(cat => {
        chipsHtml += `<span class="cat-chip">${cat}</span>`;
      });
      chipsContainer.innerHTML = chipsHtml;

      // Render Categories & Items
      let html = '';
      for (const [catName, catItems] of Object.entries(grouped)) {
        const hasPortions = catItems.some(i => i.price_quarter || i.price_half || i.price_full);

        html += `
          <div class="category-card" id="cat-${catName.replace(/\s+/g, '-')}">
            <div class="category-header">
              <span class="category-title">${catName}</span>
              ${hasPortions ? `
                <div class="portion-labels-header">
                  <span class="portion-col">Qtr</span>
                  <span class="portion-col">Half</span>
                  <span class="portion-col">Full</span>
                </div>
              ` : `
                <div class="portion-labels-header">
                  <span class="portion-col" style="width:65px;">Price</span>
                </div>
              `}
            </div>
            <div>
              ${catItems.map(item => renderItemRow(item, hasPortions)).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function renderItemRow(item, hasPortions) {
      // Food Type Symbol
      let symbolHtml = '<span class="veg-symbol"></span>';
      if (item.item_type === 'egg') {
        symbolHtml = '<span class="egg-symbol"></span>';
      } else if (item.item_type === 'nonveg' || item.is_veg === false) {
        symbolHtml = '<span class="nonveg-symbol"></span>';
      }

      let pricesHtml = '';
      if (hasPortions) {
        const qtr = item.price_quarter ? `₹${item.price_quarter}` : '-';
        const half = item.price_half ? `₹${item.price_half}` : '-';
        const fullVal = item.price_full || item.price;
        const full = fullVal ? `₹${fullVal}` : '-';

        pricesHtml = `
          <div class="price-columns-group">
            <span class="price-pill-badge ${!item.price_quarter ? 'empty' : ''}">${qtr}</span>
            <span class="price-pill-badge ${!item.price_half ? 'empty' : ''}">${half}</span>
            <span class="price-pill-badge ${!fullVal ? 'empty' : ''}">${full}</span>
          </div>
        `;
      } else {
        const singlePrice = item.price || item.price_full || item.price_half || item.price_quarter || 0;
        pricesHtml = `
          <div class="price-columns-group">
            <span class="price-pill-badge" style="width: 65px;">₹${singlePrice}</span>
          </div>
        `;
      }

      return `
        <div class="item-row">
          <div class="item-details">
            <div class="item-title-flex">
              ${symbolHtml}
              <span class="item-name">${item.name}</span>
            </div>
            ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
          </div>
          ${pricesHtml}
        </div>
      `;
    }

    window.addEventListener('load', loadPublicMenu);
  </script>
</body>
</html>
