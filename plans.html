<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plans & Pricing — FreeMenu.in</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#08090b;
      --card:#111317;
      --card2:#15171c;
      --border:#252932;
      --text:#f5f5f5;
      --muted:#9da3ae;
      --red:#ef3340;
      --red2:#ff5964;
      --green:#36d399;
      --shadow:0 20px 60px rgba(0,0,0,.35);
    }
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 50% -10%,rgba(239,51,64,.13),transparent 34%),
        var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    a{text-decoration:none;color:inherit}
    .wrap{max-width:1250px;margin:auto;padding:34px 20px 60px}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;
      gap:15px;margin-bottom:45px
    }
    .brand{font-size:25px;font-weight:850;letter-spacing:-.7px}
    .brand span{color:var(--red)}
    .back{
      border:1px solid var(--border);background:#101216;color:#fff;
      padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px
    }
    .back:hover{border-color:#3a3f49;background:#17191e}
    .hero{text-align:center;max-width:760px;margin:0 auto 42px}
    .eyebrow{
      display:inline-flex;align-items:center;gap:7px;
      color:#ff737c;background:rgba(239,51,64,.10);
      border:1px solid rgba(239,51,64,.22);
      padding:7px 12px;border-radius:999px;
      font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase
    }
    h1{
      margin:16px 0 10px;font-size:clamp(34px,5vw,55px);
      line-height:1.03;letter-spacing:-2px
    }
    .hero p{margin:0;color:var(--muted);font-size:16px;line-height:1.65}
    #status{text-align:center;color:var(--muted);font-size:14px;margin:25px 0}
    .plans{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:18px;
      align-items:stretch;
    }
    .plan{
      position:relative;display:flex;flex-direction:column;
      background:linear-gradient(180deg,#15171c 0%,#101216 100%);
      border:1px solid var(--border);border-radius:20px;
      padding:25px;min-width:0;box-shadow:var(--shadow);
      overflow:hidden
    }
    .plan.recommended{
      border-color:rgba(239,51,64,.72);
      box-shadow:0 22px 70px rgba(239,51,64,.12)
    }
    .ribbon{
      position:absolute;top:14px;right:14px;
      background:var(--red);color:white;border-radius:999px;
      padding:6px 10px;font-size:10px;font-weight:900;letter-spacing:.5px
    }
    .plan-name{font-size:22px;font-weight:850;margin-bottom:7px;padding-right:70px}
    .desc{font-size:13px;line-height:1.55;color:var(--muted);min-height:42px}
    .price-row{display:flex;align-items:flex-end;gap:6px;margin:22px 0 5px}
    .currency{font-size:21px;font-weight:800;margin-bottom:6px}
    .price{font-size:44px;font-weight:900;line-height:.95;letter-spacing:-1.5px}
    .period{font-size:13px;color:var(--muted);margin-bottom:5px}
    .setup{
      font-size:12px;color:#c5c9d1;
      background:#0c0e11;border:1px solid #22252b;
      border-radius:9px;padding:9px 10px;margin-bottom:19px
    }
    .setup strong{color:#fff}
    .features{
      list-style:none;padding:0;margin:0 0 22px;
      display:flex;flex-direction:column;gap:12px;flex:1
    }
    .features li{
      display:flex;gap:9px;align-items:flex-start;
      color:#d9dce2;font-size:13px;line-height:1.45
    }
    .check{
      flex:0 0 auto;width:19px;height:19px;border-radius:50%;
      display:grid;place-items:center;background:rgba(54,211,153,.12);
      color:var(--green);font-size:12px;font-weight:900;margin-top:1px
    }
    .disabled{opacity:.38;text-decoration:line-through}
    .disabled .check{background:#24272d;color:#747983}
    .plan-btn{
      width:100%;border:0;border-radius:12px;
      padding:13px 15px;font-size:14px;font-weight:850;
      cursor:pointer;background:var(--red);color:white;
      transition:.18s transform,.18s background
    }
    .plan-btn:hover{background:var(--red2);transform:translateY(-1px)}
    .plan.free .plan-btn{background:#252930}
    .plan.free .plan-btn:hover{background:#30353e}
    .empty{
      grid-column:1/-1;text-align:center;padding:45px 20px;
      border:1px dashed #30343c;border-radius:16px;color:var(--muted)
    }
    .footer{
      text-align:center;color:#6f747e;font-size:12px;margin-top:42px
    }
    .toast{
      position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);
      background:#171a20;border:1px solid #30343d;color:#fff;
      border-radius:12px;padding:12px 16px;font-size:13px;
      opacity:0;pointer-events:none;transition:.22s;z-index:50
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1050px){
      .plans{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media(max-width:600px){
      .wrap{padding:22px 14px 40px}
      .topbar{margin-bottom:32px}
      .brand{font-size:21px}
      .back{padding:9px 12px}
      .hero{margin-bottom:28px}
      h1{letter-spacing:-1.2px}
      .plans{grid-template-columns:1fr}
      .plan{padding:21px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Free<span>Menu</span>.in</div>
      <a class="back" href="../owner.html">← Owner Dashboard</a>
    </div>

    <section class="hero">
      <div class="eyebrow">Plans & Pricing</div>
      <h1>Choose the plan that fits your restaurant</h1>
      <p>
        Simple pricing for your digital menu. Plan details, prices and features
        are managed by FreeMenu Admin.
      </p>
    </section>

    <div id="status">Loading plans...</div>
    <section id="plans" class="plans"></section>

    <div class="footer">
      FreeMenu.in • Digital Menu Platform
    </div>
  </div>

  <div id="toast" class="toast"></div>

  
<script>
/* FreeMenu Plans Access Gate
   Plans are intentionally not a public/direct page.
   Owner dashboard opens this page with a short-lived navigation token.
*/
(function(){
  const params = new URLSearchParams(location.search);
  const token = params.get("owner_plans");
  const now = Date.now();

  let allowed = false;
  try{
    const saved = sessionStorage.getItem("fm_owner_plans_access");
    if(saved){
      const data = JSON.parse(saved);
      allowed = data && data.token && data.token === token && Number(data.expiresAt) > now;
    }
  }catch(e){}

  if(!allowed){
    document.documentElement.innerHTML = `
      <head><title>FreeMenu.in</title></head>
      <body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;font-family:Arial,sans-serif">
        <div style="max-width:420px;margin:20px;padding:28px;background:#fff;border:1px solid #e4e7ec;border-radius:18px;text-align:center;box-shadow:0 10px 30px rgba(16,24,40,.08)">
          <div style="font-size:42px">🔒</div>
          <h2 style="margin:12px 0 8px;color:#101828">Plans page restricted</h2>
          <p style="margin:0 0 20px;color:#667085">Please open Plans from your Owner Dashboard.</p>
          <button onclick="location.href='/owner.html'" style="border:0;border-radius:10px;padding:11px 18px;background:#111827;color:#fff;cursor:pointer">Go to Owner</button>
        </div>
      </body>`;
    throw new Error("Plans page requires Owner Dashboard access.");
  }

  /* Remove the token from the visible URL after validating it. */
  if(history.replaceState){
    history.replaceState({}, document.title, location.pathname);
  }
})();
</script>

<script>
    const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const $ = id => document.getElementById(id);

    function escapeHtml(value){
      return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }

    function money(value){
      const n = Number(value || 0);
      return n.toLocaleString("en-IN", {
        maximumFractionDigits: 0
      });
    }

    function showToast(message){
      const el = $("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(
        () => el.classList.remove("show"), 2600
      );
    }

    function normalizeFeatures(features){
      if(!Array.isArray(features)) return [];

      return features.map(item => {
        if(typeof item === "string"){
          return { text:item, enabled:true };
        }
        return {
          text:item?.text || "",
          enabled:item?.enabled !== false
        };
      }).filter(item => item.text);
    }

    function renderPlans(rows){
      const root = $("plans");

      if(!rows.length){
        root.innerHTML = `
          <div class="empty">
            No active plans are available right now.
          </div>`;
        return;
      }

      root.innerHTML = rows.map(plan => {
        const features = normalizeFeatures(plan.features);
        const recommended = plan.is_recommended === true;
        const isFree = plan.plan_type === "free" || Number(plan.monthly_price || 0) === 0;

        const featureHtml = features.map(feature => `
          <li class="${feature.enabled ? "" : "disabled"}">
            <span class="check">${feature.enabled ? "✓" : "×"}</span>
            <span>${escapeHtml(feature.text)}</span>
          </li>
        `).join("");

        const badge = plan.badge_text
          ? `<div class="ribbon">${escapeHtml(plan.badge_text)}</div>`
          : "";

        const setupLabel = plan.setup_fee_label || "One-Time";
        const setupFee = Number(plan.setup_fee || 0);

        const buttonText =
          plan.button_text ||
          (isFree ? "Current Active Plan" : `Upgrade to ${plan.name}`);

        return `
          <article class="plan ${recommended ? "recommended" : ""} ${isFree ? "free" : ""}">
            ${badge}

            <div class="plan-name">${escapeHtml(plan.name)}</div>

            <div class="desc">
              ${escapeHtml(plan.description || "")}
            </div>

            <div class="price-row">
              <span class="currency">₹</span>
              <span class="price">${money(plan.monthly_price)}</span>
              <span class="period">${escapeHtml(plan.period_label || "/ month")}</span>
            </div>

            <div class="setup">
              Setup Fee:
              <strong>₹${money(setupFee)}</strong>
              ${setupLabel ? ` <span>(${escapeHtml(setupLabel)})</span>` : ""}
            </div>

            <ul class="features">
              ${featureHtml || `
                <li>
                  <span class="check">✓</span>
                  <span>Plan details available from FreeMenu</span>
                </li>
              `}
            </ul>

            <button
              class="plan-btn"
              type="button"
              onclick="selectPlan('${escapeHtml(plan.slug)}','${escapeHtml(plan.name)}',${isFree})">
              ${escapeHtml(buttonText)}
            </button>
          </article>
        `;
      }).join("");
    }

    async function loadPlans(){
      $("status").textContent = "Loading plans...";

      const { data, error } = await supabaseClient
        .from("plans")
        .select(`
          id,
          name,
          slug,
          plan_type,
          monthly_price,
          setup_fee,
          period_label,
          setup_fee_label,
          description,
          badge_text,
          button_text,
          qr_stickers_max,
          signature_3d_dishes_max,
          features,
          is_active,
          is_recommended,
          sort_order
        `)
        .eq("is_active", true)
        .order("sort_order", { ascending:true })
        .order("monthly_price", { ascending:true });

      if(error){
        console.error("Plans load error:", error);
        $("status").textContent = "Unable to load plans.";
        $("plans").innerHTML = `
          <div class="empty">
            <strong>Plans could not be loaded.</strong><br><br>
            Please make sure the <b>plans</b> table SQL has been run in Supabase.
          </div>`;
        return;
      }

      $("status").textContent = "";
      renderPlans(data || []);
    }

    function selectPlan(slug, name, isFree){
      if(isFree){
        showToast("This is the Free Starter plan.");
        return;
      }

      /*
        Payment/subscription gateway is not connected here yet.
        This keeps the pricing page independent from payment logic.
        Later the button can call your subscription/payment function
        using the plan slug.
      */
      const params = new URLSearchParams({
        plan: slug
      });

      window.location.href = `../owner.html?upgrade=${encodeURIComponent(slug)}`;
    }

    loadPlans();
  </script>
</body>
</html>
