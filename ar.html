<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeMenu • Signature 3D Upload</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080909;color:#fff;font-family:Inter,Arial,sans-serif}
.wrap{max-width:720px;margin:40px auto;padding:20px}
.card{background:#121415;border:1px solid #343434;border-radius:18px;padding:24px;box-shadow:0 20px 50px #0008}
h1{margin:0 0 6px;color:#f3c65d;font-size:25px}.sub{color:#999;font-size:13px;margin-bottom:24px}
label{display:block;font-size:12px;font-weight:700;color:#ccc;margin:16px 0 7px}
select,input[type=file]{width:100%;height:46px;border:1px solid #444;border-radius:10px;background:#0b0c0d;color:#fff;padding:0 12px}
input[type=file]{padding:11px}
button{width:100%;height:48px;border:0;border-radius:11px;background:linear-gradient(135deg,#ffe08c,#e5a735);color:#111;font-weight:800;cursor:pointer;margin-top:18px}
button:disabled{opacity:.45;cursor:not-allowed}
.status{margin-top:16px;padding:13px;border-radius:10px;background:#0c0d0e;color:#aaa;font-size:13px;line-height:1.5;white-space:pre-wrap}
.preview{margin-top:18px;display:none}.preview model-viewer{width:100%;height:360px;background:#090a0b;border-radius:12px}
.small{font-size:11px;color:#777;margin-top:8px}.url{word-break:break-all;color:#e9bd5b}
</style>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>♛ Signature 3D — GLB Upload</h1>
<div class="sub">GLB file direct select karo. File Cloudflare R2 mein save hogi; browser mein secret R2 key expose nahi hogi.</div>

<label>Restaurant</label>
<select id="restaurantSelect"><option value="">Loading restaurants…</option></select>

<label>Menu Item</label>
<select id="itemSelect" disabled><option value="">Select restaurant first</option></select>

<label>GLB 3D Model</label>
<input id="glbFile" type="file" accept=".glb,model/gltf-binary">
<div class="small">Maximum 20 MB • Only .glb</div>

<button id="uploadBtn" disabled>Upload GLB to Cloudflare R2</button>
<div id="status" class="status">Login check…</div>

<div id="preview" class="preview">
<model-viewer id="viewer" camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look" shadow-intensity="1.5" environment-image="neutral"></model-viewer>
<div class="small">Uploaded GLB preview</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://pfsrpowopbrevocwsuii.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
const FUNCTION_URL=`${SUPABASE_URL}/functions/v1/signature-3d-model-upload`;
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const restaurantSelect=document.getElementById("restaurantSelect");
const itemSelect=document.getElementById("itemSelect");
const glbFile=document.getElementById("glbFile");
const uploadBtn=document.getElementById("uploadBtn");
const status=document.getElementById("status");
const preview=document.getElementById("preview");
const viewer=document.getElementById("viewer");

let session=null;

function setStatus(text){status.textContent=text}

async function init(){
  const {data,error}=await db.auth.getSession();
  if(error||!data.session){
    setStatus("Please login first from FreeMenu Owner dashboard.");
    return;
  }
  session=data.session;
  setStatus("Logged in. Loading your restaurants…");

  const {data:restaurants,error:rError}=await db
    .from("restaurants")
    .select("id,name,owner_id,user_id")
    .order("name");

  if(rError){setStatus("Restaurant load failed: "+rError.message);return}

  restaurantSelect.innerHTML='<option value="">Select restaurant</option>';
  (restaurants||[]).forEach(r=>{
    const o=document.createElement("option");
    o.value=r.id;o.textContent=r.name||r.id;
    restaurantSelect.appendChild(o);
  });
  setStatus("Select restaurant → select menu item → choose GLB → upload.");
}

async function loadItems(){
  itemSelect.disabled=true;
  itemSelect.innerHTML='<option value="">Loading menu items…</option>';
  const rid=restaurantSelect.value;
  if(!rid){itemSelect.innerHTML='<option value="">Select restaurant first</option>';return}

  const {data,error}=await db
    .from("menu_items")
    .select("id,name,ar_enabled,signature_3d,ar_model_url")
    .eq("restaurant_id",rid)
    .order("name");

  if(error){itemSelect.innerHTML='<option value="">Failed to load items</option>';setStatus("Menu item load failed: "+error.message);return}

  itemSelect.innerHTML='<option value="">Select menu item</option>';
  (data||[]).forEach(item=>{
    const o=document.createElement("option");
    o.value=item.id;
    o.textContent=(item.name||"Unnamed")+" — "+(item.ar_model_url?"3D uploaded":"No 3D");
    itemSelect.appendChild(o);
  });
  itemSelect.disabled=false;
  updateButton();
}

function updateButton(){
  uploadBtn.disabled=!(
    session &&
    restaurantSelect.value &&
    itemSelect.value &&
    glbFile.files[0]
  );
}

restaurantSelect.addEventListener("change",loadItems);
itemSelect.addEventListener("change",updateButton);
glbFile.addEventListener("change",()=>{
  const file=glbFile.files[0];
  if(file && !file.name.toLowerCase().endsWith(".glb")){
    glbFile.value="";
    setStatus("Only .glb file allowed.");
  }else if(file && file.size>20*1024*1024){
    glbFile.value="";
    setStatus("GLB must be 20 MB or smaller.");
  }else if(file){
    setStatus(`${file.name} selected (${(file.size/1024/1024).toFixed(2)} MB). Ready to upload.`);
  }
  updateButton();
});

uploadBtn.addEventListener("click",async()=>{
  const file=glbFile.files[0];
  if(!file)return;

  uploadBtn.disabled=true;
  setStatus("Uploading GLB to Cloudflare R2…");

  try{
    const {data:{session:latest},error:sessionError}=await db.auth.getSession();
    if(sessionError||!latest?.access_token)throw new Error("Login session expired. Please login again.");

    const fd=new FormData();
    fd.append("file",file);
    fd.append("restaurant_id",restaurantSelect.value);
    fd.append("menu_item_id",itemSelect.value);
    fd.append("asset_type","glb");

    const response=await fetch(FUNCTION_URL,{
      method:"POST",
      headers:{
        Authorization:`Bearer ${latest.access_token}`,
        apikey:SUPABASE_ANON_KEY
      },
      body:fd
    });

    let result={};
    try{result=await response.json()}catch(e){}

    if(!response.ok)throw new Error(result.error||`Upload failed (${response.status})`);

    if(!result.url)throw new Error("Upload succeeded but no model URL was returned.");

    viewer.removeAttribute("src");
    viewer.setAttribute("src",result.url);
    preview.style.display="block";

    setStatus(
      "✓ GLB uploaded successfully.\n\n"+
      "Saved in Cloudflare R2.\n"+
      "Menu item database updated.\n\n"+
      "Model URL:\n"+result.url
    );

    await loadItems();
    itemSelect.value=itemSelect.value || "";
    glbFile.value="";
  }catch(error){
    setStatus("✕ "+(error?.message||String(error)));
  }finally{
    updateButton();
  }
});

init();
</script>
</body>
</html>
