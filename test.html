<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Video Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
    #ar-btn {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; background: #38bdf8; border: none; border-radius: 30px;
      font-size: 16px; font-weight: bold; color: #080d1a; cursor: pointer; z-index: 10;
    }
    #info {
      position: absolute; top: 20px; width: 100%; text-align: center;
      color: #fff; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div id="info">Tap "View in AR" to place video on your table</div>
  <button id="ar-btn">View in AR</button>

  <!-- Video Element -->
  <video id="arVideo" loop crossorigin="anonymous" playsinline webkit-playsinline style="display:none;">
    <!-- Apni Video ka Link yahan daalein -->
    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
  </video>

  <script>
    let camera, scene, renderer;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let reticle, videoMesh;
    const video = document.getElementById('arVideo');

    const arBtn = document.getElementById('ar-btn');

    // Check WebXR AR Support
    if ('xr' in navigator) {
      navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
        if (!supported) {
          arBtn.innerText = 'AR Not Supported on this Browser';
          arBtn.disabled = true;
        }
      });
    }

    arBtn.addEventListener('click', () => {
      // Mobile me video playback trigger karne ke liye click interaction
      video.play();
      initAR();
    });

    async function initAR() {
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test']
      });

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      await renderer.xr.setSession(session);
      document.body.appendChild(renderer.domElement);

      arBtn.style.display = 'none';

      // Ring indicator (surface detect karne ke liye)
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.1, 0.13, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Video Texture aur 3D Screen banana
      const videoTexture = new THREE.VideoTexture(video);
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;

      // 16:9 Screen Geometry (Width: 0.6m yaani ~2 feet, Height: 0.34m)
      const screenGeo = new THREE.PlaneGeometry(0.6, 0.34);
      const screenMat = new THREE.MeshBasicMaterial({ map: videoTexture, side: THREE.DoubleSide });
      videoMesh = new THREE.Mesh(screenGeo, screenMat);
      videoMesh.visible = false;
      scene.add(videoMesh);

      // Controller tap to place
      const controller = renderer.xr.getController(0);
      controller.addEventListener('select', () => {
        if (reticle.visible) {
          videoMesh.position.setFromMatrixPosition(reticle.matrix);
          // Video ko thoda upar utha kar customer ke face ki taraf tilt karein
          videoMesh.position.y += 0.2;
          videoMesh.quaternion.copy(camera.quaternion);
          videoMesh.visible = true;
          reticle.visible = false;
          document.getElementById('info').innerText = "Video Placed! Walk around to view.";
        }
      });
      scene.add(controller);

      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = frame.session;

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource && !videoMesh.visible) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            reticle.visible = true;
            reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
