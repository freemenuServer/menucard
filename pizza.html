<style>
:root{color-scheme:light;--red:#f3262f;--ink:#101d2c;--muted:#6b7280;--line:#e9edf0;--green:#12813a;--page:#f7f9fb}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.shell{max-width:1100px;margin:auto;background:#fff;min-height:100vh;box-shadow:0 0 35px #10203008}
.cover{height:clamp(150px,29vw,275px);position:relative;background:#282018;overflow:visible}
.cover-photo{display:block;width:100%;height:100%;object-fit:cover}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0004,transparent 65%);pointer-events:none}
.logo{position:absolute;z-index:2;left:22px;bottom:-43px;width:112px;height:112px;border:5px solid #fff;border-radius:50%;background:#151515;box-shadow:0 5px 20px #0002;display:grid;place-items:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.logo-fallback{text-align:center;color:#ffce2e;font-size:12px;font-weight:850;line-height:1.2;padding:10px}
.logo-fallback span{display:block;font-size:25px;margin-bottom:3px}
.profile{min-height:160px;padding:20px 22px 19px 152px;display:flex;align-items:center;justify-content:space-between;gap:18px}
h1{font-size:clamp(22px,3vw,32px);line-height:1.15;letter-spacing:-.8px;margin:0;font-weight:850}
.tagline{color:var(--muted);font-size:15px;margin:7px 0 0}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:9px 13px;margin-top:13px;color:#626b75;font-size:13px}
.status{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:30px;background:#ddf8e5;color:#14753a;font-weight:750}
.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.closed{background:#fee9e7;color:#b42318}
.address{display:flex;gap:7px;align-items:center}
.contact-details{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px}
.contact-label{font-size:12px;color:var(--muted);font-weight:700}
.call-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:39px;padding:9px 15px;border:1px solid #dce3e9;border-radius:12px;background:#fff;color:var(--ink);font-size:13px;font-weight:750;text-decoration:none;box-shadow:0 2px 8px #10203008;transition:background .15s}
.call-button:active{background:#f3f6f8}
.menu{padding:8px 20px 30px}
.filters{display:flex;gap:9px;overflow-x:auto;padding:5px 0 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 auto;border:1px solid #edf0f2;border-radius:99px;background:#f4f5f6;color:#222a32;padding:10px 16px;font-size:13px;font-weight:750;white-space:nowrap;cursor:pointer}
.filter.active{background:var(--red);border-color:var(--red);color:white;box-shadow:0 5px 13px #f3262f20}
.filter-icon{display:none;width:25px;height:25px;flex:0 0 25px}.filter-label{display:inline}.filter-symbol{display:inline}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 0 13px}
.heading h2{font-size:20px;letter-spacing:-.4px;margin:0;font-weight:850}
.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{min-width:0;display:flex;align-items:stretch;gap:13px;padding:9px;border:1px solid var(--line);border-radius:17px;background:white;box-shadow:0 3px 14px #14263808}
.thumb{flex:0 0 37%;width:37%;min-width:80px;max-width:180px;aspect-ratio:1/1;align-self:center;overflow:hidden;border-radius:12px;background:#fff0df}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.details{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1;padding:3px 0}
.name-row{display:flex;align-items:center;gap:8px;width:100%}
.name{font-size:15px;font-weight:850;line-height:1.35;overflow-wrap:anywhere}
.veg{width:17px;height:17px;flex:0 0 17px;border:1.5px solid #13843a;border-radius:3px;display:inline-grid;place-items:center}
.veg:after{content:"";width:8px;height:8px;background:#13843a;border-radius:50%}
.veg.nonveg{border-color:#c62832}.veg.nonveg:after{background:#c62832}
.special{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:6px;background:#ffedb0;color:#7a4300;font-size:10px;font-weight:850}
.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;width:100%}.item-top .name-row{flex:1;min-width:0}.price{flex:0 0 auto;text-align:right;font-size:19px;font-weight:850;color:var(--red);line-height:1.2;margin:0 0 0 auto;white-space:nowrap}.price-portions{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px}.price-portions span{white-space:nowrap}.pizza-prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:5px;width:100%;max-width:330px}.pizza-prices span{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;background:#fff3f3;border:1px solid #ffe0e0;border-radius:8px;padding:6px 3px;font-size:14px;font-weight:850;color:var(--red)}.price-portions small{font-size:10px;color:#777;font-weight:700}.price-unavailable{font-size:11px;color:#777;font-weight:650;white-space:normal;max-width:100px}
.desc{font-size:12px;line-height:1.5;color:var(--muted);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;text-align:center;padding:40px 15px;color:var(--muted)}
footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#eff6fd;padding:20px;color:#26384b;font-size:13px}
.footer-info{display:flex;flex-wrap:wrap;gap:12px 20px}
.powered strong{font-size:17px;color:#111d2b;letter-spacing:-.6px}.powered strong span{color:var(--red)}

 .cover{height:165px}.logo{width:88px;height:88px;left:15px;bottom:-34px;border-width:4px}

 .heading h2{font-size:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .card{flex-direction:column;gap:8px;padding:7px;border-radius:13px}
 .thumb{width:100%;flex:0 0 auto;max-width:none;min-width:0;aspect-ratio:1/1;align-self:stretch}
 .details{width:100%;padding:1px 1px 2px}
 .item-top{flex-direction:column;gap:5px}.item-top .name-row{width:100%}.price{margin:0;text-align:left;font-size:22px}.price-portions{order:-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;width:100%;font-size:16px;font-weight:900;gap:6px}.pizza-prices{grid-template-columns:repeat(3,minmax(0,1fr));max-width:none;font-size:13px;gap:4px}.pizza-prices span{padding:6px 1px;font-size:13px}.pizza-prices small{font-size:10px!important}.price-portions span{display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;background:#fff3f3;border:1px solid #ffe0e0;border-radius:8px;padding:5px 2px}.price-portions small{font-size:12px;color:#777;font-weight:800}.price-unavailable{max-width:100%}
 .name{font-size:13px;line-height:1.3}.veg{width:14px;height:14px;flex-basis:14px}.veg:after{width:6px;height:6px}.desc{font-size:11px;line-height:1.4;margin-top:5px;-webkit-line-clamp:2}
 footer{padding:17px 14px;font-size:12px}
}
@media(max-width:350px){.card{gap:7px;padding:6px}.name{font-size:12px}.price{font-size:20px}.price-portions{font-size:14px}.price-portions small{font-size:11px}.filters{gap:6px;padding-left:8px;padding-right:8px}.filter{padding:8px 11px;font-size:11px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* FreeMenu clickable brand links */
.powered a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}

</style>

<script>
"use strict";

const SUPABASE_URL="https://pfsrpowopbrevocwsuii.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
/* Real restaurant and menu data are loaded by URL slug from Supabase. */
let restaurant = {name:"Loading menu…",tagline:"",address:"",hours:"",phone:"",openHour:0,closeHour:24,coverImage:"",logo:""};
let menuItems = [];

let categories = [{name:"All",icon:"▦"},{name:"Today's Special",icon:"☆"}];
const state = {category:"All"};
const $ = s => document.querySelector(s);

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function foodPlaceholder(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <rect width="160" height="160" rx="18" fill="#fff0df"/>
  <circle cx="80" cy="78" r="51" fill="#ffe0b9"/>
  <ellipse cx="80" cy="95" rx="38" ry="11" fill="#e9bb84" opacity=".55"/>
  <path d="M42 77Q45 108 80 109Q115 108 118 77Z" fill="#fffaf1" stroke="#c98d56" stroke-width="3"/>
  <ellipse cx="80" cy="77" rx="38" ry="14" fill="#f8d2a0" stroke="#c98d56" stroke-width="3"/>
  <path d="M62 70Q80 58 98 70M58 81H102" fill="none" stroke="#d99c4b" stroke-width="4" stroke-linecap="round"/>
  <path d="M48 37V52M43 37V46M53 37V46" stroke="#cf8950" stroke-width="3" stroke-linecap="round"/>
  <path d="M111 36Q122 45 112 54Q102 46 111 36Z" fill="#71a56a"/>
  </svg>`;
  return "data:image/svg+xml,"+encodeURIComponent(svg);
}
const placeholder = foodPlaceholder();

function loadImage(img,url){
  img.onerror = () => {
    img.onerror = null;
    img.src = placeholder;
  };
  img.src = url || placeholder;
  if(!url) img.onerror = null;
}
function setupRestaurant(){
  $("#restaurantName").textContent=restaurant.name;
  $("#tagline").textContent=restaurant.tagline;
  $("#address").textContent=restaurant.address;
  $("#footerAddress").textContent=restaurant.address;
  $("#hours").textContent=restaurant.hours;
  $("#footerHours").textContent=restaurant.hours;
  const phoneDigits=String(restaurant.phone).replace(/\D/g,"");
  $("#callLink").href="tel:"+phoneDigits;
  $("#phoneDisplay").textContent=restaurant.phone;
  loadImage($("#cover"),restaurant.coverImage);
  if(restaurant.logo){
    const logo=$("#logo");
    logo.hidden=false;
    $("#logoFallback").hidden=true;
    logo.onerror=()=>{
      logo.hidden=true;
      $("#logoFallback").hidden=false;
    };
    logo.src=restaurant.logo;
  }
  updateStatus();
}
function updateStatus(){
  const hour=new Date().getHours();
  const open=restaurant.openHour, close=restaurant.closeHour;
  const isOpen=open<close ? hour>=open&&hour<close : hour>=open||hour<close;
  $("#status").textContent=isOpen?"Open Now":"Closed";
  $("#status").classList.toggle("closed",!isOpen);
}
function categorySvg(name){
  const n=String(name||"").toLowerCase();
  let art;
  if(n==="all") art='<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>';
  else if(n.includes("special")) art='<path d="m12 2.8 2.8 5.7 6.3.9-4.55 4.45 1.08 6.25L12 17.15l-5.63 2.95 1.08-6.25L2.9 9.4l6.3-.9Z"/>';
  else if(/drink|beverage|juice|coffee|tea|shake|cold/.test(n)) art='<path d="M6 4h12l-1 16H7L6 4Z"/><path d="M8 8h8M14 2l-3 7"/><path d="M18 6h2a2 2 0 0 1 0 4h-2"/>';
  else if(/pizza/.test(n)) art='<path d="M3 7 21 3 14 21 3 7Z"/><path d="m3 7 11 14M8 8l8-2"/><circle cx="10" cy="11" r="1"/><circle cx="14" cy="14" r="1"/>';
  else if(/burger|sandwich|wrap|roll/.test(n)) art='<path d="M3 10a9 7 0 0 1 18 0H3Z"/><path d="M3 12h18M4 15h16M5 18h14"/><path d="M7 8h.1M12 6h.1M16 8h.1"/>';
  else if(/dessert|sweet|cake|ice.?cream|mithai|kulfi/.test(n)) art='<path d="M4 13h16l-2 7H6l-2-7Z"/><path d="M4 13c0-2 2-3 4-2 1-4 7-4 8 0 2-1 4 0 4 2"/><path d="M12 3v3M10 4h4"/>';
  else if(/rice|biryani|pulao|fried rice/.test(n)) art='<path d="M3 12a9 7 0 0 0 18 0H3Z"/><path d="M5 10c2-3 4 1 6-2s4 2 7-1"/><path d="M6 16h12"/>';
  else if(/bread|roti|naan|paratha|chapati/.test(n)) art='<ellipse cx="12" cy="12" rx="9" ry="7"/><path d="M7 10c2-2 3 2 5 0s3 1 5-1M8 14h8"/><circle cx="10" cy="8" r=".7"/>';
  else if(/soup/.test(n)) art='<path d="M4 12h16a8 8 0 0 1-16 0Z"/><path d="M7 8c-2-2 2-2 0-4M12 8c-2-2 2-2 0-4M17 8c-2-2 2-2 0-4"/>';
  else if(/salad|healthy|fruit/.test(n)) art='<path d="M4 13a8 8 0 0 0 16 0H4Z"/><path d="M12 13c-5-1-5-6-2-7 3 0 4 3 2 7ZM12 13c0-5 4-7 6-4 1 3-2 5-6 4Z"/>';
  else if(/noodle|chinese|pasta|momo|manchurian/.test(n)) art='<path d="M4 13h16a8 7 0 0 1-16 0Z"/><path d="M7 5c4 0 1 4 5 4s1-4 5-4M7 8c4 0 1 4 5 4s1-4 5-4"/>';
  else if(/starter|snack|chaat|pakora|samosa|tikki|fries/.test(n)) art='<path d="M3 13a9 7 0 0 0 18 0H3Z"/><circle cx="8" cy="10" r="1.5"/><circle cx="13" cy="8" r="1.5"/><circle cx="16" cy="11" r="1.5"/>';
  else art='<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="6"/><path d="M5 9h14M7 16h10"/>';
  return `<svg class="filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${art}</svg>`;
}
function renderFilters(){
  $("#filters").innerHTML=categories.map(c=>{
    const active=state.category===c.name;
    return `<button type="button" class="filter${active?" active":""}" data-category="${escapeHTML(c.name)}" aria-pressed="${active}"><span class="filter-symbol">${c.icon}&nbsp; </span>${categorySvg(c.name)}<span class="filter-label">${escapeHTML(c.name)}</span></button>`;
  }).join("");
}
function getVisibleItems(){
  if(state.category==="All") return menuItems;
  if(state.category==="Today's Special") return menuItems.filter(item=>item.special);
  return menuItems.filter(item=>item.category===state.category);
}
function renderMenu(){
  const items=getVisibleItems();
  $("#heading").textContent=state.category==="All"?"Popular Menu":state.category;
  $("#count").textContent=`${items.length} ${items.length===1?"item":"items"}`;
  if(!items.length){
    $("#grid").innerHTML='<div class="empty">No items in this category yet.</div>';
    return;
  }
  $("#grid").innerHTML=items.map(item=>`
    <article class="card">
      <div class="thumb">
        <img src="${item.image?escapeHTML(item.image):placeholder}" alt="${escapeHTML(item.name)}" width="220" height="220" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${placeholder}'">
      </div>
      <div class="details">
        <div class="item-top">
          <div class="name-row">
            <span class="name">${escapeHTML(item.name)}</span>
            <span class="veg${item.veg?"":" nonveg"}" role="img" aria-label="${item.veg?"Vegetarian":"Non-vegetarian"}" title="${item.veg?"Vegetarian":"Non-vegetarian"}"></span>
          </div>
          ${renderItemPrices(item)}
        </div>
        ${item.special?'<span class="special">★ SPECIAL</span>':""}
        <p class="desc">${escapeHTML(item.description)}</p>
      </div>
    </article>`).join("");
}
$("#filters").addEventListener("click",event=>{
  const button=event.target.closest("[data-category]");
  if(!button)return;
  state.category=button.dataset.category;
  renderFilters();
  renderMenu();
});
function slugFromUrl(){const u=new URL(location.href);let slug=(u.searchParams.get("r")||u.searchParams.get("slug")||"").trim();if(!slug){const parts=location.pathname.split("/").filter(Boolean);const i=parts.findIndex(x=>x.toLowerCase()==="menu");if(i>=0&&parts[i+1])slug=decodeURIComponent(parts[i+1]);}return slug;}
function firstValue(obj,keys,fallback=""){for(const k of keys){if(obj&&obj[k]!==undefined&&obj[k]!==null&&String(obj[k]).trim()!=="")return obj[k]}return fallback}
function asBool(v){if(typeof v==="boolean")return v;return ![false,0,"0","false","no","non-veg","non veg"].includes(String(v??"").toLowerCase())}
function priceNumber(value){if(value===null||value===undefined||String(value).trim()==="")return null;const cleaned=String(value).replace(/[^0-9.]/g,"");if(!cleaned)return null;const n=Number(cleaned);return Number.isFinite(n)?n:null}
function formatPrice(value){const n=priceNumber(value);return n===null?"":`₹${n.toLocaleString("en-IN")}`}
function isPizzaItem(item){return /\bpizza\b/i.test(String(item.name||""))||/\bpizza\b/i.test(String(item.category||""));}
function renderItemPrices(item){
  if(isPizzaItem(item)){
    const sizes=[["S",item.price_small], ["M",item.price_medium], ["L",item.price_large]];
    // Always show all three sizes together; missing prices are visibly marked with —.
    return `<div class="price price-portions pizza-prices" aria-label="Small, Medium and Large prices">${sizes.map(([label,value])=>`<span><small>${label}</small> ${priceNumber(value)!==null?formatPrice(value):"—"}</span>`).join("")}</div>`;
  }
  const portions=[["Half",item.price_half],["Full",item.price_full],["Quarter",item.price_quarter]].filter(([,v])=>priceNumber(v)!==null);
  if(portions.length){return `<div class="price price-portions">${portions.map(([label,value])=>`<span><small>${label}</small> ${formatPrice(value)}</span>`).join("")}</div>`;}
  const price=priceNumber(firstValue(item,["price","price_full","full_price","selling_price","amount"],null));
  return price===null?'<div class="price price-unavailable">Price unavailable</div>':`<div class="price">${formatPrice(price)}</div>`;
}
function mapMenuItem(row){const cat=String(firstValue(row,["category","category_name","menu_category","section"],"Other"));return {id:row.id,name:String(firstValue(row,["name","item_name","title"],"Menu item")),category:cat,price:firstValue(row,["price","price_full","full_price","selling_price","amount"],null),price_quarter:firstValue(row,["price_quarter","quarter_price","price_qtr"],null),price_half:firstValue(row,["price_half","half_price"],null),price_full:firstValue(row,["price_full","full_price"],null),price_small:firstValue(row,["price_small","small_price"],null),price_medium:firstValue(row,["price_medium","medium_price","price_med"],null),price_large:firstValue(row,["price_large","large_price"],null),veg:asBool(firstValue(row,["is_veg","veg","vegetarian","item_type"],true)),description:String(firstValue(row,["description","desc","details"],"")),image:String(firstValue(row,["image_url","image","photo_url","photo","image_path"],"")),special:asBool(firstValue(row,["is_special","special","is_featured","featured"],false))}}
function groupPizzaVariants(items){
  const result=[], groups=new Map();
  const sizePattern=/\s*(?:\(|\[|[-–—])?\s*(small|medium|large|\bs\b|\bm\b|\bl\b)\s*(?:size)?\s*[)\]]?\s*$/i;
  const sizeKey=value=>{const v=String(value||"").toLowerCase();return /^(small|s)$/.test(v)?"small":/^(medium|m)$/.test(v)?"medium":/^(large|l)$/.test(v)?"large":null};
  for(const item of items){
    const match=String(item.name||"").match(sizePattern), size=match?sizeKey(match[1]):null;
    if(!size){result.push(item);continue;}
    const baseName=String(item.name).replace(sizePattern,"").trim();
    const key=(baseName+"|"+String(item.category||"")).toLowerCase();
    let group=groups.get(key);
    if(!group){group={...item,name:baseName||item.name,price_small:null,price_medium:null,price_large:null,_pizzaVariantGroup:true};groups.set(key,group);result.push(group);}
    const value=firstValue(item,["price_small","small_price","price_medium","medium_price","price_large","large_price","price_full","full_price","price","selling_price","amount"],null);
    // Prefer the price belonging to the size encoded in the item's name.
    group[{small:"price_small",medium:"price_medium",large:"price_large"}[size]]=firstValue(item,["price","price_full","full_price","selling_price","amount",`price_${size}`,`${size}_price`],value);
    if(!group.image&&item.image)group.image=item.image;
    if(!group.description&&item.description)group.description=item.description;
  }
  return result;
}
async function loadRealMenu(){
  try{
    const slug=slugFromUrl();if(!slug)throw new Error("Restaurant URL slug missing");
    let rq=supabaseClient.from("restaurants").select("*");
    rq=rq.eq("slug",slug);
    let {data:rows,error}=await rq.limit(1);if(error)throw error;
    if(!rows?.length){const {data:byId,error:idError}=await supabaseClient.from("restaurants").select("*").eq("id",slug).limit(1);if(idError)throw idError;rows=byId}
    if(!rows?.length)throw new Error("Restaurant not found");
    const r=rows[0];
    const open=firstValue(r,["opening_time","open_time","opening_hours_start","opening_hour"],"");
    const close=firstValue(r,["closing_time","close_time","opening_hours_end","closing_hour"],"");
    const fmt=t=>{if(t===undefined||t===null||t==="")return "";const m=String(t).match(/(\d{1,2}):(\d{2})/);if(!m)return String(t);let h=+m[1],min=m[2],ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${min} ${ap}`};
    const hours=firstValue(r,["opening_hours","business_hours","hours"],(open&&close)?`${fmt(open)} – ${fmt(close)}`:"");
    restaurant={name:String(firstValue(r,["name","restaurant_name"],"Restaurant")),tagline:String(firstValue(r,["tagline","description","subtitle_text"],"Explore our menu")),address:String(firstValue(r,["address","full_address","location"],"")),hours:String(hours),phone:String(firstValue(r,["phone","phone_number","contact_number"],"")),openHour:Number(String(open).split(":")[0])||0,closeHour:Number(String(close).split(":")[0])||24,coverImage:String(firstValue(r,["banner_url","cover_url","cover_image","banner_image"],"")),logo:String(firstValue(r,["logo_url","logo","logo_image"],""))};
    const {data:rowsItems,error:itemsError}=await supabaseClient.from("menu_items").select("*").eq("restaurant_id",r.id);
    if(itemsError)throw itemsError;
    menuItems=groupPizzaVariants((Array.isArray(rowsItems)?rowsItems:[]).filter(x=>x.is_available!==false&&x.available!==false&&x.is_active!==false).sort((a,b)=>Number(a.sort_order??a.position??999999)-Number(b.sort_order??b.position??999999)).map(mapMenuItem));
    categories=[{name:"All",icon:"▦"},...Array.from(new Set(menuItems.map(x=>x.category).filter(Boolean))).map(name=>({name,icon:"◉"})),...(menuItems.some(x=>x.special)?[{name:"Today's Special",icon:"☆"}]:[])];
    state.category="All";document.title=`${restaurant.name} Menu | FreeMenu`;
    const md=document.querySelector('meta[name="description"]');if(md)md.content=`View ${restaurant.name} menu, pizza sizes and prices on FreeMenu.`;
    setupRestaurant();renderFilters();renderMenu();
    if(!menuItems.length)$("#grid").innerHTML='<div class="empty">This restaurant has not added menu items yet.</div>';
  }catch(err){console.error("Cart menu load failed",err);$("#restaurantName").textContent="Menu unavailable";$("#tagline").textContent="We could not load this restaurant menu.";$("#grid").innerHTML='<div class="empty">Unable to load the restaurant menu. Please refresh or try again later.</div>';$("#filters").innerHTML="";}
}
loadRealMenu();
</script>
