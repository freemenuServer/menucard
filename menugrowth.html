<!DOCTYPE html>
<html lang="en">
<head>

  <style>

      --brand-dark:#7d0e16;

    .app{max-width:1180px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 50px rgba(0,0,0,.06)}

    .hero{position:relative;min-height:320px;color:#fff;overflow:hidden;background:

    .brand-row{display:flex;align-items:center;gap:18px}
    .logo{width:78px;height:78px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:37px;background:rgba(159,22,32,.55);backdrop-filter:blur(5px)}

    .toolbar{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);padding:6px 0 16px}
    .cats{display:flex;gap:10px;overflow:auto;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
    .cat{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.04);font-weight:600}
    .cat.active{background:var(--brand);border-color:var(--brand);color:#fff}
    .search{position:relative}.search input{width:100%;padding:14px 16px 14px 44px;border:1px solid var(--line);border-radius:14px;background:#fafbfc;outline:none}.search input:focus{border-color:#d7a7aa;box-shadow:0 0 0 4px rgba(159,22,32,.08)}
    .search:before{content:'⌕';position:absolute;left:16px;top:8px;font-size:25px;color:#667085}

    .section{margin-top:28px}.section-head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:14px}.section h2{font-family:"Playfair Display",serif;font-size:34px;margin:0}.section-sub{color:var(--muted);font-size:14px}.see-all{font-weight:700;color:var(--brand);border:none;background:none}

    .popular-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .food-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.045);display:flex;flex-direction:column;min-width:0}
    .food-image{position:relative;height:175px;background:#eee}.food-image img{height:100%}.food-card.no-photo .food-image{display:none}.food-card.no-photo{display:block}.dish-row.no-photo{grid-template-columns:1fr}.dish-row.no-photo .dish-main{grid-column:1}.badge{position:absolute;left:10px;top:10px;padding:6px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:800}.badge.red{background:#e82d2d}.badge.gold{background:#ffca38;color:#3b2d00}.type-icon{position:absolute;right:10px;top:10px;width:25px;height:25px;border:2px solid currentColor;border-radius:3px;background:#fff;display:grid;place-items:center}.type-icon:after{content:'';width:10px;height:10px;border-radius:50%;background:currentColor}.veg{color:#10a957}.nonveg{color:#e22a2a}.egg{color:#f3b51b}
    .food-body{padding:13px;display:flex;flex-direction:column;gap:8px;flex:1}.food-title{font-family:"Playfair Display",serif;font-size:19px;font-weight:700}.food-desc{font-size:13px;line-height:1.45;color:#626a76;min-height:38px}.food-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.price-variants{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}.price-option{display:inline-flex;align-items:center;gap:4px;border:1px solid #f0dfe0;background:#fffafa;border-radius:8px;padding:5px 7px;color:#8f151e;white-space:nowrap}.price-option small{font-size:10px;color:#737783;font-weight:700}.price-option strong{font-size:13px;font-weight:800}.price-variants-list{margin-top:7px}.price-variants-list .price-option{padding:4px 6px}.price-variants-list .price-option strong{font-size:12px}.price{font-size:22px;font-weight:800;color:#9b141d}.add{border:none;border-radius:999px;background:linear-gradient(135deg,var(--brand),#b62431);color:#fff;padding:10px 17px;font-weight:800}

    .list-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.dish-row{border:1px solid var(--line);border-radius:16px;padding:9px;display:grid;grid-template-columns:118px 1fr auto;gap:14px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.035)}.dish-row img{height:105px;border-radius:11px}.dish-main{min-width:0}.dish-name-line{display:flex;align-items:center;gap:9px}.mini-type{width:22px;height:22px;border:2px solid currentColor;border-radius:3px;display:grid;place-items:center;flex:0 0 auto}.mini-type:after{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}.dish-title{font-family:"Playfair Display",serif;font-size:18px;font-weight:700}.dish-desc{font-size:13px;line-height:1.45;color:#667085;margin:6px 0 8px}.dish-price{font-size:20px;font-weight:800;color:#9b141d}.dish-row .add{align-self:end;margin-bottom:4px}

    .bottom-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(1180px,100%);z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 22px;display:grid;grid-template-columns:230px 1fr 270px;align-items:center;gap:14px;box-shadow:0 -10px 28px rgba(0,0,0,.06)}
    .whatsapp{border:none;border-radius:12px;color:#fff;font-weight:700;padding:10px 14px;background:#25D366;display:flex;align-items:center;justify-content:center;gap:8px;min-height:42px;box-shadow:0 6px 16px rgba(37,211,102,.22);transition:.2s ease}.whatsapp:hover{background:#20bd5a;transform:translateY(-1px)}.whatsapp:active{transform:translateY(0)}.whatsapp svg{width:21px;height:21px;fill:currentColor;stroke:none;flex:0 0 21px}

    /* Compact floating WhatsApp button on desktop and mobile */
    .bottom-bar{position:static;left:auto;bottom:auto;transform:none;width:auto;display:block;padding:0;margin:0;background:transparent;border:0;box-shadow:none;backdrop-filter:none;z-index:auto}
    .bottom-bar .whatsapp{position:fixed;right:20px;bottom:20px;z-index:40;width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;font-size:0;gap:0;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(37,211,102,.32)}
    .bottom-bar .whatsapp span{display:none}
    .bottom-bar .whatsapp svg{width:24px;height:24px;flex:0 0 24px}

    .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:900px){
      .hero-inner{grid-template-columns:1fr;padding:32px 24px}.hero-right{display:none}.brand h1{font-size:45px}.content{padding:18px 18px 118px}.toolbar{grid-template-columns:1fr}.popular-grid{grid-template-columns:repeat(2,1fr)}.list-grid{grid-template-columns:1fr}.bottom-bar{grid-template-columns:1fr}.nav-actions{display:none}.whatsapp{display:block}.section h2{font-size:30px}
    }
    @media(max-width:560px){
      .hero{min-height:285px}.hero-inner{min-height:285px;padding:28px 18px}.logo{width:62px;height:62px;font-size:30px}.brand h1{font-size:36px}.tagline{letter-spacing:3px}.info{gap:9px 14px;font-size:12px}.quote{font-size:19px}.content{border-radius:22px 22px 0 0;margin-top:-18px;padding:14px 12px 110px}.popular-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.food-image{height:135px}.food-body{padding:10px}.food-title{font-size:16px}.food-desc{font-size:12px;min-height:auto}.food-bottom{align-items:flex-end}.price{font-size:18px}.add{padding:9px 12px;font-size:13px}.section h2{font-size:27px}.section-head{align-items:center}.section-sub{display:none}.dish-row{grid-template-columns:92px 1fr;gap:10px}.dish-row img{height:90px}.dish-title{font-size:16px}.dish-desc{font-size:12px;padding-right:6px}.bottom-bar{position:static;display:block;width:auto;padding:0;box-shadow:none;border:0;background:transparent;backdrop-filter:none}.bottom-bar .whatsapp{position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:41;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;font-size:0;gap:0;box-shadow:0 4px 14px rgba(37,211,102,.34)}.bottom-bar .whatsapp svg{width:23px;height:23px;flex-basis:23px}.toolbar{display:flex;flex-direction:column;align-items:stretch;gap:12px}.toolbar #categoryTabs{display:flex!important}.toolbar .search{width:100%}.cats{position:fixed!important;left:0;right:0;bottom:0;z-index:40;display:flex!important;gap:8px;overflow-x:auto;overflow-y:hidden;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid #e7e9ed;box-shadow:0 -5px 20px rgba(0,0,0,.08);scroll-snap-type:x proximity}.cats .cat{flex:0 0 auto;padding:10px 13px;border-radius:999px;font-size:13px;scroll-snap-align:start}.content{padding-bottom:calc(112px + env(safe-area-inset-bottom))}.whatsapp span{display:none}
    }


    .category-icon{display:none;width:19px;height:19px;flex:0 0 19px}
    @media(max-width:560px){
      #categoryTabs .cat{display:inline-flex!important;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 13px!important;border-radius:999px;font-weight:700}
      #categoryTabs .category-icon{display:block}
      #categoryTabs .cat.active .category-icon{filter:drop-shadow(0 1px 1px rgba(0,0,0,.08))}
    }

    /* Reliable mobile bottom category dock: keep it attached to viewport */
    @media (max-width: 560px) {
      .toolbar { position: relative !important; top: auto !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; transform: none !important; overflow: visible !important; }
      #categoryTabs.cats { position: fixed !important; inset: auto 0 0 0 !important; width: 100% !important; max-width: 100vw !important; min-height: 58px; box-sizing: border-box !important; display: flex !important; flex-wrap: nowrap !important; align-items: center !important; gap: 8px !important; overflow-x: auto !important; overflow-y: hidden !important; padding: 9px 12px calc(9px + env(safe-area-inset-bottom)) !important; background: #fff !important; border-top: 1px solid #e7e9ed !important; box-shadow: 0 -5px 20px rgba(0,0,0,.10) !important; z-index: 9999 !important; visibility: visible !important; opacity: 1 !important; }
      #categoryTabs .cat { display: inline-flex !important; flex: 0 0 auto !important; visibility: visible !important; }
      .content { padding-bottom: calc(90px + env(safe-area-inset-bottom)) !important; }
    }
  </style>

<body>

<script>
  // Growth / Photos template: photo_menu_v1
  const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let restaurant=null, menuData=[], categories=['All Items'], selectedCategory='All Items';
  const $=id=>document.getElementById(id);
  const esc=(v='')=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  const safeUrl=v=>{if(!v)return '';try{const u=new URL(v,location.origin);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch(_){return '';}};
  const money=v=>{if(v===null||v===undefined||String(v).trim()==='')return '';const n=Number(v);return Number.isFinite(n)?'₹'+n.toLocaleString('en-IN'):'';};
  // Supports common Owner Dashboard / Supabase names for quarter, half and full prices.
  const firstPrice=(item,keys)=>{for(const k of keys){const v=item?.[k];if(v!==null&&v!==undefined&&String(v).trim()!==''&&Number.isFinite(Number(v)))return v;}return null;};
  function priceDisplay(item,baseClass='price'){
    const variants=[
      ['Quarter',firstPrice(item,['price_quarter','quarter_price','quarterPrice','quarter','quarter_amount','price_quarter_plate','price_small'])],
      ['Half',firstPrice(item,['price_half','half_price','halfPrice','half','half_amount','price_half_plate','price_medium'])],
      ['Full',firstPrice(item,['price_full','full_price','fullPrice','full','full_amount','price_full_plate','price_large'])]
    ].filter(([,v])=>v!==null);
    if(variants.length)return `<div class="price-variants ${baseClass==='dish-price'?'price-variants-list':''}">${variants.map(([label,value])=>`<span class="price-option"><small>${label}</small><strong>${money(value)}</strong></span>`).join('')}</div>`;
    const single=firstPrice(item,['price','selling_price','amount','base_price']);
    return `<span class="${baseClass}">${money(single)}</span>`;
  }
  const typeValue=i=>{const t=String(i.item_type||i.type||'').toLowerCase();if(t==='egg')return 'egg';if(t==='nonveg'||i.is_veg===false)return 'nonveg';return 'veg';};
  const badgeValue=i=>i.is_bestseller===true||i.bestseller===true?'Bestseller':i.is_recommended===true||i.recommended===true?'Recommended':i.is_spicy===true||i.spicy===true?'Spicy':'';
  const imageValue=i=>safeUrl(i.image_url||i.photo_url||i.image||i.photo);
  const categoryKey=i=>String(i.category||'General').trim()||'General';
  function categoryOrder(){const names=[...new Set(menuData.map(categoryKey))],saved=Array.isArray(restaurant?.category_order)?restaurant.category_order.map(String):[],rank=new Map(saved.map((x,i)=>[x,i]));return names.sort((a,b)=>(rank.has(a)?rank.get(a):999999)-(rank.has(b)?rank.get(b):999999)||a.localeCompare(b));}
  function renderRestaurant(){
    const banner=safeUrl(restaurant?.banner_url||restaurant?.cover_url||restaurant?.cover_image||restaurant?.hero_image||restaurant?.banner);
    const hero=$('.hero');
    if(hero){
      hero.style.backgroundImage = banner
        ? `linear-gradient(90deg,rgba(5,5,5,.86) 0%,rgba(5,5,5,.68) 42%,rgba(5,5,5,.20) 72%,rgba(5,5,5,.36) 100%),url("${banner}")`
        : 'linear-gradient(90deg,rgba(5,5,5,.92),rgba(5,5,5,.55))';
    }
    const name=restaurant?.name||'Restaurant';document.title=`${name} • Menu`;$('restaurantName').textContent=name;
    const logo=safeUrl(restaurant?.logo_url);$('restaurantLogo').innerHTML=logo?`<img src="${esc(logo)}" alt="${esc(name)}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" onerror="this.parentElement.textContent='♨'">`:'♨';
    $('restaurantTagline').textContent=restaurant?.tagline||restaurant?.subtitle_text||'GOOD FOOD • GOOD MOOD';
    $('restaurantAddress').textContent=restaurant?.address?`📍 ${restaurant.address}`:'';
    const fmt=v=>{if(!v)return '';const [hh,mm='0']=String(v).split(':'),n=Number(hh);if(!Number.isFinite(n))return '';return `${String(n%12||12).padStart(2,'0')}:${String(mm).padStart(2,'0')} ${n>=12?'PM':'AM'}`;};
    const op=fmt(restaurant?.opening_time),cl=fmt(restaurant?.closing_time);$('restaurantHours').textContent=op&&cl?`◷ ${op} - ${cl}`:'';
    const ph=String(restaurant?.phone||'').trim();if(ph){$('restaurantPhone').href=`tel:${ph.replace(/[^\d+]/g,'')}`;$('restaurantPhone').textContent=`☎ ${ph}`;}else{$('restaurantPhone').style.display='none';}
    $('restaurantQuote').textContent=restaurant?.slogan_1||restaurant?.welcome_text||'Food Brings People Together';
  }
  const typeIcon=(type,mini=false)=>`<span class="${mini?'mini-type':'type-icon'} ${type}"></span>`;
  const badgeHTML=b=>b?`<span class="badge ${b==='Bestseller'||b==='Recommended'?'red':'gold'}">${esc(b)}</span>`:'';
  
  function categorySvg(category){
    const c=String(category||'').toLowerCase();
    let path='M4 6h16M4 12h16M4 18h16';
    if(c.includes('all')) path='M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z';
    else if(/starter|snack|appetiz|chaat/.test(c)) path='M4 8h16l-2 11H6L4 8ZM8 5l2-2m4 2 2-2M8 12h.01M12 12h.01M16 12h.01';
    else if(/main|curry|gravy|meal|thali/.test(c)) path='M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18';
    else if(/bread|roti|naan|rice|biryani/.test(c)) path='M4 8c0-3 3-5 8-5s8 2 8 5-3 5-8 5-8-2-8-5ZM4 8v8c0 3 3 5 8 5s8-2 8-5V8M4 12c0 3 4 5 8 5s8-2 8-5';
    else if(/dessert|sweet|cake|ice cream/.test(c)) path='M5 10h14l-1 10H6L5 10ZM4 7h16v3H4zM8 7c-2-3 2-3 1-5m6 5c-2-3 2-3 1-5';
    else if(/drink|beverage|juice|coffee|tea|shake/.test(c)) path='M6 3h12l-1 18H7L6 3ZM8 7h8M9 11h6M12 3V1';
    else if(/pizza/.test(c)) path='M3 5 21 2 13 22 3 5ZM5 8l9-2M9 13h.01M13 16h.01M16 9h.01';
    return `<svg class="category-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${path}"/></svg>`;
  }
  function renderTabs(){$('categoryTabs').innerHTML=categories.map(c=>`<button class="cat ${selectedCategory===c?'active':''}" onclick="selectCategory('${c.replace(/'/g,"\\'")}')">${categorySvg(c)}<span>${esc(c)}</span></button>`).join('');}
  function filteredItems(){const q=$('searchInput').value.trim().toLowerCase();return menuData.filter(i=>{const c=categoryKey(i),h=`${i.name||''} ${i.description||''} ${c}`.toLowerCase();return (selectedCategory==='All Items'||c===selectedCategory)&&(!q||h.includes(q));});}
  function renderMenu(){
    renderTabs();const items=filteredItems(),popular=items.filter(i=>i.is_bestseller===true||i.bestseller===true||i.is_recommended===true||i.recommended===true).slice(0,4);$('popularSection').style.display=popular.length?'block':'none';
    $('popularGrid').innerHTML=popular.map(i=>{const img=imageValue(i);if(img)return `<article class="food-card"><div class="food-image"><img src="${esc(img)}" alt="${esc(i.name||'Food')}" onerror="this.closest('.food-card').classList.add('no-photo');this.parentElement.style.display='none'">${badgeHTML(badgeValue(i))}${typeIcon(typeValue(i))}</div><div class="food-body"><div class="food-title">${esc(i.name||'Unnamed item')}</div><div class="food-desc">${esc(i.description||'')}</div><div class="food-bottom">${priceDisplay(i)}</div></div></article>`;return `<article class="food-card no-photo"><div class="food-body"><div class="food-title">${typeIcon(typeValue(i),true)} ${esc(i.name||'Unnamed item')}</div><div class="food-desc">${esc(i.description||'')}</div><div class="food-bottom">${priceDisplay(i)}</div></div></article>`;}).join('');
    $('categorySections').innerHTML=categoryOrder().filter(c=>selectedCategory==='All Items'||c===selectedCategory).map(cat=>{const list=items.filter(i=>categoryKey(i)===cat);if(!list.length)return '';return `<section class="section"><div class="section-head"><div><h2>${esc(cat)}</h2><div class="section-sub">${cat==='Starters'?'Start your food journey with amazing flavors':'Delicious choices for every appetite'}</div></div><button class="see-all" onclick="selectCategory('${cat.replace(/'/g,"\\'")}')">See All →</button></div><div class="list-grid">${list.map(i=>{const img=imageValue(i);if(img)return `<article class="dish-row"><img src="${esc(img)}" alt="${esc(i.name||'Food')}" onerror="this.closest('.dish-row').classList.add('no-photo');this.remove()"><div class="dish-main"><div class="dish-name-line">${typeIcon(typeValue(i),true)}<div class="dish-title">${esc(i.name||'Unnamed item')}</div></div><div class="dish-desc">${esc(i.description||'')}</div>${priceDisplay(i,'dish-price')}</div></article>`;return `<article class="dish-row no-photo"><div class="dish-main"><div class="dish-name-line">${typeIcon(typeValue(i),true)}<div class="dish-title">${esc(i.name||'Unnamed item')}</div></div><div class="dish-desc">${esc(i.description||'')}</div>${priceDisplay(i,'dish-price')}</div></article>`;}).join('')}</div></section>`;}).join('');
    if(!items.length)$('categorySections').innerHTML='<div style="padding:30px;text-align:center;color:#667085">No menu items found.</div>';
  }
  function selectCategory(c){selectedCategory=c;renderMenu();if(c!=='All Items')$('categorySections').scrollIntoView({behavior:'smooth',block:'start'});}
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1800);}
  async function shareMenu(){if(navigator.share){try{await navigator.share({title:`${restaurant?.name||'Restaurant'} Menu`,text:'Check our menu',url:location.href});}catch(e){}}else{navigator.clipboard?.writeText(location.href);toast('Menu link copied');}}
  function shareWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(`${restaurant?.name||'Restaurant'} Menu: ${location.href}`),'_blank');}
  async function loadGrowthMenu(){
    try{
      const slug=(new URLSearchParams(location.search).get('r')||'').trim().toLowerCase();
      if(!slug){$('restaurantName').textContent='Restaurant Not Found';return;}
      const {data:rest,error:re}=await supabaseClient.from('restaurants').select('*').eq('slug',slug).limit(1).maybeSingle();if(re)throw re;if(!rest){$('restaurantName').textContent='Restaurant Not Found';return;}restaurant=rest;
      const {data:items,error:ie}=await supabaseClient.from('menu_items').select('*').eq('restaurant_id',rest.id);if(ie)throw ie;menuData=Array.isArray(items)?items:[];
      menuData.sort((a,b)=>Number(a.sort_order??a.position??999999)-Number(b.sort_order??b.position??999999)||String(a.name||'').localeCompare(String(b.name||'')));
      categories=['All Items',...categoryOrder()];renderRestaurant();renderMenu();
    }catch(e){console.error('Growth menu load error:',e);$('restaurantName').textContent='Menu Unavailable';$('categorySections').innerHTML='<div style="padding:30px;text-align:center;color:#667085">Unable to load this restaurant menu.</div>';}
  }
  $('searchInput').addEventListener('input',renderMenu);window.addEventListener('load',loadGrowthMenu);
</script>
</body>
</html>
