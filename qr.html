<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreeMenu QR</title><style>body{font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;color:#222}.box{text-align:center}.spin{width:30px;height:30px;border:3px solid #ddd;border-top-color:#e11d2e;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><p>Opening menu…</p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://pfsrpowopbrevocwsuii.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE';const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
(async()=>{try{const code=new URLSearchParams(location.search).get('code');if(!code)throw Error('QR code missing');const {data:q,error}=await db.from('qr_codes').select('restaurant_id,status').eq('code',code).maybeSingle();if(error)throw error;if(!q||q.status!=='assigned'||!q.restaurant_id)throw Error('This QR is not assigned yet');const {data:r,error:re}=await db.from('restaurants').select('slug,status,is_active').eq('id',q.restaurant_id).maybeSingle();if(re)throw re;if(!r?.slug)throw Error('Restaurant menu unavailable');if(String(r.status||'active').toLowerCase()==='blocked'||r.is_active===false)throw Error('Restaurant menu unavailable');location.replace(new URL('/menu.html?r='+encodeURIComponent(r.slug),location.origin).href);}catch(e){document.querySelector('.box').innerHTML='<h2>Menu unavailable</h2><p>'+String(e.message||e).replace(/[<>]/g,'')+'</p><p>Please contact the restaurant.</p>'}})();
</script></body></html>
