<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening FreeMenu…</title>
  <meta name="robots" content="noindex">
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7f5;color:#222}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(520px,100%);box-sizing:border-box;background:#fff;border:1px solid #e8e8e5;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.07);text-align:center}
    .spinner{width:28px;height:28px;border:3px solid #e7e7e3;border-top-color:#7b1e16;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    h1{font-size:18px;margin:0 0 8px}.msg{font-size:14px;color:#777;line-height:1.55}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div class="spinner"></div>
    <h1>Opening restaurant menu…</h1>
    <div class="msg">Please wait while we open the correct menu.</div>
  </main>
  <script>
  (() => {
    const pathParts = location.pathname.split('/').filter(Boolean);
    const lastPart = pathParts[pathParts.length - 1] || '';
    const reserved = new Set(['index.html','menu.html','engine.html','owner.html','admin.html','qr.html','404.html','cartmenu.html','menuone.html','signaturemenu.html','menugrowth.html','plans.html','drive.html']);
    let slug = '';
    try { slug = decodeURIComponent(lastPart).trim(); } catch (_) { slug = lastPart.trim(); }

    // Existing menu URLs continue to work as they are; only clean restaurant slugs are routed.
    if (!slug || reserved.has(slug.toLowerCase()) || slug.includes('/')) {
      location.replace('/index.html');
      return;
    }

    // No _redirects file is required for this client-side fallback.
    // Pass the slug explicitly so engine.html never receives a blank restaurant key.
    const target = new URL('/engine.html', location.origin);
    target.searchParams.set('r', slug);
    // Preserve a debug flag if one was explicitly requested.
    if (new URLSearchParams(location.search).get('debug') === '1') target.searchParams.set('debug', '1');
    location.replace(target.pathname + target.search);
  })();
  </script>
</body>
</html>
