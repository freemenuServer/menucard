<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Punjab Restaurant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }
        header {
            margin-bottom: 30px;
        }
        .logo {
            max-width: 150px;
            height: auto;
        }
        h1 {
            color: #b8144a;
            margin: 10px 0 5px 0;
        }
        .menu-images {
            margin: 30px auto;
            max-width: 800px;
        }
        .menu-images img {
            width: 100%;
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #ccc;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<header>
    <!-- Agar logo img folder me hai toh exact name check karein -->
    <img src="img/logo.png" alt="Urban Punjab Logo" class="logo">
    <h1>Urban Punjab Restaurant</h1>
    <p>Family Food Restaurant | Since 1971</p>
</header>

<section class="menu-images">
    <h2>Our Full Menu</h2>
    <img src="img/menu_page1.jpg" alt="Menu Page 1">
    <img src="img/menu_page2.jpg" alt="Menu Page 2">
</section>

<footer>
    <p>Address: C-207/208, Jhilmil Colony</p>
    <p>Phone: 8447000854</p>
    <p>Customer Care: 9899200045</p>
    <p>Online Order Available on Swiggy & Zomato</p>
    <p>© 2026 Urban Punjab Restaurant</p>
</footer>

</body>
</html>
