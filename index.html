<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Punjab Restaurant</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* --- General Mobile-First Styling --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }

        header {
            margin-bottom: 20px;
            padding: 10px;
        }

        .logo {
            max-width: 120px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 22px;
            margin: 5px 0;
            color: #2c3e50;
        }

        header p {
            font-size: 13px;
            color: #7f8c8d;
            margin: 0;
        }

        h2 {
            font-size: 18px;
            color: #e67e22; /* Optional color for heading */
            margin-bottom: 15px;
        }

        /* --- Menu Images Container --- */
        .menu-images-container {
            width: 100%;
            max-width: 100%; /* Default for mobile */
            margin: 0 auto;
            padding: 0;
        }

        /* Styling for the Images */
        .menu-images-container img {
            width: 100%; /* Take full width of container */
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px; /* Space between images */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* Nice shadow */
            display: block;
        }

        /* --- Footer --- */
        footer {
            margin-top: 30px;
            padding: 20px 10px;
            border-top: 1px solid #ddd;
            background-color: #fff;
            font-size: 12px;
            color: #555;
            line-height: 1.6;
            border-radius: 8px;
        }

        footer a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }

        /* ========================================================= */
        /* --- DESKTOP/PC SPECIFIC STYLING (Screen width > 768px) --- */
        /* ========================================================= */
        @media screen and (min-width: 769px) {
            body {
                padding: 30px;
            }

            h1 {
                font-size: 32px; /* Bigger heading on PC */
            }

            header p {
                font-size: 16px;
            }

            /* This is what makes the images big on PC */
            .menu-images-container {
                max-width: 1000px; /* Increase this number to make it even bigger */
                padding: 10px;
            }

            .logo {
                max-width: 150px; /* Slightly bigger logo */
            }

            h2 {
                font-size: 24px;
            }
            
            footer {
                max-width: 1000px;
                margin: 30px auto 0 auto;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<header>
    <img src="./img/logo.png" alt="Urban Punjab Logo" class="logo">
    <h1>Urban Punjab Restaurant</h1>
    <p>Family Food Restaurant | Since 1971</p>
</header>

<!-- Wraps both images in one big container -->
<main class="menu-images-container">
    <h2>Our Full Menu</h2>
    <img src="./img/menu_page1.jpg" alt="Urban Punjab Menu Page 1" loading="lazy">
    <img src="./img/menu_page2.jpg" alt="Urban Punjab Menu Page 2" loading="lazy">
</main>

<footer>
    <p>Address: C-207/208, Jhilmil Colony</p>
    <p>Phone: <a href="tel:8447000854">8447000854</a> | Customer Care: <a href="tel:9899200045">9899200045</a></p>
    <p>Online Order Available on Swiggy & Zomato</p>
    <p>© 2026 Urban Punjab Restaurant</p>
</footer>

</body>
</html>
