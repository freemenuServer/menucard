<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeMenu.in - Explore Restaurants & Digital Menus</title>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --primary: #ff4757;
      --primary-hover: #ff6b81;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; }

    /* Glassy Navbar */
    .navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; letter-spacing: -0.5px; }
    .logo span { color: var(--text-dark); }
    .owner-btn {
      background: var(--text-dark);
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .owner-btn:hover { background: #334155; transform: translateY(-1px); }

    /* Hero & Search Section */
    .hero {
      text-align: center;
      padding: 48px 20px 36px;
      background: #ffffff;
      border-bottom: 1px solid #f1f5f9;
    }
    .hero-badge {
      display: inline-block;
      background: #fff1f2;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .hero h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.5px; }
    .hero p { font-size: 15px; color: var(--text-muted); max-width: 480px; margin: 0 auto 24px; line-height: 1.5; }

    /* Search Input Styling */
    .search-box-wrapper {
      max-width: 460px;
      margin: 0 auto;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 14px 20px 14px 46px;
      font-size: 15px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
      background: #f8fafc;
    }
    .search-input:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 71, 87, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Main Container */
    .container { max-width: 900px; width: 100%; margin: 32px auto; padding: 0 16px; flex: 1; }
    .section-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .section-title { font-size: 20px; font-weight: 800; color: var(--text-dark); }
    .count-badge { font-size: 13px; color: var(--text-muted); font-weight: 600; background: #e2e8f0; padding: 3px 10px; border-radius: 12px; }

    /* Restaurant Grid */
    .restaurant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }
    
    .restaurant-card {
      background: var(--card-bg);
      border: 1px solid #f1f5f9;
      border-radius: 16px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .restaurant-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.08);
      border-color: #cbd5e1;
    }

    /* Round Logo Styling */
    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .round-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffe1e4;
      background: #fff1f2;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
    }
    
    .restaurant-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .restaurant-name { 
      font-size: 17px; 
      font-weight: 800; 
      color: var(--text-dark); 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      line-height: 1.3;
    }
    .restaurant-slug { 
      font-size: 13px; 
      color: var(--text-muted); 
      font-weight: 500; 
      margin-top: 2px;
    }

    .view-menu-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      color: var(--text-dark);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
    }
    .restaurant-card:hover .view-menu-badge {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Statuses */
    .status-box { text-align: center; padding: 60px 20px; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s ease-in-out infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { text-align: center; padding: 24px; border-top: 1px solid #e2e8f0; font-size: 13px; color: var(--text-muted); background: white; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo">FreeMenu<span>.in</span></a>
    <a href="owner.html" class="owner-btn">Owner Portal</a>
  </nav>

  <!-- Hero & Search Section -->
  <header class="hero">
    <span class="hero-badge">Digital QR Menu</span>
    <h1>Explore Restaurants</h1>
    <p>Browse registered places or search by name to view digital menus.</p>
    
    <!-- Search Bar -->
    <div class="search-box-wrapper">
      <span class="search-icon">&#128065;</span>
      <input 
        type="text" 
        id="search-input" 
        class="search-input" 
        placeholder="Search restaurant by name or code..."
        oninput="filterRestaurants()"
      />
    </div>
  </header>

  <!-- Restaurants List Container -->
  <main class="container">
    <div class="section-header">
      <h2 class="section-title">Registered Places</h2>
      <span id="res-count" class="count-badge">0</span>
    </div>

    <!-- Loading -->
    <div id="loading" class="status-box">
      <div class="spinner"></div>
      <p style="color: var(--text-muted); font-size: 14px;">Loading restaurants...</p>
    </div>

    <!-- Error -->
    <div id="error-view" class="status-box" style="display: none;">
      <p style="color: #dc2626; font-weight: 700;" id="error-msg">Failed to load restaurants.</p>
    </div>

    <!-- Restaurant Grid -->
    <div id="restaurant-grid" class="restaurant-grid" style="display: none;"></div>
  </main>

  <footer>
    &copy; FreeMenu.in &bull; Contactless Digital Menu
  </footer>

  <script>
    let supabaseClient = null;
    let allRestaurants = []; // Stores fetched list for client-side filtering

    function initSupabase() {
      const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";

      if (window.supabase && typeof window.supabase.createClient === 'function') {
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return null;
    }

    async function fetchRestaurants() {
      supabaseClient = initSupabase();

      if (!supabaseClient) {
        showError("Script loading error. Please refresh.");
        return;
      }

      try {
        const { data: restaurants, error } = await supabaseClient
          .from('restaurants')
          .select('*')
          .order('name', { ascending: true });

        if (error) {
          showError("Could not load restaurants.");
          return;
        }

        allRestaurants = restaurants || [];
        renderRestaurants(allRestaurants);
      } catch (err) {
        showError("Network error. Please try again.");
      }
    }

    function filterRestaurants() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = allRestaurants.filter(rest => {
        const nameMatch = (rest.name || '').toLowerCase().includes(query);
        const slugMatch = (rest.slug || '').toLowerCase().includes(query);
        return nameMatch || slugMatch;
      });
      renderRestaurants(filtered);
    }

    function renderRestaurants(restaurants) {
      const grid = document.getElementById('restaurant-grid');
      const loading = document.getElementById('loading');
      const countBadge = document.getElementById('res-count');

      loading.style.display = 'none';
      countBadge.innerText = restaurants.length;

      if (!restaurants || restaurants.length === 0) {
        grid.style.display = 'block';
        grid.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px 0;">No matching restaurants found.</p>';
        return;
      }

      grid.innerHTML = restaurants.map(rest => {
        const name = rest.name || 'Unnamed Restaurant';
        const slug = rest.slug || 'menu';
        const firstLetter = name.charAt(0).toUpperCase();

        const logoHtml = rest.logo_url 
          ? `<img src="${rest.logo_url}" alt="${name}" class="round-logo" onerror="this.outerHTML='<div class=\\'round-logo\\'>${firstLetter}</div>'">`
          : `<div class="round-logo">${firstLetter}</div>`;

        return `
          <a href="menu.html?r=${encodeURIComponent(slug)}" class="restaurant-card">
            <div class="card-top">
              ${logoHtml}
              <div class="restaurant-details">
                <div class="restaurant-name">${name}</div>
                <div class="restaurant-slug">@${slug}</div>
              </div>
            </div>

            <div class="view-menu-badge">
              <span>View Menu</span>
              <span>&rarr;</span>
            </div>
          </a>
        `;
      }).join('');

      grid.style.display = 'grid';
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      const errBox = document.getElementById('error-view');
      document.getElementById('error-msg').innerText = message;
      errBox.style.display = 'block';
    }

    window.addEventListener('load', fetchRestaurants);
  </script>
</body>
</html>
