<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeMenu.in - Explore Restaurants & Digital Menus</title>

  <!-- Supabase JS CDN (UMD Bundle) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --primary: #ff4757;
      --primary-hover: #ff6b81;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; }

    /* Modern Glassy Navbar */
    .navbar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; letter-spacing: -0.5px; }
    .logo span { color: var(--text-dark); }
    .owner-btn {
      background: var(--text-dark);
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .owner-btn:hover { background: #334155; transform: translateY(-1px); }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 56px 20px 40px;
      background: #ffffff;
      border-bottom: 1px solid #f1f5f9;
    }
    .hero-badge {
      display: inline-block;
      background: #fff1f2;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .hero h1 { font-size: 34px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px; }
    .hero p { font-size: 15px; color: var(--text-muted); max-width: 480px; margin: 0 auto; line-height: 1.5; }

    /* Main Container */
    .container { max-width: 900px; width: 100%; margin: 36px auto; padding: 0 16px; flex: 1; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .section-title { font-size: 20px; font-weight: 800; color: var(--text-dark); }

    /* Modern Card Layout */
    .restaurant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }
    
    .restaurant-card {
      background: var(--card-bg);
      border: 1px solid #f1f5f9;
      border-radius: 16px;
      padding: 22px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .restaurant-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.08);
      border-color: #cbd5e1;
    }
    .restaurant-icon {
      width: 44px; height: 44px;
      background: #fff1f2;
      color: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 14px;
    }
    .restaurant-name { font-size: 18px; font-weight: 800; margin-bottom: 4px; color: var(--text-dark); }
    .restaurant-slug { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; font-weight: 500; }
    
    .view-menu-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      color: var(--text-dark);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
    }
    .restaurant-card:hover .view-menu-badge {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Loading and Status */
    .status-box { text-align: center; padding: 60px 20px; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s ease-in-out infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    footer { text-align: center; padding: 28px; border-top: 1px solid #e2e8f0; font-size: 13px; color: var(--text-muted); background: white; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo">FreeMenu<span>.in</span></a>
    <a href="owner.html" class="owner-btn">Owner Portal</a>
  </nav>

  <!-- Hero Section -->
  <header class="hero">
    <span class="hero-badge">QR Digital Menu</span>
    <h1>Explore Restaurants</h1>
    <p>Browse registered restaurants or scan QR codes to view instant digital menus.</p>
  </header>

  <!-- Restaurants List Container -->
  <main class="container">
    <div class="section-header">
      <h2 class="section-title">Registered Places</h2>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="status-box">
      <div class="spinner"></div>
      <p style="color: var(--text-muted); font-size: 14px;">Loading restaurants...</p>
    </div>

    <!-- Error View -->
    <div id="error-view" class="status-box" style="display: none;">
      <p style="color: #dc2626; font-weight: 700;" id="error-msg">Failed to load restaurants.</p>
    </div>

    <!-- Grid View -->
    <div id="restaurant-grid" class="restaurant-grid" style="display: none;"></div>
  </main>

  <footer>
    &copy; FreeMenu.in &bull; Contactless Digital Menu System
  </footer>

  <script>
    let supabaseClient = null;

    function initSupabase() {
      const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";

      if (window.supabase && typeof window.supabase.createClient === 'function') {
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return null;
    }

    async function fetchRestaurants() {
      supabaseClient = initSupabase();

      if (!supabaseClient) {
        showError("Script Error. Please refresh.");
        return;
      }

      try {
        const { data: restaurants, error } = await supabaseClient
          .from('restaurants')
          .select('*')
          .order('name', { ascending: true });

        if (error) {
          showError("Could not load restaurants from database.");
          return;
        }

        renderRestaurants(restaurants);
      } catch (err) {
        showError("Network Error. Please try again.");
      }
    }

    function renderRestaurants(restaurants) {
      const grid = document.getElementById('restaurant-grid');
      const loading = document.getElementById('loading');

      loading.style.display = 'none';

      if (!restaurants || restaurants.length === 0) {
        grid.style.display = 'block';
        grid.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No restaurants added yet.</p>';
        return;
      }

      grid.innerHTML = restaurants.map(rest => {
        const firstLetter = (rest.name || 'R').charAt(0).toUpperCase();
        return `
          <a href="menu.html?r=${encodeURIComponent(rest.slug)}" class="restaurant-card">
            <div>
              <div class="restaurant-icon">${firstLetter}</div>
              <div class="restaurant-name">${rest.name || 'Unnamed Restaurant'}</div>
              <div class="restaurant-slug">@${rest.slug}</div>
            </div>
            <div class="view-menu-badge">
              <span>View Menu</span>
              <span>&rarr;</span>
            </div>
          </a>
        `;
      }).join('');

      grid.style.display = 'grid';
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      const errBox = document.getElementById('error-view');
      document.getElementById('error-msg').innerText = message;
      errBox.style.display = 'block';
    }

    window.addEventListener('load', fetchRestaurants);
  </script>
</body>
</html>
