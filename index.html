<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Punjab Restaurant</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }

        header {
            margin-bottom: 20px;
        }

        .logo {
            max-width: 130px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            margin: 5px 0;
        }

        header p {
            font-size: 14px;
            color: #666;
            margin: 0;
        }

        .menu-images {
            max-width: 600px;
            margin: 0 auto;
        }

        .menu-images img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: block;
        }

        footer {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        footer a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <img src="./img/logo.png" alt="Urban Punjab Logo" class="logo">
    <h1>Urban Punjab Restaurant</h1>
    <p>Family Food Restaurant | Since 1971</p>
</header>

<main class="menu-images">
    <h2>Our Full Menu</h2>
    <img src="./img/menu_page1.jpg" alt="Urban Punjab Menu Page 1" loading="lazy">
    <img src="./img/menu_page2.jpg" alt="Urban Punjab Menu Page 2" loading="lazy">
</main>

<footer>
    <p>Address: C-207/208, Jhilmil Colony</p>
    <p>Phone: <a href="tel:8447000854">8447000854</a></p>
    <p>Customer Care: <a href="tel:9899200045">9899200045</a></p>
    <p>Online Order Available on Swiggy & Zomato</p>
    <p>© 2026 Urban Punjab Restaurant</p>
</footer>

</body>
</html>
