<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Punjab Restaurant</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f9f9f9; text-align: center; }
        .logo { max-width: 140px; height: auto; margin-bottom: 10px; }
        .menu-container img { max-width: 100%; width: 600px; height: auto; border-radius: 8px; margin: 10px auto; display: block; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        footer { margin-top: 30px; padding-top: 15px; border-top: 1px solid #ddd; font-size: 14px; color: #444; }
        a { color: #0066cc; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <img src="./img/logo.png" onerror="this.src='./img/logo.PNG'" alt="Urban Punjab Logo" class="logo">
    <h1>Urban Punjab Restaurant</h1>
    <p>Family Food Restaurant | Since 1971</p>
</header>

<main class="menu-container">
    <h2>Our Full Menu</h2>
    <img src="./img/menu_page1.jpg" onerror="this.src='./img/menu_page1.JPG'" alt="Menu Page 1">
    <img src="./img/menu_page2.jpg" onerror="this.src='./img/menu_page2.JPG'" alt="Menu Page 2">
</main>

<footer>
    <p>Address: C-207/208, Jhilmil Colony</p>
    <p>Phone: <a href="tel:8447000854">8447000854</a></p>
    <p>Customer Care: <a href="tel:9899200045">9899200045</a></p>
    <p>Online Order Available on Swiggy & Zomato</p>
    <p>© 2026 Urban Punjab Restaurant</p>
</footer>

</body>
</html>
