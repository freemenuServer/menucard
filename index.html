<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeMenu.in - Explore Restaurants & Digital Menus</title>

  <!-- Supabase JS CDN (UMD Bundle) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    :root {
      --primary: #ff4757;
      --primary-hover: #ff6b81;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; }

    /* Navbar */
    .navbar {
      background: #ffffff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
    .logo span { color: var(--text-dark); }
    .owner-btn {
      background: var(--text-dark);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .owner-btn:hover { background: #334155; }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 48px 20px 32px;
      background: #ffffff;
      border-bottom: 1px solid #f1f5f9;
    }
    .hero h1 { font-size: 32px; font-weight: 800; margin-bottom: 12px; }
    .hero p { font-size: 16px; color: var(--text-muted); max-width: 500px; margin: 0 auto; }

    /* Main Container */
    .container { max-width: 900px; width: 100%; margin: 32px auto; padding: 0 16px; flex: 1; }
    .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text-dark); }

    /* Restaurant Grid */
    .restaurant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    
    .restaurant-card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .restaurant-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
      border-color: #cbd5e1;
    }
    .restaurant-name { font-size: 18px; font-weight: 700; margin-bottom: 6px; color: var(--text-dark); }
    .restaurant-slug { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
    
    .view-menu-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffe1e4;
      color: var(--primary);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      width: 100%;
    }

    /* Loading and Status */
    .status-box { text-align: center; padding: 60px 20px; }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #cbd5e1;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    footer { text-align: center; padding: 24px; border-top: 1px solid #e2e8f0; font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo">FreeMenu<span>.in</span></a>
    <a href="owner.html" class="owner-btn">Owner Portal</a>
  </nav>

  <!-- Hero Section -->
  <header class="hero">
    <h1>Explore Digital Menus</h1>
    <p>Scan QR codes or browse registered restaurants to view contactless menus.</p>
  </header>

  <!-- Restaurants List Container -->
  <main class="container">
    <h2 class="section-title">Featured Restaurants</h2>

    <!-- Loading Indicator -->
    <div id="loading" class="status-box">
      <div class="spinner"></div>
      <p style="color: var(--text-muted);">Loading restaurants...</p>
    </div>

    <!-- Error View -->
    <div id="error-view" class="status-box" style="display: none;">
      <p style="color: #dc2626; font-weight: 600;" id="error-msg">Failed to load restaurants.</p>
    </div>

    <!-- Grid View -->
    <div id="restaurant-grid" class="restaurant-grid" style="display: none;"></div>
  </main>

  <footer>
    &copy; FreeMenu.in. All rights reserved.
  </footer>

  <script>
    let supabaseClient = null;

    // Supabase Initialization
    function initSupabase() {
      const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";

      if (window.supabase && typeof window.supabase.createClient === 'function') {
        return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else if (typeof createClient === 'function') {
        return createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return null;
    }

    async function fetchRestaurants() {
      supabaseClient = initSupabase();

      if (!supabaseClient) {
        showError("Supabase script not loaded. Please refresh.");
        return;
      }

      try {
        const { data: restaurants, error } = await supabaseClient
          .from('restaurants')
          .select('*')
          .order('name', { ascending: true });

        if (error) {
          showError("Could not fetch restaurants from database.");
          return;
        }

        renderRestaurants(restaurants);
      } catch (err) {
        showError("Network or Database Connection Error.");
      }
    }

    function renderRestaurants(restaurants) {
      const grid = document.getElementById('restaurant-grid');
      const loading = document.getElementById('loading');

      loading.style.display = 'none';

      if (!restaurants || restaurants.length === 0) {
        grid.style.display = 'block';
        grid.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No restaurants added yet.</p>';
        return;
      }

      // Generate clickable cards with CORRECT link format: menu.html?r=SLUG
      grid.innerHTML = restaurants.map(rest => `
        <a href="menu.html?r=${encodeURIComponent(rest.slug)}" class="restaurant-card">
          <div>
            <div class="restaurant-name">${rest.name || 'Unnamed Restaurant'}</div>
            <div class="restaurant-slug">@${rest.slug}</div>
          </div>
          <div class="view-menu-badge">View Menu &rarr;</div>
        </a>
      `).join('');

      grid.style.display = 'grid';
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      const errBox = document.getElementById('error-view');
      document.getElementById('error-msg').innerText = message;
      errBox.style.display = 'block';
    }

    window.addEventListener('load', fetchRestaurants);
  </script>
</body>
</html>
