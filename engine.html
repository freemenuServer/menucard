<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreeMenu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f5;color:#222}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .box{width:min(460px,100%);background:#fff;border:1px solid #e8e8e5;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.07);text-align:center}
    .spinner{width:28px;height:28px;border:3px solid #e7e7e3;border-top-color:#7b1e16;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    h1{font-size:18px;margin:0 0 7px}.msg{font-size:13px;color:#777;line-height:1.5}
    .error{color:#b42318}.link{display:inline-block;margin-top:16px;color:#7b1e16;font-weight:700;text-decoration:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Opening menu…</h1>
    <div class="msg" id="message">Checking the restaurant's assigned plan.</div>
  </main>

  <script>
    const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // This routing is intentionally based on the old working page's logic.
    // The restaurant's assigned plans.id -> plans.slug/name decides the public template.
    function setState(title, message, isError = false) {
      document.getElementById("title").textContent = title;
      const msg = document.getElementById("message");
      msg.textContent = message;
      msg.className = "msg" + (isError ? " error" : "");
      if (isError) document.getElementById("spinner").style.display = "none";
    }

    function goToTemplate(template, restaurantKey) {
      const url = new URL("/" + template, window.location.origin);
      url.searchParams.set("r", restaurantKey);
      window.location.replace(url.href);
    }

    async function routeRestaurant() {
      const params = new URLSearchParams(window.location.search);
      const restaurantKey = (params.get("r") || params.get("slug") || "").trim();

      if (!restaurantKey) {
        setState("Restaurant link missing", "No restaurant slug was supplied.", true);
        return;
      }

      try {
        // Keep plan_id as the source of truth, exactly like the old working routing.
        const { data: restaurants, error: restaurantError } = await supabaseClient
          .from("restaurants")
          .select("id,name,slug,plan_id,custom_plan_enabled")
          .or(`slug.eq.${restaurantKey},id.eq.${restaurantKey}`)
          .limit(1);

        if (restaurantError) throw restaurantError;

        const rest = restaurants && restaurants[0];
        if (!rest) {
          setState("Restaurant not found", "Please check the menu link and try again.", true);
          return;
        }

        const publicKey = rest.slug || rest.id;

        // === OLD WORKING ROUTING LOGIC ===
        if (rest.plan_id) {
          const { data: assignedPlan, error: planError } = await supabaseClient
            .from("plans")
            .select("id,name,slug,is_active")
            .eq("id", rest.plan_id)
            .maybeSingle();

          if (!planError && assignedPlan && assignedPlan.is_active !== false) {
            const planKey = `${assignedPlan.slug || ""} ${assignedPlan.name || ""}`.toLowerCase().trim();

            const isSignature3D =
              planKey.includes("signature 3d") ||
              planKey.includes("signature-3d") ||
              planKey.includes("signature_3d") ||
              (planKey.includes("signature") && planKey.includes("3d"));

            const isFull3D =
              planKey.includes("full 3d") ||
              planKey.includes("full-3d") ||
              planKey.includes("full_3d") ||
              (planKey.includes("full") && planKey.includes("3d"));

            const isCustomMenu = rest.custom_plan_enabled === true;

            if (isSignature3D || isFull3D || isCustomMenu) {
              goToTemplate("signaturemenu.html", publicKey);
              return;
            }

            const isGrowthPhotos =
              planKey.includes("growth") ||
              planKey.includes("growth-photos") ||
              planKey.includes("growth photos") ||
              planKey.includes("photo_menu_v1");

            if (isGrowthPhotos) {
              goToTemplate("menugrowth.html", publicKey);
              return;
            }
          }
        }

        // Free Starter / unknown active plan = standard menu.
        goToTemplate("menu.html", publicKey);
      } catch (error) {
        console.error("FreeMenu routing error:", error);
        setState("Unable to open menu", "The restaurant or its plan could not be checked. Please try again.", true);
      }
    }

    routeRestaurant();
  </script>
</body>
</html>
