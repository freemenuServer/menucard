<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>FreeMenu • Opening Menu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f5;color:#222}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .box{width:min(460px,100%);background:#fff;border:1px solid #e8e8e5;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.07);text-align:center}
    .spinner{width:28px;height:28px;border:3px solid #e7e7e3;border-top-color:#7b1e16;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    h1{font-size:18px;margin:0 0 7px}.msg{font-size:13px;color:#777;line-height:1.5}.error{color:#b42318}
    .debug{display:none;margin-top:16px;padding:10px;border-radius:10px;background:#f5f5f2;text-align:left;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
    .link{display:inline-block;margin-top:16px;color:#7b1e16;font-weight:700;text-decoration:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Opening menu…</h1>
    <div class="msg" id="message">Checking the restaurant's assigned plan.</div>
    <div class="debug" id="debug"></div>
  </main>

<script>
(() => {
  const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = id => document.getElementById(id);

  function setState(title, message, error = false) {
    $("title").textContent = title;
    $("message").textContent = message;
    $("message").className = "msg" + (error ? " error" : "");
    if (error) $("spinner").style.display = "none";
  }

  function debug(info) {
    // Hidden by default. Add ?debug=1 to the engine URL while testing.
    if (new URLSearchParams(location.search).get("debug") === "1") {
      $("debug").style.display = "block";
      $("debug").textContent = typeof info === "string" ? info : JSON.stringify(info, null, 2);
    }
  }

  function go(template, restaurantKey) {
    const target = new URL("/" + template, location.origin);
    target.searchParams.set("r", restaurantKey);
    location.replace(target.href);
  }

  async function findRestaurant(key) {
    // IMPORTANT: do NOT use .or(slug.eq...,id.eq...) here.
    // restaurants.id is UUID while slug is text; an invalid UUID in an OR
    // expression can make the whole Supabase query fail.
    let result = await supabaseClient
      .from("restaurants")
      .select("id,name,slug,plan_id,plan,custom_plan_enabled")
      .eq("slug", key)
      .maybeSingle();

    if (result.error) throw result.error;
    if (result.data) return result.data;

    // UUID fallback for direct engine links using ?r=<restaurant-id>.
    if (/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(key)) {
      result = await supabaseClient
        .from("restaurants")
        .select("id,name,slug,plan_id,plan,custom_plan_enabled")
        .eq("id", key)
        .maybeSingle();
      if (result.error) throw result.error;
      if (result.data) return result.data;
    }

    return null;
  }

  async function findAssignedPlan(rest) {
    // OLD WORKING LOGIC: restaurants.plan_id -> plans.id -> plans.slug/name.
    if (rest.plan_id) {
      const { data, error } = await supabaseClient
        .from("plans")
        .select("id,name,slug,is_active")
        .eq("id", rest.plan_id)
        .maybeSingle();

      if (error) throw error;
      if (data) return data;
    }

    // Backward-compatible fallback only when there is no usable plan_id.
    // This does not override a valid plan_id.
    const legacy = String(rest.plan || "").trim().toLowerCase();
    const legacySlugMap = {
      free: "free-starter",
      starter: "free-starter",
      "free-starter": "free-starter",
      growth: "growth-photos",
      premium: "growth-photos",
      "growth-photos": "growth-photos",
      signature: "signature-3d",
      "signature-3d": "signature-3d",
      signature_3d: "signature-3d",
      "full-3d": "full-3d-experience",
      "full_3d": "full-3d-experience",
      "full-3d-experience": "full-3d-experience"
    };

    const legacySlug = legacySlugMap[legacy];
    if (!legacySlug) return null;

    const { data, error } = await supabaseClient
      .from("plans")
      .select("id,name,slug,is_active")
      .eq("slug", legacySlug)
      .maybeSingle();

    if (error) throw error;
    return data || null;
  }

  function chooseTemplate(rest, plan) {
    // This block intentionally mirrors the old working page's routing logic.
    // Source: assigned plan slug/name + custom_plan_enabled.
    if (plan && plan.is_active !== false) {
      const planKey = `${plan.slug || ""} ${plan.name || ""}`.toLowerCase().trim();

      const isSignature3D =
        planKey.includes("signature 3d") ||
        planKey.includes("signature-3d") ||
        planKey.includes("signature_3d") ||
        (planKey.includes("signature") && planKey.includes("3d"));

      const isFull3D =
        planKey.includes("full 3d") ||
        planKey.includes("full-3d") ||
        planKey.includes("full_3d") ||
        (planKey.includes("full") && planKey.includes("3d"));

      const isCustomMenu = rest.custom_plan_enabled === true;

      if (isSignature3D || isFull3D || isCustomMenu) {
        return "signaturemenu.html";
      }

      const isGrowthPhotos =
        planKey.includes("growth") ||
        planKey.includes("growth-photos") ||
        planKey.includes("growth photos") ||
        planKey.includes("photo_menu_v1");

      if (isGrowthPhotos) {
        return "menugrowth.html";
      }
    }

    return "menu.html";
  }

  async function route() {
    const params = new URLSearchParams(location.search);
    const key = (params.get("r") || params.get("slug") || "").trim().toLowerCase();

    if (!key) {
      setState("Restaurant link missing", "No restaurant slug was supplied.", true);
      return;
    }

    try {
      const rest = await findRestaurant(key);
      if (!rest) {
        debug({key, error:"restaurant not found"});
        setState("Restaurant not found", "Please check the menu link and try again.", true);
        return;
      }

      const plan = await findAssignedPlan(rest);
      const template = chooseTemplate(rest, plan);
      const publicKey = rest.slug || rest.id;

      debug({
        requestedKey:key,
        restaurant:{id:rest.id,name:rest.name,slug:rest.slug,plan_id:rest.plan_id,plan:rest.plan,custom_plan_enabled:rest.custom_plan_enabled},
        assignedPlan:plan,
        selectedTemplate:template,
        target:`/${template}?r=${publicKey}`
      });

      go(template, publicKey);
    } catch (error) {
      console.error("FreeMenu engine routing error:", error);
      debug({message:error?.message || String(error), details:error});
      setState("Unable to open menu", "The restaurant or its assigned plan could not be checked.", true);
    }
  }

  route();
})();
</script>
</body>
</html>
