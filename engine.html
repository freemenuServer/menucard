<script>
const SUPABASE_URL =
  "https://pfsrpowopbrevocwsuii.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   PLAN → TEMPLATE MAPPING
   ========================================================= */

const PLAN_TEMPLATES = {
  "free-starter": "menu.html",
  "growth-photos": "menugrowth.html",
  "signature-3d": "signaturemenu.html",
  "full-3d-experience": "signaturemenu.html"
};


/* =========================================================
   OLD PLAN NAME COMPATIBILITY
   ========================================================= */

const LEGACY_PLAN_MAP = {
  "free": "free-starter",
  "starter": "free-starter",

  "growth": "growth-photos",
  "premium": "growth-photos",

  "signature": "signature-3d",
  "signature_3d": "signature-3d",

  "full-3d": "full-3d-experience",
  "full_3d": "full-3d-experience"
};


function canonicalPlanSlug(value) {
  const slug = String(value || "")
    .trim()
    .toLowerCase();

  return LEGACY_PLAN_MAP[slug] || slug;
}


/* =========================================================
   GET RESTAURANT
   ========================================================= */

async function getRestaurant(slug) {

  const { data, error } =
    await supabaseClient
      .from("restaurants")
      .select(`
        id,
        name,
        slug,
        plan_id,
        plan
      `)
      .eq("slug", slug)
      .maybeSingle();

  if (error) {
    throw new Error(
      "Restaurant lookup failed: " + error.message
    );
  }

  if (!data) {
    throw new Error("Restaurant not found.");
  }

  return data;
}


/* =========================================================
   GET ASSIGNED PLAN
   ========================================================= */

async function getAssignedPlan(restaurant) {

  /*
   * PRIMARY SOURCE
   * restaurants.plan_id
   */

  if (restaurant.plan_id) {

    const { data, error } =
      await supabaseClient
        .from("plans")
        .select(`
          id,
          name,
          slug,
          template_file,
          qr_stickers_max,
          signature_3d_dishes_max,
          features,
          is_active
        `)
        .eq("id", restaurant.plan_id)
        .maybeSingle();

    if (error) {
      throw new Error(
        "Plan lookup failed: " + error.message
      );
    }

    if (data) {
      return data;
    }
  }


  /*
   * LEGACY FALLBACK
   *
   * Only used if plan_id is missing or invalid.
   */

  const legacySlug =
    canonicalPlanSlug(restaurant.plan);

  if (legacySlug) {

    const { data, error } =
      await supabaseClient
        .from("plans")
        .select(`
          id,
          name,
          slug,
          template_file,
          qr_stickers_max,
          signature_3d_dishes_max,
          features,
          is_active
        `)
        .eq("slug", legacySlug)
        .maybeSingle();

    if (error) {
      throw new Error(
        "Legacy plan lookup failed: " +
        error.message
      );
    }

    if (data) {
      return data;
    }
  }


  throw new Error(
    "No plan is assigned to this restaurant."
  );
}


/* =========================================================
   RESOLVE TEMPLATE
   ========================================================= */

function resolveTemplate(plan) {

  const planSlug =
    canonicalPlanSlug(plan?.slug);

  /*
   * First preference:
   * template_file stored on plans table
   */

  if (
    plan?.template_file &&
    String(plan.template_file).trim()
  ) {
    return String(plan.template_file).trim();
  }

  /*
   * Safe automatic fallback
   */

  const template =
    PLAN_TEMPLATES[planSlug];

  if (!template) {
    throw new Error(
      "No template configured for plan: " +
      planSlug
    );
  }

  return template;
}


/* =========================================================
   REDIRECT
   ========================================================= */

async function routeRestaurant() {

  const params =
    new URLSearchParams(location.search);

  const restaurantSlug =
    String(
      params.get("r") ||
      params.get("slug") ||
      ""
    )
      .trim()
      .toLowerCase();


  if (!restaurantSlug) {
    throw new Error(
      "Restaurant slug missing."
    );
  }


  /* Restaurant */

  const restaurant =
    await getRestaurant(
      restaurantSlug
    );


  /* Assigned plan */

  const plan =
    await getAssignedPlan(
      restaurant
    );


  /* Template */

  const template =
    resolveTemplate(plan);


  /*
   * Expose settings for debugging
   */

  window.fmMenuSettings = {
    restaurantId: restaurant.id,
    restaurantSlug: restaurant.slug,

    planId: plan.id,
    planSlug: plan.slug,
    planName: plan.name,

    templateFile: template,

    qrLimit:
      Number(plan.qr_stickers_max) || 0,

    arLimit:
      Number(plan.signature_3d_dishes_max) || 0,

    features:
      Array.isArray(plan.features)
        ? plan.features
        : []
  };


  console.log(
    "FreeMenu Plan Routing:",
    window.fmMenuSettings
  );


  /*
   * Final destination
   */

  const target =
    new URL(
      "/" + template,
      location.origin
    );

  target.searchParams.set(
    "r",
    restaurant.slug
  );


  /*
   * Replace current URL.
   * No extra history entry.
   */

  window.location.replace(
    target.toString()
  );
}


/* =========================================================
   START
   ========================================================= */

routeRestaurant().catch(error => {

  console.error(
    "FreeMenu Plan Engine Error:",
    error
  );

  document.body.innerHTML = `
    <div style="
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:system-ui,sans-serif;
      background:#f6f7fb;
    ">
      <div style="
        width:min(520px,100%);
        background:#fff;
        border:1px solid #e5e7eb;
        border-radius:20px;
        padding:24px;
        box-shadow:0 20px 60px #0001;
      ">
        <h2 style="margin:0 0 8px">
          Menu Routing Error
        </h2>

        <p style="
          color:#6b7280;
          line-height:1.6;
        ">
          ${String(error.message || "Unknown error")
            .replace(/[&<>"']/g, c => ({
              "&":"&amp;",
              "<":"&lt;",
              ">":"&gt;",
              '"':"&quot;",
              "'":"&#39;"
            }[c]))}
        </p>
      </div>
    </div>
  `;
});
</script>
