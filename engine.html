<!doctype html>
<html lang="en"> 
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FreeMenu</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7f5;color:#222}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .box{width:min(520px,100%);background:#fff;border:1px solid #e8e8e5;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.07);text-align:center}
    .spinner{width:28px;height:28px;border:3px solid #e7e7e3;border-top-color:#7b1e16;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
    h1{font-size:18px;margin:0 0 8px}.msg{font-size:13px;color:#777;line-height:1.55;word-break:break-word}.error{color:#b42318}
    .debug{margin-top:16px;padding:12px;border-radius:12px;background:#f6f6f3;text-align:left;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Opening menu…</h1>
    <div class="msg" id="message">Checking the restaurant's assigned plan.</div>
    <pre class="debug" id="debug"></pre>
  </main>

<script>
(() => {
  const SUPABASE_URL = "https://pfsrpowopbrevocwsuii.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_r3K8YKzV0ZHQxvXfkNimkw_e5E8EPmE";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const debugMode = new URLSearchParams(location.search).get("debug") === "1";

  const $ = id => document.getElementById(id);
  function state(title, message, error=false) {
    $("title").textContent = title;
    $("message").textContent = message;
    $("message").className = "msg" + (error ? " error" : "");
    if (error) $("spinner").style.display = "none";
  }
  function debug(data) {
    if (!debugMode) return;
    const el = $("debug");
    el.style.display = "block";
    el.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
  }
  function go(template, slug) {
    const target = new URL("/" + template, location.origin);
    target.searchParams.set("r", slug);
    location.replace(target.href);
  }

  async function findRestaurant(key) {
    // Clean public URLs always contain a slug. This is deliberately NOT an
    // OR query with id=key because Supabase/Postgres can reject a non-UUID
    // value when id is a uuid column.
    const slug = String(key || "").trim().toLowerCase();
    if (!slug) return { data:null, error:new Error("Missing restaurant slug") };

    let result = await supabaseClient
      .from("restaurants")
      .select("id,name,slug,plan_id,plan,custom_plan_enabled")
      .eq("slug", slug)
      .maybeSingle();

    // Optional UUID fallback for direct /engine.html?r=<uuid> links.
    if (!result.data && !result.error && /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(slug)) {
      result = await supabaseClient
        .from("restaurants")
        .select("id,name,slug,plan_id,plan,custom_plan_enabled")
        .eq("id", slug)
        .maybeSingle();
    }
    return result;
  }

  async function getAssignedPlan(rest) {
    // Primary source: restaurants.plan_id -> plans.id.
    if (rest.plan_id) {
      const { data, error } = await supabaseClient
        .from("plans")
        .select("id,name,slug,is_active")
        .eq("id", rest.plan_id)
        .maybeSingle();

      if (!error && data && data.is_active !== false) return data;
    }

    // Backward compatibility only. New assignments should use plan_id.
    const legacy = String(rest.plan || "").trim().toLowerCase();
    const legacySlug = {
      free: "free-starter",
      starter: "free-starter",
      "free-starter": "free-starter",
      growth: "growth-photos",
      premium: "growth-photos",
      "growth-photos": "growth-photos",
      signature: "signature-3d",
      "signature-3d": "signature-3d",
      signature_3d: "signature-3d",
      "full-3d": "full-3d-experience",
      "full_3d": "full-3d-experience",
      "full-3d-experience": "full-3d-experience"
    }[legacy];

    if (legacySlug) {
      const { data, error } = await supabaseClient
        .from("plans")
        .select("id,name,slug,is_active")
        .eq("slug", legacySlug)
        .maybeSingle();
      if (!error && data && data.is_active !== false) return data;
    }
    return null;
  }

  function resolveTemplate(rest, plan) {
    // Exact routing behavior from the old working page.
    if (!plan) return "menu.html";

    const planKey = `${plan.slug || ""} ${plan.name || ""}`.toLowerCase().trim();

    const isSignature3D =
      planKey.includes("signature 3d") ||
      planKey.includes("signature-3d") ||
      planKey.includes("signature_3d") ||
      (planKey.includes("signature") && planKey.includes("3d"));

    const isFull3D =
      planKey.includes("full 3d") ||
      planKey.includes("full-3d") ||
      planKey.includes("full_3d") ||
      (planKey.includes("full") && planKey.includes("3d"));

    const compactPlanKey = planKey.replace(/[^a-z0-9]/g, "");
    const isCartMenu =
      compactPlanKey.includes("cartmenu") ||
      compactPlanKey.includes("cartmenupage");
    const isMenuOne =
      compactPlanKey.includes("menuone") ||
      compactPlanKey.includes("menuonepage");

    if (isCartMenu) return "cartmenu.html";
    if (isMenuOne) return "menuone.html";

    const isCustomMenu = rest.custom_plan_enabled === true;

    if (isSignature3D || isFull3D || isCustomMenu) return "signaturemenu.html";

    const isGrowthPhotos =
      planKey.includes("growth") ||
      planKey.includes("growth-photos") ||
      planKey.includes("growth photos") ||
      planKey.includes("photo_menu_v1");

    if (isGrowthPhotos) return "menugrowth.html";

    return "menu.html";
  }

  function getRestaurantKey() {
    const params = new URLSearchParams(location.search);
    // 1) Preserve the existing query-string routes.
    const queryKey = (params.get("r") || params.get("slug") || "").trim();
    if (queryKey) return queryKey;

    // 2) Support clean path routes such as /engine/urbanpunjab.
    const parts = location.pathname.split("/").filter(Boolean);
    const last = parts.length ? parts[parts.length - 1] : "";
    if (last && !["engine", "engine.html", "index.html"].includes(last.toLowerCase())) {
      return decodeURIComponent(last).trim();
    }

    // 3) If hosting redirected /restaurant-slug to /engine and dropped the
    // slug, try recovering it from the original same-site referrer path.
    try {
      const ref = document.referrer ? new URL(document.referrer) : null;
      if (ref && ref.origin === location.origin) {
        const refParts = ref.pathname.split("/").filter(Boolean);
        const refLast = refParts.length ? refParts[refParts.length - 1] : "";
        if (refLast && !["engine", "engine.html", "index.html", "404.html"].includes(refLast.toLowerCase())) {
          return decodeURIComponent(refLast).trim();
        }
        const refParams = new URLSearchParams(ref.search);
        const refKey = (refParams.get("r") || refParams.get("slug") || "").trim();
        if (refKey) return refKey;
      }
    } catch (_) {}
    return "";
  }

  async function route() {
    const key = getRestaurantKey();
    if (!key) {
      state("Restaurant link missing", "The clean URL reached /engine without a restaurant slug. Configure hosting to forward /<slug> to /engine.html?r=<slug> (or /engine/<slug>).", true);
      return;
    }

    try {
      const { data: rest, error: restError } = await findRestaurant(key);
      if (restError) throw restError;
      if (!rest) {
        state("Restaurant not found", "No restaurant matched this menu URL.", true);
        debug({ restaurantKey:key, error:"No restaurant found" });
        return;
      }

      const plan = await getAssignedPlan(rest);
      const template = resolveTemplate(rest, plan);
      const publicSlug = rest.slug || key;

      debug({
        restaurant:{id:rest.id,name:rest.name,slug:rest.slug,plan_id:rest.plan_id,legacy_plan:rest.plan,custom_plan_enabled:rest.custom_plan_enabled},
        assignedPlan:plan,
        resolvedTemplate:template,
        target:`/${template}?r=${publicSlug}`
      });

      go(template, publicSlug);
    } catch (err) {
      console.error("FreeMenu engine routing error", err);
      state("Unable to open menu", "Could not read the restaurant's assigned plan.", true);
      debug({ error: String(err && (err.message || err)), hint:"Check Supabase RLS for public SELECT on restaurants and active plans." });
    }
  }

  route();
})();
</script>
</body>
</html>
